name: CI

# Runs every test/check this repo already has a `make` target for, on
# every push to main and every PR targeting it -- see
# docs/tech-debt-audit.md ("No CI at all", priority 50, the highest-
# scored item in that audit). Before this existed, every one of these
# was a `make` target a human had to remember to run by hand; this
# session alone shipped two regressions (a backwards rate-limiter test
# assertion, a duplicate-registration test whose fake resolver didn't
# exercise the case it claimed to) that would have merged clean on
# `git push` alone without one.
#
# Every job below reuses the exact same Docker-based commands the
# Makefile already runs locally (`make test-api`, `make test-postgres`,
# etc.) rather than reimplementing them differently here -- so "passes
# in CI" and "passes on a contributor's own machine" mean the same
# thing, and a fix for one is a fix for both. ubuntu-latest runners come
# with Docker preinstalled, which is all any of these need.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege for every job below. GITHUB_TOKEN defaults to whatever
# the repository's own Actions setting says -- historically
# read-and-write, and still write for many repos -- which means a
# compromised or merely careless step in ANY job could push commits,
# move tags, or edit releases. Nothing in this workflow needs to write
# anything: every job checks the code out and runs a `make` target.
#
# Declared here so it applies to jobs added later too. A job that
# genuinely needs more (publishing an image, attesting provenance,
# commenting on a PR) should widen it with its own `permissions:` block
# rather than loosening this one -- that keeps the extra scope visible
# in the diff that introduces it, and confined to the one job.
permissions:
  contents: read

jobs:
  # go test ./... against MemStore -- no database needed. See `make
  # test-api` in the Makefile.
  test-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: make test-api
        run: make test-api

  # go test -tags=postgres_integration against a real, throwaway
  # Postgres container -- exercises PostgresStore, the persistence path
  # production actually uses, which test-api's MemStore-only run never
  # touches (see docs/tech-debt-audit.md, "PostgresStore's real logic
  # only runs under a build tag nobody automates"). Reuses `make
  # test-postgres` verbatim rather than a GitHub Actions "services:"
  # Postgres container, so this is the exact same command a contributor
  # runs locally -- --network host works here the same way it does on
  # Colima (a real Linux host), unlike Docker Desktop on macOS (see that
  # target's own comment in the Makefile).
  test-postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: make test-postgres
        run: make test-postgres

  # Starts a real, throwaway monitor-api and Postgres and curls
  # /swagger, /openapi.yaml, and the README-documented API examples
  # against them for real -- see cluster/test-swagger-docs.sh and `make
  # test-swagger-docs`. Separate job from test-api for the same reason
  # test-postgres is: needs --network host, which doesn't work on
  # Docker Desktop for macOS (fine here -- ubuntu-latest is a real Linux
  # host).
  test-swagger-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: make test-swagger-docs
        run: make test-swagger-docs
  # The backup/restore shell logic, actually executed -- helm lint,
  # helm template and check-helm-manifests.sh all check these two files
  # as text and run none of them. See cluster/test-backup-scripts.sh.
  test-backup-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: make test-backup-scripts
        run: make test-backup-scripts

  # Node+jsdom test suite for dashboard/index.html. See `make
  # test-dashboard`.
  test-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: make test-dashboard
        run: make test-dashboard

  # Catches dashboard/index.html being edited without updating the copy
  # the Helm chart actually serves (charts/supply-chain-monitor/files/index.html)
  # -- see the Makefile target's own comment for the exact bug this
  # exists to catch, which has shipped once already.
  check-dashboard-configmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: make check-dashboard-configmap
        run: make check-dashboard-configmap

  # Parses internal/api/openapi.yaml and resolves every $ref in it.
  # Nothing else does either: the spec is served as raw bytes, and
  # TestOpenAPISpec_DescribesEveryRegisteredRoute only greps it for
  # substrings -- so a broken indent or a $ref pointing at a schema
  # that doesn't exist passes the whole suite and fails only in
  # somebody's browser. See cluster/check-openapi-spec.rb's header.
  check-openapi-spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: make check-openapi-spec
        run: make check-openapi-spec

  # promtool over the alert rules. Invalid PromQL makes Prometheus
  # reject the whole rule file, so alerts that look configured simply
  # never evaluate -- and helm-lint/helm-template both pass on it,
  # because to them a rule is just a string in a CRD.
  # Duplicate mapping keys in the rendered chart. Helm accepts them
  # (last value wins) and Flux rejects them at apply time, so this is
  # invisible to helm-lint and helm-template but fails the deploy.
  check-duplicate-keys:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: make check-duplicate-keys
        run: make check-duplicate-keys

  check-alert-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: make check-alert-rules
        run: make check-alert-rules

  # Static analysis over cluster/*.sh (13 scripts, ~1,100 lines) -- see
  # docs/tech-debt-audit.md, "No lint on cluster/*.sh". This exact class
  # of script (podman.sh especially) has had several real bugs this
  # project already hit by hand (a SCRIPT_DIR variable collision from
  # `source`-ing rather than sub-processing, `set -e` silently
  # swallowing a failed curl/jq call) that shellcheck's static checks
  # are built to catch before they ship, not just this specific history
  # of ones already found and fixed.
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run shellcheck against cluster/*.sh
        run: |
          shopt -s globstar
          shellcheck cluster/**/*.sh

  # Structural lint only -- see helm-template below for the check that
  # actually caught this chart's one real regression (a document
  # rendering without apiVersion, which lint doesn't validate).
  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: make helm-lint
        run: make helm-lint

  # Renders the chart for real and checks every emitted document has
  # an apiVersion -- see cluster/check-helm-manifests.sh's own header.
  helm-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: make helm-template
        run: make helm-template

  # Builds services/monitor-api's image and asserts the properties its
  # Dockerfile exists to guarantee (non-root uid, static CGO_ENABLED=0
  # binary, every bundled tool runnable, no downloader left in the
  # runtime layer) -- see `make test-image`.
  #
  # Nothing built this image in CI before, so a Dockerfile regression
  # only ever surfaced when a human next ran `make build`. It matters
  # more now that the image verifies a sha256 for each tool it
  # downloads: those checksums are per-architecture, and ubuntu-latest
  # is the only place in this project's toolchain where the amd64 branch
  # actually runs (an Apple Silicon dev machine can build the arm64 one
  # natively, but qemu cannot emulate the Go toolchain well enough to
  # build the amd64 image end to end -- `go mod download` dies with a
  # register dump). A wrong amd64 checksum would otherwise be invisible
  # until someone built on an amd64 host.
  # NOTE ON BUILD PROVENANCE (actions/attest-build-provenance):
  # deliberately not wired up here, even though this job does build an
  # image. Attestation binds a signed statement to a specific artifact
  # DIGEST that a consumer can later verify -- and this job pushes
  # nothing. It builds the image, asserts properties, and throws it
  # away; monitor-api:dev is built locally by `make build` and imported
  # straight into k3d, never pulled from a registry by anyone.
  #
  # Attesting an image nobody can fetch would be ceremony, and it is not
  # free: it needs `id-token: write` and `attestations: write`, widening
  # exactly the permissions this workflow just narrowed. Add it in the
  # same change that introduces a job which PUSHES a tagged image, where
  # the digest and the audience both exist.
  test-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: make test-image
        run: make test-image

  # Misconfiguration scan of this repo's own Helm chart and Dockerfile
  # -- `trivy config`, the same tool this project points at other
  # people's artifacts, aimed at what it ships itself. Gating: both are
  # clean today, so a finding here is a regression, not backlog. The two
  # known exceptions are written down with reasons in .trivyignore.
  trivy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: make trivy-config
        run: make trivy-config

  # govulncheck: Go vulnerabilities this code actually REACHES, by call
  # graph, rather than everything present in the dependency tree. That
  # call-graph filtering is the point -- it is the difference between
  # "a CVE exists somewhere in your module graph" and "your code calls
  # the vulnerable function".
  #
  # GATING. It reports zero today, so a finding here is a real
  # regression: either a dependency picked one up, or new code started
  # calling a vulnerable symbol that was already present and unreached.
  #
  # Getting to zero took the two bumps in this same change -- the Go
  # toolchain (10 standard-library advisories, which are a property of
  # the compiler that builds the binary, not of any dependency) and
  # pgx/x/text (2 module-level, one of them a SQL injection). Keep
  # `make vulncheck` and the Dockerfile on the same Go version, or this
  # job starts reporting on a toolchain the shipped binary does not use.
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: make vulncheck
        run: make vulncheck

  # Builds the monitor-api image for BOTH architectures and pushes it to
  # ghcr.io, then attests its provenance.
  #
  # WHY MULTI-ARCH IS NOT OPTIONAL HERE. The runners are amd64 and the
  # dev cluster is arm64 (k3d on Apple Silicon), so an amd64-only push
  # would produce an image the only consumer cannot run. Both arches are
  # cheap now that the Dockerfile's Go stages are pinned to
  # $BUILDPLATFORM and cross-compile (CGO_ENABLED=0), rather than running
  # the Go toolchain under QEMU -- which measurably does not work on this
  # project. QEMU is still set up because the tool-download stages do run
  # under the target platform, but those are wget and sha256sum, not a
  # compiler.
  #
  # PUSH TO main ONLY, never on pull_request: a PR from a fork must not
  # be able to publish an image under this repository's name, and
  # GITHUB_TOKEN is read-only for fork PRs anyway, so the job would fail
  # confusingly rather than be denied cleanly.
  #
  # Gated behind the test jobs. An image that is published before its
  # own tests pass is an image someone can deploy before its own tests
  # pass.
  publish-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test-api, test-dashboard, test-image, helm-template]
    runs-on: ubuntu-latest
    # Widened here rather than at the top of the file, per the
    # permissions comment there: the extra scope stays visible in the
    # diff that introduces it and confined to the one job that needs it.
    #
    # id-token/attestations are what actions/attest-build-provenance
    # needs to mint a signed statement bound to the pushed DIGEST -- the
    # thing ci.yml's test-image comment said to add "in the same change
    # that introduces a job which PUSHES a tagged image". This is that
    # change.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ghcr.io requires an all-lowercase path, and this repository's
      # owner is not (Sifungurux). Computed once rather than relying on
      # ${{ github.repository }} happening to be lowercase.
      - name: Compute image reference
        id: ref
        run: |
          echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/monitor-api" >> "$GITHUB_OUTPUT"
          # Short sha, matching what `make build` stamps locally, so a
          # version string means the same thing wherever it was built.
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: services/monitor-api
          platforms: linux/amd64,linux/arm64
          push: true
          # Both a moving tag and an immutable one. `main` is what a
          # human reaches for; the sha tag is what a HelmRelease should
          # actually pin, since a moving tag plus imagePullPolicy
          # IfNotPresent is how a node ends up running something nobody
          # can identify.
          tags: |
            ${{ steps.ref.outputs.image }}:${{ steps.ref.outputs.sha }}
            ${{ steps.ref.outputs.image }}:main
          build-args: |
            GIT_SHA=${{ steps.ref.outputs.sha }}
          # Reuses layers across runs; without it every push rebuilds
          # both architectures from scratch.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Binds a signed statement to the digest just pushed, so a
      # consumer can verify this image came from this workflow and this
      # commit: `gh attestation verify oci://<image>@<digest>
      # --repo <owner>/<repo>`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.ref.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          # The attestation lives in ghcr.io next to the image, and
          # NOWHERE ELSE. The action also files a storage record with
          # GitHub's attestations API by default, and that API is closed
          # to user-owned private repositories -- the first real run of
          # this job died on exactly that, after a successful push:
          #
          #   Failed to persist attestation: Feature not available for
          #   user-owned private repositories.
          #
          # So verification reads the bundle out of the registry rather
          # than the API:
          #
          #   gh attestation verify oci://<image>@<digest> \
          #     --repo Sifungurux/supply-chain-monitor --bundle-from-oci
          #
          # Flip this back to true if the repository ever goes public or
          # moves to an org on Team/Enterprise -- the API record is what
          # makes the plain `gh attestation verify` form work.
          create-storage-record: false

      - name: Report what was published
        run: |
          {
            echo "### Published image"
            echo ""
            echo '```'
            echo "${{ steps.ref.outputs.image }}:${{ steps.ref.outputs.sha }}"
            echo "digest: ${{ steps.push.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
