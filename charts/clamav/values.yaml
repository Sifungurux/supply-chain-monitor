image:
  repository: clamav/clamav
  tag: 1.5-debian13-slim
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 250m
    memory: 1Gi
  limits:
    cpu: "1"
    memory: 2Gi

# First boot downloads the virus DB (freshclam) and can take a few
# minutes -- these generous probe settings are why (see the equivalent
# comment that used to live in k8s/clamav/deployment.yaml).
readiness:
  initialDelaySeconds: 60
  periodSeconds: 15
  failureThreshold: 20
liveness:
  initialDelaySeconds: 90
  periodSeconds: 30
