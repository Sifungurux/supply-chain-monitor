apiVersion: v2
name: dashboard
description: >-
  Static nginx-served dashboard UI for browsing registered artifacts and
  their scan findings. Deployed via Flux's HelmRelease (see
  k8s/dashboard-helmrelease.yaml). The chart embeds dashboard/index.html
  verbatim (see files/index.html and `make check-dashboard-configmap`,
  which now checks this copy instead of a hand-maintained ConfigMap).
type: application
version: 0.1.0
appVersion: "1.0"
