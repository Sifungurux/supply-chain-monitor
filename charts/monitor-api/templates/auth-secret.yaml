# Dev-only API key for monitor-api's shared-key auth -- see
# values.yaml's apiKey comment for the "generate a real one before this
# points at anything shared" caveat.
apiVersion: v1
kind: Secret
metadata:
  name: scm-monitor-api-auth
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  API_KEY: {{ .Values.apiKey | quote }}
