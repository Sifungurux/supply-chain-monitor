apiVersion: v1
kind: ConfigMap
metadata:
  name: monitor-api-config
  namespace: {{ .Release.Namespace }}
data:
  LISTEN_ADDR: {{ .Values.listenAddr | quote }}
  PIPELINE_STAGES: {{ .Values.pipelineStages | quote }}
  CLAMAV_ADDR: {{ printf "%s.%s.svc.cluster.local:%s" .Values.clamav.service .Release.Namespace .Values.clamav.port | quote }}
  REGISTRY_ADDR: {{ printf "%s.%s.svc.cluster.local:%s" .Values.registry.service .Release.Namespace .Values.registry.port | quote }}
  # Postgres holds every artifact/finding/stage-history record -- see
  # docs/architecture.md for why the in-memory store was replaced.
  # POSTGRES_PASSWORD is deliberately absent here: it comes from the
  # scm-postgres-credentials Secret (charts/postgres) via this chart's
  # deployment.yaml secretKeyRef, not this plaintext ConfigMap.
  POSTGRES_HOST: {{ printf "%s.%s.svc.cluster.local" .Values.postgres.service .Release.Namespace | quote }}
  POSTGRES_PORT: {{ .Values.postgres.port | quote }}
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
  POSTGRES_DB: {{ .Values.postgres.db | quote }}
  POSTGRES_SSLMODE: {{ .Values.postgres.sslmode | quote }}
  # unpacker (github.com/Sifungurux/unpacker) pull settings, used to
  # unpack image artifacts before ClamAV scans their contents.
  # monitor-api itself never runs unpacker directly -- these are
  # forwarded into the env of each per-scan Kubernetes Job it creates
  # (see internal/scanner/isolated_unpacker.go and docs/architecture.md,
  # "Isolating the unpack+scan step").
  UNPACKER_INSECURE: {{ .Values.unpacker.insecure | quote }}
  UNPACKER_PUBLIC: {{ .Values.unpacker.public | quote }}
  UNPACKER_MAX_FILE_MB: {{ .Values.unpacker.maxFileMB | quote }}
  # Almost always the same image monitor-api itself runs from, since
  # `monitor-api scan-worker` is the same binary in a different mode --
  # defaults to image.repository:image.tag unless scanWorkerImage is
  # explicitly overridden.
  SCAN_WORKER_IMAGE: {{ (.Values.scanWorkerImage | default (printf "%s:%s" .Values.image.repository .Values.image.tag)) | quote }}
  # Left false here -- this is the real in-cluster deployment, which
  # does have the ServiceAccount token isolation needs (see
  # serviceaccount.yaml). true is only ever meant for running the
  # monitor-api binary standalone outside Kubernetes -- see README,
  # "Running monitor-api outside a Kubernetes pod".
  DISABLE_SCAN_ISOLATION: {{ .Values.disableScanIsolation | quote }}
  # file/sbom/sarif artifacts can be registered with an OCI registry
  # reference instead of a path already inside this pod -- oras pull
  # fetches them from scm-registry first (see internal/scanner/fetch.go).
  FETCH_PLAIN_HTTP: {{ .Values.fetchPlainHTTP | quote }}
  {{- if .Values.trivyDB.enabled }}
  # air-gapped operation -- see cluster/seed-trivy-db.sh and README's
  # "Air-gapped operation".
  TRIVY_DB_REPOSITORY: {{ .Values.trivyDB.repository | quote }}
  TRIVY_JAVA_DB_REPOSITORY: {{ .Values.trivyDB.javaRepository | quote }}
  TRIVY_SKIP_DB_UPDATE: {{ .Values.trivyDB.skipUpdate | quote }}
  TRIVY_SKIP_JAVA_DB_UPDATE: {{ .Values.trivyDB.skipJavaUpdate | quote }}
  {{- end }}
