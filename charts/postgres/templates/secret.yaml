apiVersion: v1
kind: Secret
metadata:
  # Hard-coded name -- monitor-api's own chart (charts/monitor-api)
  # reads this exact Secret name via secretKeyRef, so it can't be
  # templated with the release name without also updating that
  # reference (see charts/monitor-api/values.yaml's postgres.* keys).
  name: scm-postgres-credentials
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.credentials.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.credentials.password | quote }}
  POSTGRES_DB: {{ .Values.credentials.db | quote }}
