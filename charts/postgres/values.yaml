# Default values for the postgres chart. Flux's HelmRelease
# (k8s/postgres-helmrelease.yaml) can override any of these -- credentials
# in particular are the obvious candidate once this stops being a
# throwaway local dev cluster (see credentials.password's comment below
# and docs/architecture.md's Known limitations).
image:
  repository: percona/percona-distribution-postgresql
  tag: "17.10"
  pullPolicy: IfNotPresent

credentials:
  user: monitor_api
  db: monitor_api
  # Dev-only placeholder -- same caveat as this project has always had
  # (see the comment that used to live in k8s/postgres/secret.yaml):
  # change this (and switch to a real secret-management flow, e.g.
  # sealed-secrets or an external-secrets operator) before this points
  # at anything shared. Override via this HelmRelease's spec.values,
  # never commit a real password here.
  password: changeme123

persistence:
  size: 5Gi

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 768Mi

backup:
  enabled: true
  schedule: "0 2 * * *" # daily at 02:00 UTC
  keepBackups: 7
  persistence:
    size: 5Gi
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
