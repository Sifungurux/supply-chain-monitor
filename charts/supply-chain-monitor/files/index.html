      // in-flight request outliving the page is exactly the case this
      // guard exists for.
      if (!el.isConnected) return;
      el.innerHTML = policyBadge(result);
    } catch (err) {
      // Same guard, same reason: a late failure from the artifact you
      // just navigated away from must not blank the badge now showing
      // the new one's verdict.
      if (!el.isConnected) return;
      el.innerHTML = '';
    }
  }

  // loadComponentDiff fills the "SBOM changes" placeholder. Failures
  // land in the section itself rather than the page-level status line:
  // the rest of the detail view loaded fine, and this is one section of
  // it that did not.
  async function loadComponentDiff(id) {
    var el = document.getElementById('sbom-changes');
    if (!el) return;
    try {
      var diff = await fetchJSON('/api/v1/artifacts/' + encodeURIComponent(id) + '/components/diff');
      el.innerHTML = renderComponentDiff(diff || {});
      el.className = '';
    } catch (err) {
      el.className = 'muted';
      el.textContent = sbomChangesError(err);
    }
  }

  // sbomChangesError turns a failed diff request into something a
  // reader can act on.
  //
  // A 404 here is ambiguous and the two meanings have opposite fixes:
  //
  //   - No JSON error body: this monitor-api does not have the route at
  //     all, so Go's ServeMux answered with plain text. That is a
  //     VERSION SKEW, not a broken artifact -- the dashboard ships as a
  //     ConfigMap straight from git while the API ships as an image
  //     tag, so a merge can put this section in front of a binary that
  //     predates the endpoint it calls. It has happened.
  //   - A JSON error body: the endpoint exists and is saying this
  //     artifact does not, which in practice means it was deleted in
  //     another tab while this page was open.
  //
  // Neither is worth a red error. The rest of the detail page is fine
  // and this is one section of it that has nothing to show.
  function sbomChangesError(err) {
    if (err && err.status === 404) {
      return err.apiError
        ? 'This artifact no longer exists.'
        : 'SBOM change history needs a newer monitor-api than this deployment is running.';
    }
    return 'Could not load SBOM changes — ' + (err && err.message ? err.message : 'request failed');
  }

  // pipelineTracker reuses the .stage-pill look from the "Pipeline
  // stages" summary above the table -- the same visual language for the
  // same concept (a stage), just one artifact's history instead of the
  // whole fleet's current distribution. a.stage_history already arrives
  // chronological (oldest first, per the old modal's own .reverse() to
  // show newest-first) which reads naturally left-to-right here. A
  // note, if any, is a title-attribute tooltip rather than always-on
  // text: notes can run long, and this is a single scannable line, not
  // a timeline column with room to spare.
  function pipelineTracker(a) {
    var hist = a.stage_history || [];
    if (!hist.length) return '<span class="muted">No stage events recorded yet.</span>';
    return '<div class="pipeline-track">' + hist.map(function (e) {
      var title = e.note ? esc(e.stage + ' — ' + e.note) : esc(e.stage);
      return '<div class="stage-pill" title="' + title + '">' + esc(e.stage) +
        '<span class="count">' + esc(new Date(e.timestamp).toLocaleDateString()) + '</span></div>';
    }).join('<span class="pipeline-arrow">→</span>') + '</div>';
  }

  // renderFindingsTabs shows one finding bucket at a time (state.detailTab)
  // instead of the old modal's six parallel columns -- a full page has
  // room to let one category's findings breathe (full titles, full CVE
  // ids) rather than every bucket truncating to fit six-way. Tab labels
  // still show every bucket's open count via countCell, so switching
  // categories is informed, not a guess. showId matches renderFinding's
  // original per-bucket behavior exactly (malware ids are a constant
  // signature name with no information of their own; every other bucket
  // leads with its id).
  function renderFindingsTabs(a) {
    var activeKey = state.detailTab || 'cve_findings';
    var tabsHtml = FINDING_BUCKETS.map(function (key) {
      var active = key === activeKey;
      return '<button type="button" class="tab' + (active ? ' tab-active' : '') + '" data-action="tab" data-bucket="' + key + '">' +
        BUCKET_LABELS[key] + ' ' + countCell(openFindings(a[key]).length) + '</button>';
    }).join('');

    var list = a[activeKey] || [];
    var showId = activeKey !== 'malware_findings';
    var listHtml = list.length
      ? list.map(function (f) { return renderFinding(f, a, showId); }).join('')
      : '<span class="muted">No ' + BUCKET_LABELS[activeKey].toLowerCase() + ' findings.</span>';

    return '<div class="tabs">' + tabsHtml + '</div><div class="tab-panel">' + listHtml + '</div>';
  }

  // renderDetailPage builds the full artifact detail page: identity
  // (ref/digest set large and monospace -- the digest is the artifact's
  // actual immutable identity, a tag is just a mutable label pointing at
  // it), the risk spectrum signature, pipeline history, and tabbed
  // findings. The maintainer edit form is rendered every time (not built
  // on demand when Edit is clicked) and just kept hidden -- simpler than
  // injecting markup later, and its inputs are pre-filled with the
  // artifact's current values so Cancel needs no extra state to restore.
  function renderDetailPage(a) {
    var busy = !!state.busy[a.id];
    return (
      '<div class="detail-header">' +
        '<button type="button" class="link-btn" data-action="back">← Back</button>' +
        '<div class="detail-actions">' +
          '<button type="button" data-action="scan" data-id="' + esc(a.id) + '" ' + (busy ? 'disabled' : '') + '>' +
            (busy ? 'Scanning…' : '<i class="ti ti-player-play" aria-hidden="true"></i> Scan') +
          '</button>' +
          '<button type="button" data-action="delete" data-id="' + esc(a.id) + '" data-ref="' + esc(a.ref) + '" ' + (busy ? 'disabled' : '') + '>' +
            '<i class="ti ti-trash" aria-hidden="true"></i> Delete' +
          '</button>' +
        '</div>' +
      '</div>' +
      '<h2 class="detail-ref">' + esc(a.ref) + '</h2>' +
      '<div class="detail-digest">' + (a.digest ? esc(a.digest) : '<span class="muted">digest not resolved</span>') + '</div>' +
      '<div class="modal-meta">' +
        '<span>' + esc(a.type) + '</span>' +
        '<span>' + statusBadge(a) + unsafeBadge(a) + staleBadge(a) + '<span id="policy-badge"></span></span>' +
        '<span><strong>Last scan:</strong> ' + esc(lastScanText(a)) + '</span>' +
        '<span><strong>Maintainer:</strong> ' + maintainerText(a) +
          ' <button type="button" class="link-btn" data-action="edit-maintainer">Edit</button></span>' +
        '<span><strong>Documents:</strong> ' + documentLinks(a) + '</span>' +
      '</div>' +
      '<div class="maintainer-edit" id="maintainer-edit" data-id="' + esc(a.id) + '" hidden>' +
        '<input type="text" id="maintainer-edit-team" placeholder="Team" value="' + esc(a.maintainer_team || '') + '" />' +
        '<input type="email" id="maintainer-edit-email" placeholder="Contact email" value="' + esc(a.maintainer_email || '') + '" />' +
        '<button type="button" class="primary" data-action="save-maintainer">Save</button>' +
        '<button type="button" data-action="cancel-edit-maintainer">Cancel</button>' +
      '</div>' +
      riskSpectrum(a) +
      '<h3 class="detail-section-title">Pipeline</h3>' +
      pipelineTracker(a) +
      '<h3 class="detail-section-title">SBOM changes</h3>' +
      // Filled in asynchronously by loadComponentDiff once this markup
      // is in the DOM -- renderDetailPage builds a string synchronously
      // and the diff needs its own request.
      '<div id="sbom-changes" class="muted">Loading…</div>' +
      '<h3 class="detail-section-title">Findings</h3>' +
      renderFindingsTabs(a) +
      (a.last_scan_errors && a.last_scan_errors.length ? '<div class="errs">' + a.last_scan_errors.map(esc).join('<br>') + '</div>' : '')
    );
  }

  // Delegated (bound once to detailBody, not re-attached on every render
  // the way a per-button onclick would need to be) since renderDetailPage
  // rebuilds the container's innerHTML from scratch every time it draws.
  els.detailBody.addEventListener('click', async function (ev) {
    var btn = ev.target.closest('button[data-action]');
    if (!btn) return;
    var action = btn.getAttribute('data-action');

    if (action === 'back') { goToList(); return; }
    if (action === 'tab') { state.detailTab = btn.getAttribute('data-bucket'); render(); return; }
    if (action === 'scan') { scanArtifact(btn.getAttribute('data-id')); return; }
    if (action === 'delete') { await deleteArtifact(btn.getAttribute('data-id'), btn.getAttribute('data-ref')); return; }

    if (action === 'download-sbom' || action === 'download-sarif') {
      var docID = btn.getAttribute('data-id');
      var docArtifact = state.artifacts.filter(function (x) { return x.id === docID; })[0];
      var kind = action === 'download-sbom' ? 'sbom' : 'sarif';
      var ext = kind === 'sarif' ? '.sarif' : '.json';
      var safeRef = docArtifact ? docArtifact.ref.replace(/[^a-zA-Z0-9._-]/g, '_') : docID;
      try {
        await downloadDocument(docID, kind, safeRef + '-' + kind + ext);
      } catch (err) {
        setStatus('Could not download ' + kind + ' — ' + err.message, true);
      }
      return;
    }

    var editBox = document.getElementById('maintainer-edit');
    if (!editBox) return;

    if (action === 'edit-maintainer') {
      editBox.hidden = false;
      return;
    }
    if (action === 'cancel-edit-maintainer') {
      editBox.hidden = true;
      return;
    }
    if (action === 'save-maintainer') {
      var id = editBox.getAttribute('data-id');
      var team = document.getElementById('maintainer-edit-team').value.trim();
      var email = document.getElementById('maintainer-edit-email').value.trim();
      if (!team || !email) {
        setStatus('Maintainer team and contact email are both required', true);
        return;
      }
      try {
        var updated = await fetchJSON('/api/v1/artifacts/' + id + '/maintainer', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ team: team, email: email })
        });
        for (var i = 0; i < state.artifacts.length; i++) {
          if (state.artifacts[i].id === id) { state.artifacts[i] = updated; break; }
        }
        render();
        setStatus('Maintainer updated', false);
      } catch (err) {
        setStatus('Could not update maintainer — ' + err.message, true);
      }
    }
  });

  async function scanArtifact(id) {
    state.busy[id] = true;
    render();
    try {
      await fetchJSON('/api/v1/artifacts/' + id + '/scan', { method: 'POST' });
    } catch (err) {
      setStatus('Scan failed for ' + id + ' — ' + err.message, true);
    } finally {
      delete state.busy[id];
      // Drop any cached copy first: if this artifact is being viewed
      // from a detail URL but isn't on the loaded page, the cache is
      // what renderDetailView reads, and it still holds the pre-scan
      // findings (see detailCache).
      delete detailCache[id];
      await loadAll();
    }
  }

  // deleteArtifact is permanent -- there's no undo and no soft-delete
  // (see docs/architecture.md, "Deleting an artifact"), so this is the
  // one destructive action on the dashboard that gets a confirm()
  // guard in front of it. window.confirm is a real, blocking browser
  // dialog here (not stubbed out), so the dashboard's own JS tests
  // stub window.confirm to drive both the accept and cancel paths.
  async function deleteArtifact(id, ref) {
    if (!window.confirm('Delete ' + (ref || id) + '? This cannot be undone.')) return;
    state.busy[id] = true;
    render();
    try {
      await fetchJSON('/api/v1/artifacts/' + id, { method: 'DELETE' });
      // Leaving the hash pointed at a now-deleted artifact would land on
      // the detail view's "not found" state after loadAll() below --
      // clearing it first sends a delete-from-the-detail-page back to
      // the list instead, same as a delete-from-the-table-row already
      // stays on the list.
      if (currentDetailID() === id) location.hash = '';
    } catch (err) {
      setStatus('Delete failed for ' + id + ' — ' + err.message, true);
    } finally {
      delete state.busy[id];
      delete detailCache[id];
      await loadAll();
    }
  }

  els.rows.addEventListener('click', function (ev) {
    var btn = ev.target.closest('button[data-action]');
    if (!btn) return;
    var id = btn.getAttribute('data-id');
    var action = btn.getAttribute('data-action');
    if (action === 'scan') scanArtifact(id);
    if (action === 'toggle') goToDetail(id);
    if (action === 'delete') deleteArtifact(id, btn.getAttribute('data-ref'));
  });

  // Covers back/forward navigation and any manual edit of the hash --
  // clicks that set location.hash themselves (goToDetail/goToList) also
  // call render() directly, since jsdom (and this app's own tests) don't
  // dispatch 'hashchange' synchronously the way a real browser does.
  window.addEventListener('hashchange', render);

  function openRegisterModal() {
    els.registerModalOverlay.hidden = false;
  }

  function closeRegisterModal() {
    els.registerModalOverlay.hidden = true;
  }

  els.registerLink.addEventListener('click', function (ev) {
    ev.preventDefault();
    openRegisterModal();
  });
  els.registerModalClose.addEventListener('click', closeRegisterModal);
  els.registerModalOverlay.addEventListener('click', function (ev) {
    if (ev.target === els.registerModalOverlay) closeRegisterModal();
  });

  document.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Escape') return;
    if (!els.registerModalOverlay.hidden) closeRegisterModal();
  });

  els.form.addEventListener('submit', async function (ev) {
    ev.preventDefault();
    var ref = els.ref.value.trim();
    if (!ref) return;

    var body = { ref: ref, type: els.type.value };
    var expected = els.expectedDigest.value.trim();
    if (expected) body.expected_digest = expected;

    var team = els.maintainerTeam.value.trim();
    var email = els.maintainerEmail.value.trim();
    if (!!team !== !!email) {
      setStatus('Maintainer team and contact email must both be filled in, or both left blank', true);
      return;
    }
    if (team) {
      body.maintainer_team = team;
      body.maintainer_email = email;
    }

    try {
      await fetchJSON('/api/v1/artifacts', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      els.ref.value = '';
      els.expectedDigest.value = '';
      els.maintainerTeam.value = '';
      els.maintainerEmail.value = '';
      closeRegisterModal();
      setStatus('Artifact registered', false);
      await loadAll();
    } catch (err) {
      setStatus('Could not register artifact — ' + err.message, true);
    }
  });

  els.saveApi.addEventListener('click', function () {
    state.apiBase = els.apiBase.value.trim() || DEFAULT_API_BASE;
    state.apiKey = els.apiKey.value.trim();
    localStorage.setItem('scm-api-base', state.apiBase);
    localStorage.setItem('scm-api-key', state.apiKey);
    loadAll();
  });
  els.refresh.addEventListener('click', loadAll);

  els.search.addEventListener('input', function () {
    state.searchQuery = els.search.value;
    renderRows();
  });

  // The component box is a server round trip per query, not a local
  // filter like the search box above -- so it applies on "change"
  // (Enter, or leaving the field) rather than on every keystroke, which
  // would fire a request per character of a long purl. A search input
  // also fires "change" when its native clear (×) is used, so emptying
  // it returns to the normal paginated list with no extra wiring.
  // One box, two behaviours, decided by what was typed: a full purl
  // (anything starting "pkg:") is an exact request and goes straight to
  // the artifacts, while any other text is a search for packages. That
  // keeps "I already know the purl" a paste-and-Enter away without a
  // second input or a mode switch to get wrong.
  //
  // Applied on "change" (Enter, or leaving the field) rather than on
  // every keystroke: each query is a server round trip, and a purl is
  // long. A search input also fires "change" when its native clear (×)
  // is used, so emptying it returns to the normal list with no extra
  // wiring.
  // Starting either search clears the other pair and both inputs: one
  // picker area, so one query at a time. This is the client-side twin
  // of the server's "purl wins over q" precedence -- two active
  // searches would mean two sources of truth for what is on screen.
  function resetSearches() {
    state.offset = 0;
    state.pickerMatches = [];
    state.pickerTotal = 0;
    state.componentQuery = '';
    state.componentPURL = '';
    state.findingQuery = '';
    state.findingID = '';
  }

  els.component.addEventListener('change', function () {
    var value = els.component.value.trim();
    resetSearches();
    els.finding.value = '';
    // A full purl is an exact request and skips the picker; anything
    // else is a search.
    if (value.indexOf('pkg:') === 0) {
      state.componentPURL = value;
    } else {
      state.componentQuery = value;
    }
    loadAll();
  });

  els.finding.addEventListener('change', function () {
    var value = els.finding.value.trim();
    resetSearches();
    els.component.value = '';
    // An exact finding id skips the picker the way a full purl does.
    // Recognized by shape rather than by a second input: a CVE id is
    // the overwhelmingly common case, and anything else a scanner emits
    // (an AVD rule, a ClamAV signature) is still reachable by searching
    // for it and picking.
    if (/^CVE-\d{4}-\d+$/i.test(value)) {
      state.findingID = value;
    } else {
      state.findingQuery = value;
    }
    loadAll();
  });

  els.componentPicker.addEventListener('click', function (ev) {
    var component = ev.target.closest('[data-action="pick-component"]');
    if (component) {
      // The query is kept, not cleared: it's what "back to matches"
      // returns to, and what the note names.
      state.componentPURL = component.getAttribute('data-purl');
      state.offset = 0;
      loadAll();
      return;
    }
    var finding = ev.target.closest('[data-action="pick-finding"]');
    if (finding) {
      state.findingID = finding.getAttribute('data-id');
      state.offset = 0;
      loadAll();
    }
  });

  els.searchNote.addEventListener('click', function (ev) {
    if (!ev.target.closest('[data-action="back-to-matches"]')) return;
    state.componentPURL = '';
    state.findingID = '';
    loadAll();
  });

  // Changing a filter resets to the first page: staying on offset 400
  // of the old result set would almost always land past the end of the
  // new, narrower one.
  function applyFilters() {
    state.filterStatus = els.filterStatus.value;
    state.filterType = els.filterType.value;
    state.offset = 0;
    loadAll();
  }
  els.filterStatus.addEventListener('change', applyFilters);
  els.filterType.addEventListener('change', applyFilters);

  els.pagePrev.addEventListener('click', function () {
    state.offset = Math.max(0, state.offset - state.limit);
    loadAll();
  });
  els.pageNext.addEventListener('click', function () {
    if (state.offset + state.limit >= state.total) return;
    state.offset += state.limit;
    loadAll();
  });

  loadAll();
  // The 10s refresh, guarded so it cannot destroy an edit in progress.
  //
  // render() rebuilds the detail page from scratch, and the maintainer
  // editor is the one piece of detail-page state that lives ONLY in the
  // DOM -- it is rendered hidden on every pass and revealed by the Edit
  // button, so a poll landing mid-edit re-renders it closed and discards
  // whatever had been typed. (The findings tabs survive the same
  // re-render because their selection is kept in state.detailTab; this
  // box had no equivalent.) With a 10s period that gave you a handful of
  // seconds before the box shut itself.
  //
  // Pausing beats persisting the values in state: the inputs would still
  // be REPLACED on every pass, so focus and caret position would jump
  // out of the field mid-word even with the text preserved. Nothing is
  // lost by holding still for the few seconds an edit takes -- the poll
  // resumes on Save or Cancel, both of which re-render anyway, and every
  // user-initiated refresh (paging, filtering, search) still calls
  // loadAll directly.
  setInterval(function () {
    var editing = document.getElementById('maintainer-edit');
    if (editing && !editing.hidden) return;
    loadAll();
  }, 10000);
})();
</script>
</body>
</html>
