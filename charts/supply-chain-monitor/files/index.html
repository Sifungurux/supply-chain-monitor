<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Supply chain monitor</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  /* Nordkeel design system -- tokens/components ported verbatim from
     nordkeel/src/styles/tokens/*.css and components.css (this project's
     own consultancy brand: navy/sky palette, Inter for prose, Geist Mono
     reserved for buttons/badges/data -- the "engineer-precise" pairing
     documented in that repo's spacing.css). Kept under the --scm- prefix
     dropped in favor of Nordkeel's own token names directly, so this
     stylesheet reads the same as the source system rather than as a
     second, differently-named copy of it. */
  :root {
    --c-navy: #1c4f8a;
    --c-navy-deep: #163d70;
    --c-sky: #3b91f0;
    --c-sky-light: #60a5fa;
    --c-blue-mid: #2563c4;
    --c-surface: #f5f9ff;
    --c-border: #bfdbfe;
    --c-text-dark: #1c4f8a;
    --c-text-muted: #3b82c4;
    --c-text-light: #dbeafe;
    --c-white: #ffffff;

    --steel-600: #475569;
    --steel-500: #64748b;
    --steel-400: #94a3b8;
    --steel-100: #f1f5f9;

    --green-600: #16a34a;
    --green-100: #dcfce7;
    --red-600: #dc2626;
    --red-100: #fee2e2;
    --yellow-600: #ca8a04;
    --yellow-100: #fef9c3;

    --color-bg: var(--c-surface);
    --color-surface: var(--c-white);
    --color-surface-sunken: #eef4ff;

    --text-strong: var(--c-navy);
    --text: var(--c-text-dark);
    --text-muted: var(--c-text-muted);
    --text-subtle: #4a6fa5;
    /* Bold gray, not the default UA blue -- links (currently just the
       maintainer mailto:) had never had their own rule at all, so they
       rendered in the browser's own default link color, unreadable
       against this app's surfaces. */
    --link: var(--steel-600);

    --border: var(--c-border);
    --border-strong: #93c5fd;
    --border-faint: #eff6ff;

    --primary: var(--c-navy);
    --primary-hover: var(--c-navy-deep);
    --primary-active: #112a50;
    --on-primary: var(--c-white);

    --accent: var(--c-sky);
    --accent-hover: #2563c4;
    --accent-soft: #eff6ff;

    --success: var(--green-600);
    --success-soft: var(--green-100);
    --danger: var(--red-600);
    --danger-soft: var(--red-100);
    --warning: var(--yellow-600);
    --warning-soft: var(--yellow-100);

    --focus-ring: color-mix(in srgb, var(--c-sky) 50%, transparent);

    --font-sans: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-mono: 'Geist Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;

    --radius-sm: 6px;
    --radius-md: 8px;
    --radius-lg: 12px;
    --radius-pill: 20px;

    --shadow-sm: 0 1px 2px rgba(7, 19, 28, 0.08), 0 1px 1px rgba(7, 19, 28, 0.04);
    --shadow-lg: 0 12px 28px -8px rgba(7, 19, 28, 0.20), 0 4px 10px -4px rgba(7, 19, 28, 0.10);
    --shadow-xl: 0 28px 60px -16px rgba(7, 19, 28, 0.30);

    --dur-fast: 120ms;
    --dur: 200ms;
    --ease-standard: cubic-bezier(0.4, 0, 0.2, 1);
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  }
  /* Dark ("hull") theme -- same values as nordkeel's [data-theme="dark"],
     delivered via prefers-color-scheme instead: this dashboard has no
     theme-toggle UI of its own, only ever the OS-level signal. */
  @media (prefers-color-scheme: dark) {
    :root {
      --color-bg: #0b1e38;
      --color-surface: #112a50;
      --color-surface-sunken: #0b1e38;

      --text-strong: var(--c-text-light);
      --text: #93c5fd;
      --text-muted: #60a5fa;
      --text-subtle: #3b91f0;
      --link: var(--steel-400);

      --border: rgba(59, 145, 240, 0.22);
      --border-strong: rgba(59, 145, 240, 0.38);
      --border-faint: rgba(59, 145, 240, 0.12);

      --primary: var(--c-sky-light);
      --primary-hover: var(--c-text-light);
      --on-primary: var(--c-navy);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--color-bg);
    color: var(--text);
    font: 14px/1.6 var(--font-sans);
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--border); color: var(--text-strong); }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 20px 64px; }
  header { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
  /* display:contents keeps api-row/refresh/status as direct flex items of
     header when visible, so wrapping them for a single hide toggle below
     doesn't change header's existing flex layout at all. */
  #conn-settings { display: contents; }
  #conn-settings[hidden] { display: none; }
  h1 { font-family: var(--font-sans); font-size: 20px; font-weight: 600; color: var(--text-strong); letter-spacing: -0.01em; margin: 0; flex: 1 1 auto; min-width: 200px; }
  h2 { font-family: var(--font-sans); font-size: 15px; font-weight: 600; color: var(--text-strong); margin: 0 0 10px; }
  .api-row { display: flex; align-items: center; gap: 8px; }
  .api-row label { color: var(--text-muted); font-size: 12px; }
  input, select {
    font: 14px/1 var(--font-sans);
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-strong);
    background: var(--color-surface);
    color: var(--text);
    padding: 7px 10px;
  }
  button {
    font-family: var(--font-mono); font-size: 13px; font-weight: 500;
    border-radius: var(--radius-md); border: 1px solid var(--border-strong);
    background: var(--color-surface); color: var(--text-strong);
    padding: 7px 12px;
    transition: background var(--dur-fast) var(--ease-standard), border-color var(--dur-fast) var(--ease-standard), color var(--dur-fast) var(--ease-standard);
  }
  input:focus-visible, select:focus-visible, button:focus-visible {
    outline: 3px solid var(--focus-ring); outline-offset: 2px;
  }
  button { cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  button:hover { background: var(--color-surface-sunken); border-color: var(--steel-400); }
  button:disabled { opacity: 0.55; cursor: default; }
  button.primary { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
  button.primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
  #api-base { width: 200px; }
  #api-key { width: 160px; }
  #status { font-size: 12px; color: var(--text-muted); }
  #status.error { color: var(--danger); }
  section { margin-bottom: 28px; }
  .search-row { display: flex; justify-content: center; margin: 0 0 8px; }
  #search-input { width: 320px; max-width: 100%; }
  .filter-row { display: flex; justify-content: center; align-items: center; gap: 8px; flex-wrap: wrap; margin: 0 0 6px; }
  .search-note { text-align: center; font-size: 12px; color: var(--text-muted); margin: 0 0 14px; }
  /* The component picker: matching packages, one per row, click to see
     the artifacts containing that exact purl. Deliberately not the
     artifact table -- these are packages, and reusing eleven columns
     built for artifacts would misrepresent them. */
  .pkg-row { display: flex; align-items: baseline; gap: 10px; width: 100%; text-align: left;
    border: 1px solid var(--border-faint); border-radius: var(--radius-sm);
    background: var(--surface); color: var(--text); padding: 8px 12px; margin-bottom: 6px;
    font-family: inherit; font-size: 13px; cursor: pointer; }
  .pkg-row:hover { border-color: var(--accent); }
  .pkg-name { font-weight: 600; flex: 0 0 auto; }
  .pkg-version { color: var(--text-muted); flex: 0 0 auto; }
  .pkg-license { font-size: 11px; color: var(--text-muted); font-family: var(--font-mono); }
  .pkg-purl { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; font-family: var(--font-mono, monospace); font-size: 12px; color: var(--text-muted); }
  .pkg-count { flex: 0 0 auto; font-size: 12px; color: var(--text-muted); }
  .pager { display: flex; justify-content: center; align-items: center; gap: 10px; margin: 12px 0 0; font-size: 13px; }
  .pager .range { color: var(--text-muted); font-family: var(--font-mono); }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
  .card {
    background: var(--color-surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); padding: 14px 16px;
  }
  .card .n { font-family: var(--font-mono); font-size: 24px; font-weight: 600; color: var(--text-strong); }
  .card .l { font-size: 12px; color: var(--text-muted); }
  .card-danger { border-color: var(--danger); }
  .card-danger .n { color: var(--danger); }
  .stages { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
  .stage-pill {
    flex: 0 0 auto; display: flex; align-items: center; gap: 8px;
    background: var(--color-surface); border: 1px solid var(--border);
    border-radius: var(--radius-pill); padding: 6px 14px; font-size: 13px; white-space: nowrap;
  }
  .stage-pill .count {
    font-family: var(--font-mono); background: var(--accent-soft); color: var(--accent-hover);
    border-radius: var(--radius-pill); padding: 1px 8px; font-size: 12px; font-weight: 600;
  }
  .register-form { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .register-form input[type="text"], .register-form input[type="email"] { flex: 1 1 260px; }
  table { width: 100%; border-collapse: collapse; background: var(--color-surface); border-radius: var(--radius-lg); overflow: hidden; border: 1px solid var(--border); box-shadow: var(--shadow-sm); }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border-faint); font-size: 13px; vertical-align: middle; }
  th { color: var(--text-muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; }
  tr:last-child td { border-bottom: none; }
  .ref { font-family: var(--font-mono); font-size: 12.5px; }
  .badge {
    display: inline-flex; align-items: center; font-family: var(--font-mono);
    border-radius: var(--radius-sm); padding: 3px 8px; font-size: 11px; font-weight: 500;
    letter-spacing: 0.03em; text-transform: uppercase; border: 1px solid transparent;
  }
  .badge-neutral { background: var(--steel-100); color: var(--steel-600); }
  .badge-accent { background: var(--accent-soft); color: var(--accent-hover); }
  .badge-success { background: var(--success-soft); color: var(--success); }
  .badge-warning { background: var(--warning-soft); color: var(--warning); }
  .badge-danger { background: var(--danger-soft); color: var(--danger); }
  .count-zero { color: var(--text-muted); }
  .count-nonzero { color: var(--danger); font-weight: 600; }
  .maintainer-link { color: var(--link); font-weight: 600; }
  .maintainer-link:hover { text-decoration: underline; }
  .actions { display: flex; gap: 6px; }
  .actions button { padding: 5px 10px; font-size: 12px; }
  .empty { color: var(--text-muted); padding: 24px; text-align: center; }
  .detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; padding: 4px 4px 12px; }
  .detail-col h3 { font-size: 12px; text-transform: none; color: var(--text-muted); font-weight: 600; margin: 0 0 8px; }
  .finding { display: flex; align-items: center; gap: 6px; border-radius: var(--radius-sm); padding: 6px 10px; margin-bottom: 6px; font-size: 12.5px; }
  .finding .badge { flex: 0 0 auto; }
  .finding-label { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .finding-link { flex: 0 0 auto; white-space: nowrap; color: var(--accent); font-size: 12px; }
  .finding-fixed { opacity: 0.65; }
  .timeline-item { font-size: 12.5px; padding: 4px 0; border-bottom: 1px solid var(--border-faint); }
  .timeline-item:last-child { border-bottom: none; }
  .muted { color: var(--text-muted); font-size: 12.5px; }
  .errs { color: var(--danger); font-size: 12.5px; }
  i.ti { font-size: 16px; vertical-align: -2px; }
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(11, 30, 56, 0.55);
    display: flex; align-items: center; justify-content: center;
    padding: 20px; z-index: 100;
  }
  .modal-overlay[hidden] { display: none; }
  .modal-box {
    position: relative; background: var(--color-surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg); box-shadow: var(--shadow-xl); max-width: 640px; width: 100%;
    max-height: 85vh; overflow-y: auto; padding: 20px;
  }
  .modal-box h2 { font-size: 16px; font-weight: 600; margin: 0 0 4px; padding-right: 24px; word-break: break-all; }
  .modal-close {
    position: absolute; top: 10px; right: 10px; border: none; background: transparent;
    font-size: 20px; line-height: 1; padding: 4px 8px; color: var(--text-muted);
  }
  .modal-meta {
    display: flex; flex-wrap: wrap; gap: 8px 20px; margin-bottom: 14px;
    font-size: 12.5px; color: var(--text-muted);
  }
  .modal-meta strong { color: var(--text-strong); font-weight: 600; }
  .link-btn {
    background: none; border: none; padding: 0; margin: 0; color: var(--accent);
    text-decoration: underline; cursor: pointer; font: inherit; font-family: var(--font-sans);
  }
  .maintainer-edit { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: -4px 0 14px; }
  .maintainer-edit[hidden] { display: none; }
  .maintainer-edit input { flex: 1 1 160px; }
  #detail-view[hidden] { display: none; }
  .detail-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
  .detail-actions { display: flex; gap: 6px; }
  .detail-ref {
    font-family: var(--font-mono); font-size: 26px; font-weight: 600; color: var(--text-strong);
    margin: 0 0 4px; word-break: break-all;
  }
  .detail-digest {
    font-family: var(--font-mono); font-size: 13px;
    color: var(--text-muted); margin-bottom: 14px; word-break: break-all;
  }
  .risk-spectrum, .risk-spectrum-empty { margin: 4px 0 26px; }
  .risk-bar { display: flex; height: 10px; border-radius: var(--radius-pill); overflow: hidden; background: var(--border); }
  .risk-seg { display: block; }
  .risk-danger { background: var(--danger); }
  .risk-warning { background: var(--warning); }
  .risk-neutral { background: var(--steel-400); }
  .risk-label { margin-top: 6px; font-family: var(--font-mono); font-size: 12.5px; color: var(--text-muted); }
  .detail-section-title { font-size: 12px; color: var(--text-muted); font-weight: 600; margin: 0 0 8px; }
  .sbom-diff-group { margin-bottom: 12px; }
  .sbom-diff-label { font-size: 12px; font-weight: 600; margin-bottom: 4px; }
  .sbom-diff-range { font-size: 11px; margin-bottom: 8px; }
  .pipeline-track { display: flex; align-items: center; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 26px; }
  .pipeline-arrow { color: var(--text-muted); flex: 0 0 auto; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .tab { font-size: 12px; padding: 6px 12px; }
  .tab-active { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
  .tab-panel { background: var(--color-surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); padding: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><i class="ti ti-shield-check" aria-hidden="true"></i> Supply chain monitor</h1>
    <div id="conn-settings">
      <div class="api-row">
        <label for="api-base">API</label>
        <input id="api-base" type="text" />
        <label for="api-key">Key</label>
        <input id="api-key" type="password" autocomplete="off" />
        <button id="save-api"><i class="ti ti-check" aria-hidden="true"></i></button>
      </div>
      <button id="refresh"><i class="ti ti-refresh" aria-hidden="true"></i> Refresh</button>
    </div>
    <span id="status">Connecting…</span>
  </header>

  <div id="list-view">
    <section>
      <div class="cards" id="cards"></div>
    </section>

    <section>
      <h2>Pipeline stages</h2>
      <div class="stages" id="stages"></div>
    </section>

    <section id="register-link-section" hidden>
      <a href="#" id="register-link" class="link-btn">+ Register an artifact</a>
    </section>

    <section>
      <h2>Artifacts</h2>
      <div class="search-row">
        <input type="search" id="search-input" placeholder="Search ref, digest, maintainer, stage, CVE/malware id or title…" />
      </div>
      <div class="search-row">
        <input type="search" id="component-input" aria-label="Find artifacts containing a component"
               placeholder="Find a package: openssl, or a full pkg: purl — press Enter" />
        <input type="search" id="finding-input" aria-label="Find artifacts affected by a finding"
               placeholder="Find a finding: log4j, or an exact CVE id — press Enter" />
      </div>
      <div class="filter-row">
        <select id="filter-status" aria-label="Filter by status">
          <option value="">Any status</option>
          <option value="registered">registered</option>
          <option value="scanning">scanning</option>
          <option value="scanned">scanned</option>
          <option value="failed">failed</option>
        </select>
        <select id="filter-type" aria-label="Filter by type">
          <option value="">Any type</option>
          <option value="image">image</option>
          <option value="file">file</option>
          <option value="sbom">sbom</option>
          <option value="sarif">sarif</option>
        </select>
      </div>
      <p class="search-note" id="search-note">Search only looks at the artifacts on this page — narrow the set with the status/type filters, which are applied by the server.</p>
      <div id="component-picker" hidden></div>
      <table id="artifact-table">
        <thead>
          <tr>
            <th>Ref</th><th>Type</th><th>Status</th><th>Stage</th><th>CVEs</th><th>Malware</th><th>Misconfig</th><th>Secrets</th><th>Other</th><th>Updated</th><th></th>
          </tr>
        </thead>
        <tbody id="artifact-rows"></tbody>
      </table>
      <div class="pager" id="pager">
        <button type="button" id="page-prev">← Previous</button>
        <span class="range" id="page-range"></span>
        <button type="button" id="page-next">Next →</button>
      </div>
    </section>
  </div>

  <div id="detail-view" hidden>
    <div id="detail-body"></div>
  </div>
</div>

<div class="modal-overlay" id="register-modal-overlay" hidden>
  <div class="modal-box" role="dialog" aria-modal="true">
    <button class="modal-close" id="register-modal-close" aria-label="Close" type="button">&times;</button>
    <h2>Register an artifact</h2>
    <form class="register-form" id="register-form">
      <input type="text" id="reg-ref" placeholder="alpine:3.19, /path/to/file, ghcr.io/org/chart:1.0" required />
      <select id="reg-type">
        <option value="image">image</option>
        <option value="file">file</option>
        <option value="sbom">sbom</option>
        <option value="sarif">sarif</option>
      </select>
      <input type="text" id="reg-expected-digest" placeholder="sha256:… (optional, pins the digest)" />
      <input type="text" id="reg-maintainer-team" placeholder="Maintainer team (optional)" />
      <input type="email" id="reg-maintainer-email" placeholder="Maintainer contact email (optional)" />
      <button type="submit" class="primary"><i class="ti ti-plus" aria-hidden="true"></i> Register</button>
    </form>
  </div>
</div>

<!--
  env.js is NOT part of this file -- it's generated at container
  startup by charts/supply-chain-monitor/templates/dashboard/deployment.yaml's render-config
  initContainer, from the scm-monitor-api-auth Secret and
  scm-dashboard-config ConfigMap (see docs/architecture.md,
  "Configuring the dashboard via ConfigMap/Secret instead of by
  hand"). It sets window.SCM_CONFIG = { apiBase, apiKey,
  allowManualRegistration, showConnectionSettings } before the script below runs. Opening this file directly (or in a test) without
  that initContainer just means the request 404s/fails and
  window.SCM_CONFIG stays undefined -- the script below already
  handles that by falling back to the old manual-entry behavior.
-->
<script src="env.js"></script>
<script>
(function () {
  // Default to the same host the dashboard itself was loaded from, just
  // on the API's NodePort (30300) instead of the dashboard's (30301).
  // This self-adapts whether you're on localhost (podman runtime) or a
  // Colima VM address (colima runtime, where NodePorts aren't reachable
  // via "localhost" at all) -- a hardcoded "localhost" default broke
  // the colima path outright. Still overridable and remembered below.
  // Where the API lives when nothing has been configured explicitly.
  //
  // SAME ORIGIN by default, because the Gateway now routes /api/ to
  // monitor-api (templates/gateway/httproute-api.yaml). That is what
  // makes the dashboard work over HTTPS at all: this used to be
  // protocol + host + ':30300', so a page served over https asked for
  // https://<host>:30300 -- a port speaking plain HTTP, which fails the
  // TLS handshake outright rather than degrading. Every API call failed,
  // and it looked like an application bug rather than an address bug.
  //
  // The exception is the dashboard's OWN NodePort: that nginx serves
  // static files only and proxies nothing, so a page loaded from it has
  // to reach across to monitor-api's NodePort. Coupling to that port
  // number is not lovely, and it is the same coupling this line already
  // had -- an explicit DASHBOARD_API_BASE (env.js) overrides all of it
  // for any deployment where neither assumption holds.
  // Same-origin proxy path. The dashboard's own nginx serves
  // /dash-api/ and attaches the Authorization header server-side
  // (templates/dashboard/deployment.yaml), so the browser never holds
  // the API key -- it used to be published in env.js to anyone who
  // could load the page (report S1).
  //
  // /dash-api rather than /api because the Gateway already routes /api/
  // straight to monitor-api for real API clients; calling /api/ here
  // would bypass the proxy when served through the Gateway and 401.
  // This prefix always lands on the dashboard's nginx, on both the
  // Gateway path and the direct NodePort.
  //
  // An explicit DASHBOARD_API_BASE (env.js) or a saved connection
  // setting still overrides it, for pointing a dev dashboard at an API
  // elsewhere -- that path needs its own key, which is why the manual
  // key field survives.
  var DEFAULT_API_BASE = '/dash-api';
  // window.SCM_CONFIG is set by env.js (see the comment above this
  // script tag) -- rendered at container startup from the
  // scm-monitor-api-auth Secret and scm-dashboard-config ConfigMap, so
  // a fresh browser gets a working API key and (optionally) a fixed
  // API address with no manual step. localStorage still wins over it
  // if a person has explicitly typed/saved a different value in the
  // fields below -- that's a deliberate escape hatch (pointing this
  // one browser tab at a different environment temporarily), not the
  // normal path.
  var injected = window.SCM_CONFIG || {};

  var state = {
    apiBase: localStorage.getItem('scm-api-base') || injected.apiBase || DEFAULT_API_BASE,
    // Every request to monitor-api now requires `Authorization: Bearer
    // <key>` (see internal/api/router.go's withAuth).
    // No injected key any more: the proxy adds Authorization
    // server-side. A manually saved key is still honoured, for a
    // dashboard pointed at an API that is not behind the proxy.
    apiKey: localStorage.getItem('scm-api-key') || '',
    stages: [],
    artifacts: [],
    // stats is GET /api/v1/stats -- the fleet-wide counts behind the
    // summary cards and the stage strip. It has to come from the server
    // because state.artifacts is ONE PAGE (see limit/offset below): a
    // card computed from that read like a fleet number and meant "of
    // these 50", which understated every risk count on a store bigger
    // than one page, and said nothing about which population it was
    // counting. null until the first fetch lands, which is the only
    // reason renderCards/renderStages default to 0 rather than assuming
    // it's there.
    stats: null,
    busy: {},
    searchQuery: '',
    detailTab: 'cve_findings',
    // GET /api/v1/artifacts is paginated server-side (50 per page by
    // default, 200 max). state.artifacts therefore holds ONE page, not
    // the whole store -- total is what the server says matches the
    // current filters, across every page.
    limit: 50,
    offset: 0,
    total: 0,
    filterStatus: '',
    filterType: '',
    // Component search is two stages, and needs two pieces of state
    // rather than one (see internal/api/components.go, which answers
    // both from one endpoint):
    //
    //   componentQuery -- a substring somebody typed ("openssl"). Shows
    //     the PICKER: which packages actually exist, with how many
    //     artifacts contain each.
    //   componentPURL  -- one exact purl, chosen from that picker (or
    //     pasted directly). Shows the ARTIFACTS containing it.
    //
    // Both set means "picked from a search": the artifact list, plus a
    // way back to the matches. Keeping them separate is what makes that
    // back link possible -- collapsing them into one field would make
    // clearing a selection drop all the way to the full artifact list.
    //
    // Deliberately in state rather than filtered in the DOM: the 10s
    // poll re-renders from state, so a search that only touched the
    // table would be wiped within ten seconds.
    componentQuery: '',
    componentPURL: '',
    // Findings work exactly the same way, one step removed: type
    // "log4j", pick the id that exists, get the artifacts still
    // affected. Kept as its own pair rather than a shared "picker mode"
    // -- two parallel pairs read plainly, where one generalized pair
    // plus a kind flag has to be decoded at every use.
    //
    // Only one search can be active: setting either query clears the
    // other pair (see the input handlers), the client-side twin of the
    // server's "purl wins over q" precedence.
    findingQuery: '',
    findingID: '',
    // Last picker result: matches plus how many matched in total, so a
    // capped list can say so instead of looking complete. Shared by
    // both searches, since only one is ever on screen.
    pickerMatches: [],
    pickerTotal: 0
  };
  var lastDetailId = null;
  // Cache for an artifact opened by URL (#/artifacts/<id>) that isn't on
  // the page currently loaded -- see renderDetailView. Keyed by id so
  // the 10s poll doesn't refetch it on every tick, and so a definitive
  // "not found" isn't retried forever either (the id maps to null).
  var detailCache = {};

  // currentDetailID reads the artifact id straight out of location.hash
  // (#/artifacts/<id>) rather than mirroring it into state -- location.hash
  // is already the single source of truth for "which view is active" (it's
  // what makes a detail page bookmarkable/shareable), so a second copy in
  // state could drift from it after back/forward navigation.
  function currentDetailID() {
    var m = /^#\/artifacts\/(.+)$/.exec(location.hash);
    return m ? decodeURIComponent(m[1]) : null;
  }

  function goToDetail(id) {
    location.hash = '#/artifacts/' + encodeURIComponent(id);
    render();
  }

  function goToList() {
    location.hash = '';
    render();
  }

  var els = {
    apiBase: document.getElementById('api-base'),
    apiKey: document.getElementById('api-key'),
    saveApi: document.getElementById('save-api'),
    refresh: document.getElementById('refresh'),
    status: document.getElementById('status'),
    cards: document.getElementById('cards'),
    stages: document.getElementById('stages'),
    rows: document.getElementById('artifact-rows'),
    search: document.getElementById('search-input'),
    component: document.getElementById('component-input'),
    finding: document.getElementById('finding-input'),
    componentPicker: document.getElementById('component-picker'),
    artifactTable: document.getElementById('artifact-table'),
    pager: document.getElementById('pager'),
    searchNote: document.getElementById('search-note'),
    filterStatus: document.getElementById('filter-status'),
    filterType: document.getElementById('filter-type'),
    pagePrev: document.getElementById('page-prev'),
    pageNext: document.getElementById('page-next'),
    pageRange: document.getElementById('page-range'),
    form: document.getElementById('register-form'),
    ref: document.getElementById('reg-ref'),
    type: document.getElementById('reg-type'),
    expectedDigest: document.getElementById('reg-expected-digest'),
    maintainerTeam: document.getElementById('reg-maintainer-team'),
    maintainerEmail: document.getElementById('reg-maintainer-email'),
    listView: document.getElementById('list-view'),
    detailView: document.getElementById('detail-view'),
    detailBody: document.getElementById('detail-body'),
    registerLinkSection: document.getElementById('register-link-section'),
    registerLink: document.getElementById('register-link'),
    registerModalOverlay: document.getElementById('register-modal-overlay'),
    registerModalClose: document.getElementById('register-modal-close'),
    connSettings: document.getElementById('conn-settings')
  };
  els.apiBase.value = state.apiBase;
  els.apiKey.value = state.apiKey;

  // The "+ Register an artifact" link is hidden unless the chart's
  // dashboard.allowManualRegistration is explicitly "true" (see
  // values.yaml) -- fail-closed like the injected apiBase/apiKey
  // pattern's own convention, so a dashboard opened without env.js
  // (or with the value unset/false) never exposes ad-hoc registration
  // a deployment didn't opt into.
  els.registerLinkSection.hidden = injected.allowManualRegistration !== 'true';

  // Opposite default from allowManualRegistration above: this is a
  // display preference, not a security gate, so it stays visible unless
  // a deployment explicitly opts out -- a dashboard opened without env.js
  // (or with the value unset/anything other than "false") keeps the API
  // base/key fields and Refresh visible, the same as before this toggle
  // existed. #status is deliberately NOT part of #conn-settings and not
  // gated here: setStatus (below) hides its idle "Connecting…"/
  // "Connected to…" text under the same preference, but always shows an
  // error regardless -- a dashboard silently displaying stale data
  // because its API died is worse than one extra line of chrome.
  els.connSettings.hidden = injected.showConnectionSettings === 'false';
  els.status.hidden = injected.showConnectionSettings === 'false';

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function timeAgo(iso) {
    if (!iso) return '—';
    var diff = (Date.now() - new Date(iso).getTime()) / 1000;
    if (diff < 60) return Math.max(0, Math.round(diff)) + 's ago';
    if (diff < 3600) return Math.round(diff / 60) + 'm ago';
    if (diff < 86400) return Math.round(diff / 3600) + 'h ago';
    return Math.round(diff / 86400) + 'd ago';
  }

  // failureReasonLabels maps Artifact.last_scan_failure_reason (see
  // scanner.ClassifyScanError on the backend) to a short badge label --
  // shown instead of the generic "failed" text so a glance at the list
  // tells you why, not just that. Falls back to "Failed" for "unknown"
  // or an empty reason (older artifacts scanned before this existed).
  var failureReasonLabels = {
    not_found: 'Not Found',
    registry_auth_failed: 'Auth Failed',
    unsupported_artifact: 'Unsupported Type',
    scan_timeout: 'Timed Out',
    scan_crashed: 'Crashed',
    scan_infra_error: 'Infra Error',
    fetch_failed: 'Fetch Failed',
    scanner_error: 'Scan Error'
  };

  function statusBadge(a) {
    var status = a.status;
    var map = {
      registered: 'badge-neutral',
      scanning: 'badge-warning',
      scanned: 'badge-success',
      failed: 'badge-danger'
    };
    var label = status === 'failed'
      // Object.hasOwn, not a bare lookup: a reason of "constructor" or
      // "toString" would otherwise hit an INHERITED property and render
      // a function body into the badge. Not XSS (esc() still runs on
      // the result), but visible garbage driven by a server field.
      ? (Object.hasOwn(failureReasonLabels, a.last_scan_failure_reason)
        ? failureReasonLabels[a.last_scan_failure_reason]
        : 'Failed')
      : esc(status);
    return '<span class="badge ' + (map[status] || 'badge-neutral') + '">' + label + '</span>';
  }

  // unsafeBadge is the one place that renders Artifact.unsafe -- set at
  // registration time when REQUIRE_DIGEST is enabled and the provided
  // digest didn't match what actually resolved (see README's "Requiring
  // a verified digest at registration"). Empty string, not a hidden
  // badge, when unsafe is false: this is appended inline next to the
  // status badge, so a false case must contribute nothing rather than an
  // empty <span>.
  function unsafeBadge(a) {
    return a.unsafe ? ' <span class="badge badge-danger" title="Registered digest did not match what was resolved">Unsafe</span>' : '';
  }

  // policyBadge renders GET /api/v1/artifacts/{id}/policy.
  //
  // THREE states, not two. "No policy configured" is deliberately NOT
  // shown as a pass: the chart ships an empty policy by default, so
  // every default deployment would otherwise display a green "Policy
  // OK" badge having checked precisely nothing -- an all-clear nobody
  // earned, on the one screen people look at to decide whether
  // something is safe to ship. That is what `configured` on the
  // response is for.
  //
  // A null result (the request failed) renders nothing at all, same as
  // unsafeBadge's false case: this sits inline next to the status
  // badge, and "I could not find out" must not look like "fine".
  function policyBadge(p) {
    if (!p) return '';
    if (!p.configured) {
      return ' <span class="badge badge-neutral" title="No policy is configured for this deployment, so nothing was checked">No policy</span>';
    }
    if (p.pass) {
      return ' <span class="badge badge-success" title="Passes the configured policy">Policy OK</span>';
    }
    var n = (p.violations || []).length;
    var detail = (p.violations || []).map(function (v) { return v.rule + ': ' + v.detail; }).join('\n');
    return ' <span class="badge badge-danger" title="' + esc(detail) + '">Policy: ' +
      n + ' violation' + (n === 1 ? '' : 's') + '</span>';
  }

  function severityBadge(sev) {
    var s = (sev || '').toLowerCase();
    var cls = 'badge-neutral';
    if (s === 'critical' || s === 'high') cls = 'badge-danger';
    else if (s === 'medium') cls = 'badge-warning';
    return '<span class="badge ' + cls + '">' + esc(sev || 'unknown') + '</span>';
  }

  // findingIsNew flags a finding as newly discovered on the artifact's
  // most recent scan/submission, so the dashboard can call it out
  // rather than showing it exactly the same as a finding that's been
  // open for months. There's no explicit "was this discovered on the
  // very last update" flag from the API -- instead this compares
  // first_seen_at against the artifact's own updated_at: the backend
  // (MergeFindings, called from inside the same store.Update() as the
  // one that sets updated_at) stamps a brand-new finding's first_seen_at
  // with the same "now" used for that update, so the two timestamps
  // land within milliseconds of each other in practice. A several-
  // second window comfortably absorbs that slack without ever mistaking
  // an old, still-open finding for a new one on some later, unrelated
  // update.
  // findingIsSuppressed: on record, but not an active problem. Either a
  // scan stopped reporting it ('fixed') or a VEX document uploaded for
  // this artifact asserts it doesn't apply here ('not_affected' -- see
  // the API's POST /artifacts/{id}/vex). Both keep their row on the
  // detail page with a badge saying which; neither is counted anywhere.
  // Treats every other value -- including missing/unset -- as active, so
  // this fails toward showing a finding rather than hiding it.
  function findingIsSuppressed(f) {
    return f.status === 'fixed' || f.status === 'not_affected';
  }

  function findingIsNew(f, a) {
    if (!f.first_seen_at || !a.updated_at || findingIsSuppressed(f)) return false;
    var diffMs = Math.abs(new Date(f.first_seen_at).getTime() - new Date(a.updated_at).getTime());
    return diffMs < 5000;
  }

  // CVE_ID_RE matches a bare CVE id (e.g. "CVE-2024-1234") -- used to
  // decide whether a finding gets a "Read more" link to NVD below.
  // Deliberately checks f.id itself rather than the bucket it's in:
  // SARIF documents can mix a real CVE in among misconfiguration/secret/
  // other findings (see classifyBucket), so bucket alone isn't a
  // reliable signal -- an id that looks like a CVE gets the link
  // regardless of which bucket it landed in, and a non-CVE id (an AVD
  // rule, a ClamAV signature constant) never does.
  var CVE_ID_RE = /^CVE-\d{4}-\d+$/i;

  // renderFinding is the one place that decides how a single finding
  // looks, for all five buckets (CVE/malware/misconfiguration/secret/
  // other) -- so "new" and "fixed" render identically everywhere
  // instead of each bucket's map() callback growing its own
  // slightly-different copy.
  //   showId: CVE/SARIF findings lead with their ID (e.g. "CVE-2024-1234"),
  //     with the title (if any) appended -- malware findings lead with
  //     the title (a signature name) since their ID is just a constant
  //     ("clamav-signature-match") with no information of its own.
  // The id/title text is a single ellipsis-truncated line (a CVE
  // description pulled through from a scanner can run to a paragraph)
  // -- the full text is still available via the title attribute (a
  // native browser tooltip, no extra JS) and, for real CVEs, via the
  // "Read more" link out to NVD's own page for that id.
  function renderFinding(f, a, showId) {
    var fullText = showId
      ? f.id + (f.title ? ' — ' + f.title : '')
      : (f.title || f.id);
    var label = esc(fullText);

    var lifecycleBadge = '';
    if (f.status === 'fixed') {
      lifecycleBadge = ' <span class="badge badge-success">Fixed ' + esc(timeAgo(f.resolved_at)) + '</span>';
    } else if (f.status === 'not_affected') {
      // The justification (why the assessment says this doesn't apply)
      // rides in the tooltip rather than the badge: it's free text from
      // the VEX document and can run long, and the badge sits inline on
      // a single truncated row. An empty justification is legal in
      // OpenVEX, so the tooltip falls back to naming the mechanism.
      lifecycleBadge = ' <span class="badge badge-success" title="' +
        esc(f.justification || 'Suppressed by a VEX document uploaded for this artifact') +
        '">VEX: not affected</span>';
    } else if (findingIsNew(f, a)) {
      lifecycleBadge = ' <span class="badge badge-accent">New</span>';
    }

    var readMore = CVE_ID_RE.test(f.id)
      ? ' <a class="finding-link" href="https://nvd.nist.gov/vuln/detail/' + encodeURIComponent(f.id) +
        '" target="_blank" rel="noopener noreferrer">Read more</a>'
      : '';

    var rowCls = 'finding badge-neutral' + (findingIsSuppressed(f) ? ' finding-fixed' : '');
    return '<div class="' + rowCls + '">' + severityBadge(f.severity) +
      '<span class="finding-label" title="' + esc(fullText) + '">' + label + '</span>' +
      lifecycleBadge + readMore + '</div>';
  }

  function countCell(n) {
    return '<span class="' + (n > 0 ? 'count-nonzero' : 'count-zero') + '">' + n + '</span>';
  }

  // openFindings is what every "how many CVEs does this have" count
  // (the summary cards, the per-artifact table columns, the risk
  // spectrum, the tab counts) should be counting -- a "fixed" or
  // VEX-suppressed finding stays in the array as a permanent record
  // (see MergeFindings/renderFinding above), so counting the raw array
  // length would make every resolved CVE, cleaned-up malware match, or
  // formally-assessed non-issue look like it's still an active problem.
  //
  // Note this filters the COUNTS, not the detail page's finding list
  // (renderFindingsTabs renders the raw bucket) -- a suppressed finding
  // is meant to be visible with its badge and invisible in the numbers,
  // which is exactly that split.
  function openFindings(list) {
    return (list || []).filter(function (f) { return !findingIsSuppressed(f); });
  }

  var FINDING_BUCKETS = [
    'cve_findings', 'malware_findings', 'misconfiguration_findings',
    'secret_findings', 'other_findings'
  ];

  // Matches a search query against every metadata field on an artifact
  // (id, ref, digest, type, status, stage, maintainer) plus every open
  // finding in every bucket (id, title, severity, source) -- so
  // searching a CVE ID or malware signature name finds every image
  // still affected by it, the same way searching a maintainer team
  // finds everything they own. Findings already fixed are excluded via
  // openFindings, the same filter every visible count on this page
  // (the bucket columns, the "With CVEs" card, the modal) already
  // applies -- otherwise a search for a resolved CVE would surface a
  // row showing 0 in every finding column, which reads as a bug, not
  // a match. Case-insensitive substring match, not a query language:
  // this dataset is small enough (fetched whole into state.artifacts
  // already) that a linear scan on every keystroke is plenty fast, so
  // there's no need for a backend search endpoint or an index.
  function matchesSearch(a, query) {
    var q = query.trim().toLowerCase();
    if (!q) return true;
    var fields = [
      a.id, a.ref, a.digest, a.type, a.status, a.current_stage,
      a.maintainer_team, a.maintainer_email
    ];
    for (var i = 0; i < fields.length; i++) {
      if (fields[i] && String(fields[i]).toLowerCase().indexOf(q) !== -1) return true;
    }
    for (var b = 0; b < FINDING_BUCKETS.length; b++) {
      var findings = openFindings(a[FINDING_BUCKETS[b]]);
      for (var f = 0; f < findings.length; f++) {
        var finding = findings[f];
        if (
          (finding.id && finding.id.toLowerCase().indexOf(q) !== -1) ||
          (finding.title && finding.title.toLowerCase().indexOf(q) !== -1) ||
          (finding.severity && finding.severity.toLowerCase().indexOf(q) !== -1) ||
          (finding.source && finding.source.toLowerCase().indexOf(q) !== -1)
        ) return true;
      }
    }
    return false;
  }

  async function fetchJSON(path, opts) {
    opts = opts || {};
    var headers = Object.assign({}, opts.headers || {});
    if (state.apiKey) headers['Authorization'] = 'Bearer ' + state.apiKey;
    var res = await fetch(state.apiBase + path, Object.assign({}, opts, { headers: headers }));
    var body = null;
    try { body = await res.json(); } catch (e) { /* no body */ }
    if (!res.ok) {
      // Called out distinctly from other errors: a 401 almost always
      // means the "Key" field above is empty or stale, not that
      // anything is actually broken.
      if (res.status === 401) {
        throw new Error('Unauthorized — check the API key above');
      }
      var msg = (body && body.error) ? body.error : (res.status + ' ' + res.statusText);
      var err = new Error(msg);
      // Carried so a caller can tell WHICH failure it got rather than
      // pattern-matching the message. apiError distinguishes a response
      // this service produced (JSON, with an "error" field) from one the
      // Go ServeMux produced for a route it does not have (plain text)
      // -- indistinguishable by status alone, and the two have
      // completely different fixes. See loadComponentDiff.
      err.status = res.status;
      err.apiError = !!(body && body.error);
      throw err;
    }
    return body;
  }

  function setStatus(text, isError) {
    els.status.textContent = text;
    els.status.className = isError ? 'error' : '';
    // See the comment where els.status.hidden is first set, above: an
    // error always shows even with showConnectionSettings: "false", so
    // a broken/unreachable API doesn't render as a quietly-empty table.
    if (isError) els.status.hidden = false;
    else if (injected.showConnectionSettings === 'false') els.status.hidden = true;
  }

  // artifactsPath builds the paginated list URL from the current page
  // and filters -- the filters are applied by the server, so switching
  // one narrows the whole set, not just the rows already on screen.
  function artifactsPath() {
    var q = 'limit=' + state.limit + '&offset=' + state.offset;
    if (state.filterStatus) q += '&status=' + encodeURIComponent(state.filterStatus);
    if (state.filterType) q += '&type=' + encodeURIComponent(state.filterType);
    return '/api/v1/artifacts?' + q;
  }

  async function loadAll() {
    try {
      var stagesRes = await fetchJSON('/api/v1/pipeline/stages');
      state.stages = (stagesRes && stagesRes.stages) || [];

      // Fetched here, above every early return below, so the cards and
      // the stage strip keep showing the WHOLE fleet even while a
      // component or finding search has narrowed the table. That's the
      // same call the "Artifacts" card's total already made (see the
      // comments on those branches): searching for a package doesn't
      // change how many artifacts exist or how many carry malware, so
      // the summary shouldn't start answering a different question just
      // because the table below it did.
      state.stats = await fetchJSON('/api/v1/stats');

      // A component search answers with a bare array of every artifact
      // containing that purl -- no paging, because the answer is "the
      // artifacts that ship this package", which is a complete set by
      // definition and small enough to render whole. total is set from
      // its length so the pager and its "offset past the end" recovery
      // below read the same numbers the list actually has.
      // Stage 1: a typed substring with nothing picked yet -- fetch the
      // matching PACKAGES, not artifacts. Re-fetched on every poll like
      // everything else, so the artifact counts beside each package stay
      // current rather than freezing at whatever they were when the
      // search ran.
      if (state.componentQuery && !state.componentPURL) {
        var found = await fetchJSON('/api/v1/components?q=' + encodeURIComponent(state.componentQuery));
        state.pickerMatches = (found && found.packages) || [];
        state.pickerTotal = (found && found.total) || 0;
        setStatus('Connected to ' + state.apiBase, false);
        render();
        return;
      }

      // The same two stages for findings: a substring picks the id, the
      // id picks the artifacts.
      if (state.findingQuery && !state.findingID) {
        var hits = await fetchJSON('/api/v1/findings?q=' + encodeURIComponent(state.findingQuery));
        state.pickerMatches = (hits && hits.findings) || [];
        state.pickerTotal = (hits && hits.total) || 0;
        setStatus('Connected to ' + state.apiBase, false);
        render();
        return;
      }

      if (state.findingID) {
        // A bare array, like the exact component query -- and like it,
        // state.total is deliberately left alone so the "Artifacts" card
        // keeps showing the fleet, not the match count.
        var affected = await fetchJSON('/api/v1/findings/' + encodeURIComponent(state.findingID) + '/artifacts');
        state.artifacts = affected || [];
        state.offset = 0;
        setStatus('Connected to ' + state.apiBase, false);
        render();
        return;
      }

      if (state.componentPURL) {
        var containing = await fetchJSON('/api/v1/components?purl=' + encodeURIComponent(state.componentPURL));
        state.artifacts = containing || [];
        state.offset = 0;
        // state.total is deliberately NOT overwritten with the match
        // count: it's what the "Artifacts" card shows, and that card
        // means "how many artifacts are there", not "how many matched"
        // (renderCards' own comment). Searching for a component doesn't
        // change the size of the fleet, so the last full-list total is
        // still the right answer -- and the match count already has its
        // own place to live, in the pager line below.
        setStatus('Connected to ' + state.apiBase, false);
        render();
        return;
      }

      var page = await fetchJSON(artifactsPath());
      state.artifacts = (page && page.artifacts) || [];
      state.total = (page && page.total) || 0;
      // Deleting the last artifact on the final page (or a filter change
      // racing the 10s poll) can leave the offset past the end -- that
      // reads as "no artifacts" rather than "wrong page," so step back
      // and reload instead of showing an empty table.
      if (!state.artifacts.length && state.offset > 0 && state.offset >= state.total) {
        state.offset = Math.max(0, (Math.ceil(state.total / state.limit) - 1) * state.limit);
        return loadAll();
      }
      setStatus('Connected to ' + state.apiBase, false);
      render();
    } catch (err) {
      setStatus("Couldn't reach " + state.apiBase + ' — ' + err.message, true);
    }
  }

  function render() {
    var detailID = currentDetailID();
    if (detailID) {
      renderDetailView(detailID);
    } else {
      renderListView();
    }
  }

  function renderListView() {
    els.listView.hidden = false;
    els.detailView.hidden = true;
    renderCards();
    renderStages();
    // The picker and the artifact table are two different answers to
    // two different questions ("which packages match this?" vs "which
    // artifacts contain this one?"), so exactly one is on screen at a
    // time rather than the picker being squeezed into columns built for
    // artifacts.
    var picking = (!!state.componentQuery && !state.componentPURL) ||
                  (!!state.findingQuery && !state.findingID);
    els.componentPicker.hidden = !picking;
    els.artifactTable.hidden = picking;
    els.pager.hidden = picking;
    if (picking) {
      renderPicker();
    } else {
      renderRows();
      renderPager();
    }
    renderSearchNote();
  }

  // renderPicker lists whatever a substring matched -- packages or
  // finding ids -- one per row, in the order the server decided (most
  // widespread first: the thing in the most artifacts is usually the
  // one meant). Clicking a row narrows to that exact key, which is the
  // whole point of both searches: forgiving to type, exact to answer.
  //
  // One function for both because the row is the same shape either way
  // (a label, a detail, a count) and only the fields differ. A second
  // near-identical renderer would be the place the two drift.
  function renderPicker() {
    var isFinding = !!state.findingQuery;
    var term = isFinding ? state.findingQuery : state.componentQuery;

    if (!state.pickerMatches.length) {
      var hint = isFinding
        ? 'Try part of a CVE id (<code>CVE-2021</code>) or of the title (<code>openssl</code>). Findings already fixed or VEX-suppressed are deliberately not searched — they are not something you are still affected by.'
        : 'Try a shorter term, or part of the purl (e.g. <code>pkg:apk/</code>) — and note only artifacts with an uploaded SBOM have components at all.';
      els.componentPicker.innerHTML = '<p class="empty">No ' + (isFinding ? 'finding' : 'package') +
        ' matches &quot;' + esc(term) + '&quot;. ' + hint + '</p>';
      return;
    }

    var rows = state.pickerMatches.map(function (m) {
      var artifacts = m.artifacts === 1 ? '1 artifact' : m.artifacts + ' artifacts';
      if (isFinding) {
        return '<button type="button" class="pkg-row" data-action="pick-finding" data-id="' + esc(m.id) + '">' +
          severityBadge(m.severity) +
          '<span class="pkg-name">' + esc(m.id) + '</span>' +
          '<span class="pkg-purl" title="' + esc(m.title || '') + '">' + esc(m.title || '') + '</span>' +
          '<span class="pkg-count">' + artifacts + '</span>' +
        '</button>';
      }
      return '<button type="button" class="pkg-row" data-action="pick-component" data-purl="' + esc(m.purl) + '">' +
        '<span class="pkg-name">' + esc(m.name || m.purl) + '</span>' +
        (m.version ? '<span class="pkg-version">' + esc(m.version) + '</span>' : '') +
        // Licenses, when the SBOM carried any. Omitted rather than
        // shown empty: most packages in a real inventory have none
        // recorded, and a column of blanks would just add noise to
        // every row to serve the few that do.
        (m.licenses ? '<span class="pkg-license" title="' + esc(m.licenses) + '">' + esc(m.licenses) + '</span>' : '') +
        '<span class="pkg-purl" title="' + esc(m.purl) + '">' + esc(m.purl) + '</span>' +
        '<span class="pkg-count">' + artifacts + '</span>' +
      '</button>';
    });

    // A capped list says so. Silently showing the first 200 of 4,000
    // reads as "these are all of them", which is the one thing a search
    // result must never imply.
    if (state.pickerTotal > state.pickerMatches.length) {
      rows.push('<p class="search-note">Showing the ' + state.pickerMatches.length +
        ' most widespread of ' + state.pickerTotal + ' matching ' + (isFinding ? 'findings' : 'packages') +
        ' — narrow the term to see the rest.</p>');
    }
    els.componentPicker.innerHTML = rows.join('');
  }

  function renderPager() {
    // A component search returns its whole answer at once, so paging
    // through it would be paging through a single page -- both buttons
    // stay disabled and the range reads as a count, not a slice.
    if (state.componentPURL || state.findingID) {
      var matches = state.artifacts.length;
      var noun = state.findingID
        ? (matches === 1 ? '1 artifact is affected' : matches + ' artifacts are affected')
        : (matches === 1 ? '1 artifact contains this component' : matches + ' artifacts contain this component');
      els.pageRange.textContent = noun;
      els.pagePrev.disabled = true;
      els.pageNext.disabled = true;
      return;
    }
    var first = state.total === 0 ? 0 : state.offset + 1;
    var last = Math.min(state.offset + state.limit, state.total);
    els.pageRange.textContent = state.total === 0
      ? '0 artifacts'
      : first + '–' + last + ' of ' + state.total;
    els.pagePrev.disabled = state.offset <= 0;
    els.pageNext.disabled = state.offset + state.limit >= state.total;
  }

  // renderSearchNote keeps the line under the filters honest about
  // which of the two list sources is on screen -- the status/type
  // filters and the pager mean something different in each, and a note
  // describing the wrong one is worse than no note.
  function renderSearchNote() {
    // The status/type selects are disabled during a component search
    // rather than left enabled and ignored: the component endpoint
    // takes no filters, so a select that still looks usable but changes
    // nothing (while displaying a stale selection) reads as a bug. This
    // is the one place that state is visible, so it's set here.
    var searchMode = !!(state.componentPURL || state.componentQuery ||
                        state.findingID || state.findingQuery);
    els.filterStatus.disabled = searchMode;
    els.filterType.disabled = searchMode;

    if (state.componentPURL) {
      // Reached through a search rather than by pasting a purl? Offer
      // the way back to the matches -- otherwise picking the wrong one
      // of three openssls means retyping the search.
      var back = state.componentQuery
        ? ' <button type="button" class="link-btn" data-action="back-to-matches">← back to matches for “' + esc(state.componentQuery) + '”</button>'
        : '';
      els.searchNote.innerHTML = 'Showing every artifact whose SBOM lists <code>' + esc(state.componentPURL) +
        '</code> (exact match) — the status and type filters don’t apply to this view. Clear the component box to go back to the full list.' + back;
      return;
    }
    if (state.componentQuery) {
      els.searchNote.innerHTML = 'Packages matching <code>' + esc(state.componentQuery) +
        '</code> — pick one to see every artifact containing exactly that version. Paste a full <code>pkg:…</code> purl to skip this step.';
      return;
    }
    if (state.findingID) {
      var backToFindings = state.findingQuery
        ? ' <button type="button" class="link-btn" data-action="back-to-matches">← back to matches for “' + esc(state.findingQuery) + '”</button>'
        : '';
      els.searchNote.innerHTML = 'Showing every artifact still affected by <code>' + esc(state.findingID) +
        '</code> — fixed and VEX-suppressed findings are excluded, so this is what is actually outstanding. Clear the box to go back to the full list.' + backToFindings;
      return;
    }
    if (state.findingQuery) {
      els.searchNote.innerHTML = 'Findings matching <code>' + esc(state.findingQuery) +
        '</code> — pick one to see every artifact still affected by it. Enter an exact id (<code>CVE-2021-44228</code>) to skip this step.';
      return;
    }
    els.searchNote.textContent = 'Search only looks at the artifacts on this page — narrow the set with the status/type filters, which are applied by the server.';
  }

  function renderDetailView(id) {
    els.listView.hidden = true;
    els.detailView.hidden = false;
    // A fresh id resets the findings tab to CVE -- otherwise leaving
    // "Secrets" selected on one artifact would carry over to the next
    // artifact you open, which reads as a bug (missing findings) rather
    // than a leftover selection.
    if (id !== lastDetailId) {
      state.detailTab = 'cve_findings';
      lastDetailId = id;
    }
    var a = state.artifacts.filter(function (x) { return x.id === id; })[0] || detailCache[id];
    if (!a) {
      // Now that the list is paginated, a bookmarked/shared detail URL
      // is routinely for an artifact that isn't on the page currently
      // loaded -- so fall back to fetching that one artifact by id
      // rather than claiming it doesn't exist. detailCache also records
      // a definitive miss (as null) so a genuinely deleted artifact
      // isn't refetched on every 10s poll.
      if (!(id in detailCache)) {
        detailCache[id] = null;
        els.detailBody.innerHTML = '<p class="muted">Loading…</p>';
        fetchJSON('/api/v1/artifacts/' + encodeURIComponent(id))
          .then(function (fetched) {
            detailCache[id] = fetched;
            if (currentDetailID() === id) render();
          })
          // A failure (404, or the API being unreachable) leaves the
          // cached null in place: re-rendering with the entry deleted
          // would refetch immediately, and that catch would re-render
          // again -- a loop. The 10s poll's own error banner is what
          // reports an unreachable API.
          .catch(function () { if (currentDetailID() === id) render(); });
        return;
      }
      // A genuinely missing artifact (bad link, or deleted in another
      // tab) gets a real empty state instead of silently rendering
      // nothing.
      // Covers both "no such id" and "the fetch above failed" -- the
      // dashboard can't tell those apart through fetchJSON, so the
      // wording doesn't claim more than it knows.
      els.detailBody.innerHTML =
        '<p class="muted">Artifact not found — it may have been deleted, or the API is unreachable.</p>' +
        '<button type="button" class="link-btn" data-action="back">← Back to artifacts</button>';
      return;
    }
    els.detailBody.innerHTML = renderDetailPage(a);
    // Deliberately not awaited: the detail page is already on screen and
    // useful, and the SBOM diff is one more request that should not hold
    // it up or fail it. loadComponentDiff fills its own placeholder.
    loadComponentDiff(a.id);
    loadPolicy(a.id);
  }

  function renderCards() {
    // Every one of these is fleet-wide, straight from /api/v1/stats.
    // They used to be counted out of state.artifacts, which holds one
    // page: "With CVEs" then meant "with CVEs among these 50" while
    // reading like a total, so a store of 800 artifacts reported a
    // number that was capped at the page size and quietly understated
    // every risk count on the page. The server can answer this properly
    // in two aggregate queries, so it does.
    //
    // These are the WHOLE STORE even when a status/type filter or a
    // component/finding search has narrowed the table below -- so with
    // ?status=failed the "Artifacts" card reads the fleet while the
    // pager reads "1-17 of 17". Deliberate, and the same rule the
    // search branches in loadAll already followed: the cards answer
    // "how much is there and how much of it is a problem", which a
    // filter doesn't change. The filtered count has its own place to
    // live, in the pager line.
    //
    // The "|| 0" defaults cover two cases: the very first render, which
    // happens before the first fetch resolves (state.stats is null),
    // and a key the API legitimately omitted -- by_status/by_stage
    // carry only the values something is actually in, so a status
    // nothing is in is absent rather than 0 (see artifact.Stats).
    var stats = state.stats || {};
    var byStatus = stats.by_status || {};
    var withFindings = stats.with_findings || {};
    // Card order is load-bearing: some tests index into this by
    // position, and misconfigurations/secrets were appended after the
    // original five rather than slotted in beside the other buckets so
    // that stayed true.
    var cards = [
      ['Artifacts', stats.total || 0],
      ['Scanning now', byStatus.scanning || 0],
      ['With CVEs', withFindings.cve || 0],
      ['With malware', withFindings.malware || 0],
      ['With other findings', withFindings.other || 0],
      ['With misconfigurations', withFindings.misconfiguration || 0],
      ['With secrets', withFindings.secret || 0]
    ];
    // Appended last, deliberately: several dashboard tests index this
    // array by position, and inserting among the existing cards would
    // shift every one of them. Only shown when the threshold is
    // configured -- a card reading 0 because the feature is off is
    // noise, not information.
    if (stats.stale_after_days > 0) {
      cards.push(['Not scanned recently', stats.stale || 0]);
    }
    // Failed scans, and only when there ARE any -- a permanent "0
    // failed" is wallpaper, one that appears is an alarm.
    //
    // This is the fleet-level half of failure reporting. The per-row
    // badge (statusBadge) has always shown a red badge naming the
    // reason, but only on the page you happen to be looking at, so a
    // handful of failures scattered through a large store were
    // invisible unless you went filtering for them. The sweep now
    // retries these every run; this is how you see it is happening.
    if (byStatus.failed) {
      cards.push(['Failed scans', byStatus.failed, 'card-danger']);
    }
    els.cards.innerHTML = cards.map(function (c) {
      return '<div class="card ' + (c[2] || '') + '"><div class="n">' + c[1] + '</div><div class="l">' + c[0] + '</div></div>';
    }).join('');
  }

  function renderStages() {
    if (!state.stages.length) {
      els.stages.innerHTML = '<span class="muted">No pipeline stages configured.</span>';
      return;
    }
    // Fleet-wide, from /api/v1/stats, for the same reason the cards
    // above are: counted from state.artifacts these pills described one
    // page of the pipeline while looking like the whole of it.
    //
    // Artifacts that haven't been staged yet come back under the EMPTY
    // STRING key, not an "unassigned" one -- the stage list is
    // deployment config, so the API refuses to invent a name that could
    // collide with a real configured stage (see artifact.Stats). The
    // label below is this dashboard's choice, made here where it can't
    // be mistaken for data.
    var counts = (state.stats && state.stats.by_stage) || {};
    var pills = state.stages.map(function (s) {
      return '<div class="stage-pill">' + esc(s) + '<span class="count">' + (counts[s] || 0) + '</span></div>';
    });
    pills.push('<div class="stage-pill">unassigned<span class="count">' + (counts[''] || 0) + '</span></div>');
    els.stages.innerHTML = pills.join('');
  }

  function renderRows() {
    if (!state.artifacts.length) {
      // "Register one above" only makes sense when that link actually
      // exists -- see allowManualRegistration's gate above.
      var emptyMsg = els.registerLinkSection.hidden
        ? 'No artifacts yet.'
        : 'No artifacts yet. Register one above to get started.';
      // During a component search, "no artifacts yet" would be a lie --
      // there are artifacts, none of them ship this package (or none has
      // had an SBOM uploaded yet, which is the other reason a purl finds
      // nothing and is worth saying out loud).
      if (state.findingID) {
        emptyMsg = 'No artifact is still affected by ' + esc(state.findingID) +
          '. It may have been fixed everywhere, or suppressed by a VEX document.';
      }
      if (state.componentPURL) {
        emptyMsg = 'No artifact’s SBOM lists ' + esc(state.componentPURL) +
          '. Check the purl (it must match exactly, qualifiers included), or whether these artifacts have SBOMs uploaded at all.';
      }
      els.rows.innerHTML = '<tr><td colspan="11" class="empty">' + emptyMsg + '</td></tr>';
      return;
    }
    var matched = state.artifacts.filter(function (a) { return matchesSearch(a, state.searchQuery); });
    if (!matched.length) {
      els.rows.innerHTML = '<tr><td colspan="11" class="empty">No artifacts on this page match &quot;' +
        esc(state.searchQuery.trim()) + '&quot; — try the status/type filters, or another page.</td></tr>';
      return;
    }
    var rows = [];
    matched
      .slice()
      .sort(function (a, b) { return new Date(b.updated_at) - new Date(a.updated_at); })
      .forEach(function (a) {
        var busy = !!state.busy[a.id];
        rows.push(
          '<tr data-id="' + esc(a.id) + '">' +
            '<td class="ref" title="' + esc(a.ref) + '">' + esc(a.ref) + '</td>' +
            '<td>' + esc(a.type) + '</td>' +
            '<td>' + statusBadge(a) + unsafeBadge(a) + staleBadge(a) + '</td>' +
            '<td>' + (a.current_stage ? esc(a.current_stage) : '<span class="muted">—</span>') + '</td>' +
            '<td>' + countCell(openFindings(a.cve_findings).length) + '</td>' +
            '<td>' + countCell(openFindings(a.malware_findings).length) + '</td>' +
            '<td>' + countCell(openFindings(a.misconfiguration_findings).length) + '</td>' +
            '<td>' + countCell(openFindings(a.secret_findings).length) + '</td>' +
            '<td>' + countCell(openFindings(a.other_findings).length) + '</td>' +
            '<td class="muted">' + timeAgo(a.updated_at) + '</td>' +
            '<td class="actions">' +
              '<button data-action="scan" data-id="' + esc(a.id) + '" ' + (busy ? 'disabled' : '') + '>' +
                (busy ? 'Scanning…' : '<i class="ti ti-player-play" aria-hidden="true"></i> Scan') +
              '</button>' +
              '<button data-action="toggle" data-id="' + esc(a.id) + '">Details</button>' +
              '<button data-action="delete" data-id="' + esc(a.id) + '" data-ref="' + esc(a.ref) + '" ' + (busy ? 'disabled' : '') + '>' +
                '<i class="ti ti-trash" aria-hidden="true"></i> Delete' +
              '</button>' +
            '</td>' +
          '</tr>'
        );
      });
    els.rows.innerHTML = rows.join('');
  }

  // lastScanText reads Artifact.LastScanAt (set server-side only when
  // /scan or /findings actually completes -- see
  // internal/api/handlers.go) rather than updated_at, which also moves
  // on unrelated mutations like a /stage call or the digest backfill
  // and would otherwise misreport those as a fresh scan.
  // isScanStale mirrors Store.CountStaleScans EXACTLY, and the match
  // matters: the "Not scanned recently" card comes from the server's
  // count while the per-row badges are computed here, so any difference
  // makes the two contradict and one of them look broken.
  //
  // Two rules to keep in step:
  //   - Never scanned (last_scan_at null) is NOT stale. It is a
  //     different state -- those sit at "registered" and the sweep
  //     already collects them. In JS a null date would otherwise
  //     compare as older than any cutoff and badge everything.
  //   - staleAfterDays of 0 means the warning is switched off entirely,
  //     not that everything is stale.
  function isScanStale(a) {
    var days = (state.stats && state.stats.stale_after_days) || 0;
    if (days <= 0 || !a.last_scan_at) return false;
    var cutoff = Date.now() - days * 24 * 60 * 60 * 1000;
    return new Date(a.last_scan_at).getTime() < cutoff;
  }

  // staleBadge warns that an artifact's last scan has aged out. Shown
  // whether or not auto-rescan is enabled: if the sweep is keeping up
  // this is rarely seen, and if it is backlogged or failing, hiding the
  // badge would hide exactly that.
  function staleBadge(a) {
    if (!isScanStale(a)) return '';
    return ' <span class="badge badge-warning" title="Last scanned ' + esc(timeAgo(a.last_scan_at)) +
      ' — older than the ' + ((state.stats && state.stats.stale_after_days) || 0) +
      ' day freshness threshold">STALE</span>';
  }

  function lastScanText(a) {
    if (!a.last_scan_at) return 'Not yet scanned';
    return timeAgo(a.last_scan_at);
  }

  // maintainerText is the modal's read-only view of who owns an
  // artifact -- "Not set" (not an empty string) so a never-configured
  // artifact reads as a deliberate state, not a rendering glitch.
  function maintainerText(a) {
    if (!a.maintainer_team && !a.maintainer_email) return '<span class="muted">Not set</span>';
    return esc(a.maintainer_team) + ' — <a class="maintainer-link" href="mailto:' + esc(a.maintainer_email) + '">' + esc(a.maintainer_email) + '</a>';
  }

  // documentLinks renders a "Download SBOM"/"Download SARIF report"
  // button for each document that's actually been captured (a.has_sbom/
  // has_sarif, set by the API -- see Artifact.HasSBOM's comment; never
  // both false-and-missing-button vs true-and-broken-download, since
  // the flag and the document's existence are the same fact from the
  // same source). Buttons, not plain <a href> links: every API route
  // requires an Authorization: Bearer header (see router.go's withAuth),
  // which a browser never attaches to a plain link navigation -- see
  // downloadDocument below for the fetch-as-blob approach this requires.
  function documentLinks(a) {
    var links = [];
    if (a.has_sbom) links.push('<button type="button" class="link-btn" data-action="download-sbom" data-id="' + esc(a.id) + '">Download SBOM</button>');
    if (a.has_sarif) links.push('<button type="button" class="link-btn" data-action="download-sarif" data-id="' + esc(a.id) + '">Download SARIF report</button>');
    if (!links.length) return '<span class="muted">Not yet generated</span>';
    return links.join(' · ');
  }

  // downloadDocument fetches a document as an authenticated request
  // (fetchJSON can't be reused as-is: it always calls res.json(), which
  // would try to parse a multi-megabyte SBOM/SARIF document as a single
  // JSON value just to throw it away), then triggers a save via a
  // synthetic, temporary <a download> -- the standard way to save a
  // fetched Blob to disk from JS, since the browser download UI itself
  // only ever triggers off an <a> element, never directly off a fetch
  // response.
  async function downloadDocument(id, kind, filename) {
    var headers = {};
    if (state.apiKey) headers['Authorization'] = 'Bearer ' + state.apiKey;
    var res = await fetch(state.apiBase + '/api/v1/artifacts/' + id + '/documents/' + kind, { headers: headers });
    if (!res.ok) {
      throw new Error(res.status === 401 ? 'Unauthorized — check the API key above' : (res.status + ' ' + res.statusText));
    }
    var blob = await res.blob();
    var url = URL.createObjectURL(blob);
    var link = document.createElement('a');
    link.href = url;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(url);
  }

  var BUCKET_LABELS = {
    cve_findings: 'CVE',
    malware_findings: 'Malware',
    misconfiguration_findings: 'Misconfig',
    secret_findings: 'Secret',
    other_findings: 'Other'
  };

  // riskSpectrum is the detail page's one signature visual: a single bar
  // whose segment widths are proportional to open-finding severity, so
  // an artifact's risk reads as a shape at a glance instead of six
  // separate counts competing for attention. Colored in the same three
  // buckets severityBadge already uses (critical+high share "danger" --
  // there's no separate token for critical, and inventing one here would
  // make this page speak a different severity language than every badge
  // elsewhere), but the label text stays granular so "3 critical, 5
  // high" isn't flattened into one number.
  function riskSpectrum(a) {
    var counts = { critical: 0, high: 0, medium: 0, low: 0, unknown: 0 };
    var buckets = { danger: 0, warning: 0, neutral: 0 };
    FINDING_BUCKETS.forEach(function (key) {
      openFindings(a[key]).forEach(function (f) {
        var s = (f.severity || '').toLowerCase();
        if (s === 'critical') { counts.critical++; buckets.danger++; }
        else if (s === 'high') { counts.high++; buckets.danger++; }
        else if (s === 'medium') { counts.medium++; buckets.warning++; }
        else if (s === 'low') { counts.low++; buckets.neutral++; }
        else { counts.unknown++; buckets.neutral++; }
      });
    });
    var total = buckets.danger + buckets.warning + buckets.neutral;
    if (!total) return '<div class="risk-spectrum-empty muted">No open findings.</div>';
    var label = ['critical', 'high', 'medium', 'low', 'unknown']
      .filter(function (k) { return counts[k] > 0; })
      .map(function (k) { return counts[k] + ' ' + k; })
      .join(' · ');
    var bar =
      (buckets.danger ? '<span class="risk-seg risk-danger" style="flex:' + buckets.danger + '"></span>' : '') +
      (buckets.warning ? '<span class="risk-seg risk-warning" style="flex:' + buckets.warning + '"></span>' : '') +
      (buckets.neutral ? '<span class="risk-seg risk-neutral" style="flex:' + buckets.neutral + '"></span>' : '');
    return '<div class="risk-spectrum"><div class="risk-bar">' + bar + '</div><div class="risk-label">' + esc(label) + '</div></div>';
  }

  // renderComponentDiff turns GET .../components/diff into the "SBOM
  // changes" section: what packages appeared, disappeared, and moved
  // version between the two most recent SBOM snapshots.
  //
  // version_changed is rendered as its own group rather than folded
  // into added/removed, because that is the whole point of the endpoint:
  // a purl embeds its version, so an upgrade looks like an unrelated
  // removal plus addition to anything comparing purls, and an upgrade is
  // the change people actually look for.
  function renderComponentDiff(diff) {
    var added = diff.added || [];
    var removed = diff.removed || [];
    var changed = diff.version_changed || [];

    if (!added.length && !removed.length && !changed.length) {
      // Two different "nothing to show" states, and conflating them
      // would be a lie in one direction or the other: a genuinely
      // unchanged SBOM vs. never having had two to compare.
      return diff.from
        ? '<span class="muted">No component changes between the last two scans.</span>'
        : '<span class="muted">Not enough SBOM history yet — a snapshot is taken each time an SBOM is indexed for this artifact.</span>';
    }

    function list(label, items, render) {
      if (!items.length) return '';
      return '<div class="sbom-diff-group">' +
        '<div class="sbom-diff-label">' + esc(label) + ' <span class="count-nonzero">' + items.length + '</span></div>' +
        items.map(render).join('') +
        '</div>';
    }

    var body =
      list('Upgraded', changed, function (c) {
        return '<div class="finding badge-neutral">' +
          '<span class="finding-label" title="' + esc(c.purl) + '">' + esc(c.purl) + '</span>' +
          '<span class="muted">' + esc(c.from) + ' → ' + esc(c.to) + '</span>' +
          '</div>';
      }) +
      list('Added', added, function (c) {
        return '<div class="finding badge-neutral">' +
          '<span class="finding-label" title="' + esc(c.purl) + '">' + esc(c.name || c.purl) + '</span>' +
          '<span class="muted">' + esc(c.version || '') + '</span>' +
          '</div>';
      }) +
      list('Removed', removed, function (c) {
        return '<div class="finding badge-neutral finding-fixed">' +
          '<span class="finding-label" title="' + esc(c.purl) + '">' + esc(c.name || c.purl) + '</span>' +
          '<span class="muted">' + esc(c.version || '') + '</span>' +
          '</div>';
      });

    // Say which two snapshots this is, so "no changes" and "these
    // changes" are both attributable to a specific pair of scans.
    var when = diff.from && diff.to
      ? '<div class="muted sbom-diff-range">Comparing ' + esc(timeAgo(diff.from)) + ' → ' + esc(timeAgo(diff.to)) + '</div>'
      : '';
    return when + body;
  }

  // loadPolicy fills the policy badge placeholder in the detail
  // header. Separate request because the verdict is not part of the
  // artifact -- it depends on the deployment's rules, which can change
  // without the artifact changing.
  //
  // A failure leaves the placeholder EMPTY rather than rendering an
  // error badge: the rest of the detail view is fine, and a badge
  // saying something went wrong sitting where a verdict belongs is
  // easily misread as a verdict. Same reasoning as unsafeBadge
  // contributing nothing when there is nothing to say.
  async function loadPolicy(id) {
    var el = document.getElementById('policy-badge');
    if (!el) return;
    try {
      var result = await fetchJSON('/api/v1/artifacts/' + encodeURIComponent(id) + '/policy');
      // el.isConnected, NOT currentDetailID(): both answer "is this
      // still the badge on screen" -- navigating from one artifact to
      // another re-renders the detail body, which detaches the element
      // this call captured -- but isConnected is a plain DOM property,
      // while currentDetailID() reads window.location. Reading location
      // on a window that has since been torn down throws, and an
