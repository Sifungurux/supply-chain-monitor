<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Supply chain monitor</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  /* Nordkeel design system -- tokens/components ported verbatim from
     nordkeel/src/styles/tokens/*.css and components.css (this project's
     own consultancy brand: navy/sky palette, Inter for prose, Geist Mono
     reserved for buttons/badges/data -- the "engineer-precise" pairing
     documented in that repo's spacing.css). Kept under the --scm- prefix
     dropped in favor of Nordkeel's own token names directly, so this
     stylesheet reads the same as the source system rather than as a
     second, differently-named copy of it. */
  :root {
    --c-navy: #1c4f8a;
    --c-navy-deep: #163d70;
    --c-sky: #3b91f0;
    --c-sky-light: #60a5fa;
    --c-blue-mid: #2563c4;
    --c-surface: #f5f9ff;
    --c-border: #bfdbfe;
    --c-text-dark: #1c4f8a;
    --c-text-muted: #3b82c4;
    --c-text-light: #dbeafe;
    --c-white: #ffffff;

    --steel-600: #475569;
    --steel-500: #64748b;
    --steel-400: #94a3b8;
    --steel-100: #f1f5f9;

    --green-600: #16a34a;
    --green-100: #dcfce7;
    --red-600: #dc2626;
    --red-100: #fee2e2;
    --yellow-600: #ca8a04;
    --yellow-100: #fef9c3;

    --color-bg: var(--c-surface);
    --color-surface: var(--c-white);
    --color-surface-sunken: #eef4ff;

    --text-strong: var(--c-navy);
    --text: var(--c-text-dark);
    --text-muted: var(--c-text-muted);
    --text-subtle: #4a6fa5;

    --border: var(--c-border);
    --border-strong: #93c5fd;
    --border-faint: #eff6ff;

    --primary: var(--c-navy);
    --primary-hover: var(--c-navy-deep);
    --primary-active: #112a50;
    --on-primary: var(--c-white);

    --accent: var(--c-sky);
    --accent-hover: #2563c4;
    --accent-soft: #eff6ff;

    --success: var(--green-600);
    --success-soft: var(--green-100);
    --danger: var(--red-600);
    --danger-soft: var(--red-100);
    --warning: var(--yellow-600);
    --warning-soft: var(--yellow-100);

    --focus-ring: color-mix(in srgb, var(--c-sky) 50%, transparent);

    --font-sans: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-mono: 'Geist Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;

    --radius-sm: 6px;
    --radius-md: 8px;
    --radius-lg: 12px;
    --radius-pill: 20px;

    --shadow-sm: 0 1px 2px rgba(7, 19, 28, 0.08), 0 1px 1px rgba(7, 19, 28, 0.04);
    --shadow-lg: 0 12px 28px -8px rgba(7, 19, 28, 0.20), 0 4px 10px -4px rgba(7, 19, 28, 0.10);
    --shadow-xl: 0 28px 60px -16px rgba(7, 19, 28, 0.30);

    --dur-fast: 120ms;
    --dur: 200ms;
    --ease-standard: cubic-bezier(0.4, 0, 0.2, 1);
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  }
  /* Dark ("hull") theme -- same values as nordkeel's [data-theme="dark"],
     delivered via prefers-color-scheme instead: this dashboard has no
     theme-toggle UI of its own, only ever the OS-level signal. */
  @media (prefers-color-scheme: dark) {
    :root {
      --color-bg: #0b1e38;
      --color-surface: #112a50;
      --color-surface-sunken: #0b1e38;

      --text-strong: var(--c-text-light);
      --text: #93c5fd;
      --text-muted: #60a5fa;
      --text-subtle: #3b91f0;

      --border: rgba(59, 145, 240, 0.22);
      --border-strong: rgba(59, 145, 240, 0.38);
      --border-faint: rgba(59, 145, 240, 0.12);

      --primary: var(--c-sky-light);
      --primary-hover: var(--c-text-light);
      --on-primary: var(--c-navy);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--color-bg);
    color: var(--text);
    font: 14px/1.6 var(--font-sans);
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--border); color: var(--text-strong); }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 20px 64px; }
  header { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
  /* display:contents keeps api-row/refresh/status as direct flex items of
     header when visible, so wrapping them for a single hide toggle below
     doesn't change header's existing flex layout at all. */
  #conn-settings { display: contents; }
  #conn-settings[hidden] { display: none; }
  h1 { font-family: var(--font-sans); font-size: 20px; font-weight: 600; color: var(--text-strong); letter-spacing: -0.01em; margin: 0; flex: 1 1 auto; min-width: 200px; }
  h2 { font-family: var(--font-sans); font-size: 15px; font-weight: 600; color: var(--text-strong); margin: 0 0 10px; }
  .api-row { display: flex; align-items: center; gap: 8px; }
  .api-row label { color: var(--text-muted); font-size: 12px; }
  input, select {
    font: 14px/1 var(--font-sans);
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-strong);
    background: var(--color-surface);
    color: var(--text);
    padding: 7px 10px;
  }
  button {
    font-family: var(--font-mono); font-size: 13px; font-weight: 500;
    border-radius: var(--radius-md); border: 1px solid var(--border-strong);
    background: var(--color-surface); color: var(--text-strong);
    padding: 7px 12px;
    transition: background var(--dur-fast) var(--ease-standard), border-color var(--dur-fast) var(--ease-standard), color var(--dur-fast) var(--ease-standard);
  }
  input:focus-visible, select:focus-visible, button:focus-visible {
    outline: 3px solid var(--focus-ring); outline-offset: 2px;
  }
  button { cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  button:hover { background: var(--color-surface-sunken); border-color: var(--steel-400); }
  button:disabled { opacity: 0.55; cursor: default; }
  button.primary { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
  button.primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
  #api-base { width: 200px; }
  #api-key { width: 160px; }
  #status { font-size: 12px; color: var(--text-muted); }
  #status.error { color: var(--danger); }
  section { margin-bottom: 28px; }
  .search-row { display: flex; justify-content: center; margin: 0 0 14px; }
  #search-input { width: 320px; max-width: 100%; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
  .card {
    background: var(--color-surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); padding: 14px 16px;
  }
  .card .n { font-family: var(--font-mono); font-size: 24px; font-weight: 600; color: var(--text-strong); }
  .card .l { font-size: 12px; color: var(--text-muted); }
  .stages { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
  .stage-pill {
    flex: 0 0 auto; display: flex; align-items: center; gap: 8px;
    background: var(--color-surface); border: 1px solid var(--border);
    border-radius: var(--radius-pill); padding: 6px 14px; font-size: 13px; white-space: nowrap;
  }
  .stage-pill .count {
    font-family: var(--font-mono); background: var(--accent-soft); color: var(--accent-hover);
    border-radius: var(--radius-pill); padding: 1px 8px; font-size: 12px; font-weight: 600;
  }
  .register-form { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .register-form input[type="text"], .register-form input[type="email"] { flex: 1 1 260px; }
  table { width: 100%; border-collapse: collapse; background: var(--color-surface); border-radius: var(--radius-lg); overflow: hidden; border: 1px solid var(--border); box-shadow: var(--shadow-sm); }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border-faint); font-size: 13px; vertical-align: middle; }
  th { color: var(--text-muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; }
  tr:last-child td { border-bottom: none; }
  .ref { font-family: var(--font-mono); font-size: 12.5px; }
  .badge {
    display: inline-flex; align-items: center; font-family: var(--font-mono);
    border-radius: var(--radius-sm); padding: 3px 8px; font-size: 11px; font-weight: 500;
    letter-spacing: 0.03em; text-transform: uppercase; border: 1px solid transparent;
  }
  .badge-neutral { background: var(--steel-100); color: var(--steel-600); }
  .badge-accent { background: var(--accent-soft); color: var(--accent-hover); }
  .badge-success { background: var(--success-soft); color: var(--success); }
  .badge-warning { background: var(--warning-soft); color: var(--warning); }
  .badge-danger { background: var(--danger-soft); color: var(--danger); }
  .count-zero { color: var(--text-muted); }
  .count-nonzero { color: var(--danger); font-weight: 600; }
  .actions { display: flex; gap: 6px; }
  .actions button { padding: 5px 10px; font-size: 12px; }
  .empty { color: var(--text-muted); padding: 24px; text-align: center; }
  .detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; padding: 4px 4px 12px; }
  .detail-col h3 { font-size: 12px; text-transform: none; color: var(--text-muted); font-weight: 600; margin: 0 0 8px; }
  .finding { display: flex; align-items: center; gap: 6px; border-radius: var(--radius-sm); padding: 6px 10px; margin-bottom: 6px; font-size: 12.5px; }
  .finding .badge { flex: 0 0 auto; }
  .finding-label { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .finding-link { flex: 0 0 auto; white-space: nowrap; color: var(--accent); font-size: 12px; }
  .finding-fixed { opacity: 0.65; }
  .timeline-item { font-size: 12.5px; padding: 4px 0; border-bottom: 1px solid var(--border-faint); }
  .timeline-item:last-child { border-bottom: none; }
  .muted { color: var(--text-muted); font-size: 12.5px; }
  .errs { color: var(--danger); font-size: 12.5px; }
  i.ti { font-size: 16px; vertical-align: -2px; }
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(11, 30, 56, 0.55);
    display: flex; align-items: center; justify-content: center;
    padding: 20px; z-index: 100;
  }
  .modal-overlay[hidden] { display: none; }
  .modal-box {
    position: relative; background: var(--color-surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg); box-shadow: var(--shadow-xl); max-width: 640px; width: 100%;
    max-height: 85vh; overflow-y: auto; padding: 20px;
  }
  .modal-box h2 { font-size: 16px; font-weight: 600; margin: 0 0 4px; padding-right: 24px; word-break: break-all; }
  .modal-close {
    position: absolute; top: 10px; right: 10px; border: none; background: transparent;
    font-size: 20px; line-height: 1; padding: 4px 8px; color: var(--text-muted);
  }
  .modal-meta {
    display: flex; flex-wrap: wrap; gap: 8px 20px; margin-bottom: 14px;
    font-size: 12.5px; color: var(--text-muted);
  }
  .modal-meta strong { color: var(--text-strong); font-weight: 600; }
  .link-btn {
    background: none; border: none; padding: 0; margin: 0; color: var(--accent);
    text-decoration: underline; cursor: pointer; font: inherit; font-family: var(--font-sans);
  }
  .maintainer-edit { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: -4px 0 14px; }
  .maintainer-edit[hidden] { display: none; }
  .maintainer-edit input { flex: 1 1 160px; }
  #detail-view[hidden] { display: none; }
  .detail-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
  .detail-actions { display: flex; gap: 6px; }
  .detail-ref {
    font-family: var(--font-mono); font-size: 26px; font-weight: 600; color: var(--text-strong);
    margin: 0 0 4px; word-break: break-all;
  }
  .detail-digest {
    font-family: var(--font-mono); font-size: 13px;
    color: var(--text-muted); margin-bottom: 14px; word-break: break-all;
  }
  .risk-spectrum, .risk-spectrum-empty { margin: 4px 0 26px; }
  .risk-bar { display: flex; height: 10px; border-radius: var(--radius-pill); overflow: hidden; background: var(--border); }
  .risk-seg { display: block; }
  .risk-danger { background: var(--danger); }
  .risk-warning { background: var(--warning); }
  .risk-neutral { background: var(--steel-400); }
  .risk-label { margin-top: 6px; font-family: var(--font-mono); font-size: 12.5px; color: var(--text-muted); }
  .detail-section-title { font-size: 12px; color: var(--text-muted); font-weight: 600; margin: 0 0 8px; }
  .pipeline-track { display: flex; align-items: center; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 26px; }
  .pipeline-arrow { color: var(--text-muted); flex: 0 0 auto; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .tab { font-size: 12px; padding: 6px 12px; }
  .tab-active { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
  .tab-panel { background: var(--color-surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); padding: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><i class="ti ti-shield-check" aria-hidden="true"></i> Supply chain monitor</h1>
    <div id="conn-settings">
      <div class="api-row">
        <label for="api-base">API</label>
        <input id="api-base" type="text" />
        <label for="api-key">Key</label>
        <input id="api-key" type="password" autocomplete="off" />
        <button id="save-api"><i class="ti ti-check" aria-hidden="true"></i></button>
      </div>
      <button id="refresh"><i class="ti ti-refresh" aria-hidden="true"></i> Refresh</button>
    </div>
    <span id="status">Connecting…</span>
  </header>

  <div id="list-view">
    <section>
      <div class="cards" id="cards"></div>
    </section>

    <section>
      <h2>Pipeline stages</h2>
      <div class="stages" id="stages"></div>
    </section>

    <section id="register-link-section" hidden>
      <a href="#" id="register-link" class="link-btn">+ Register an artifact</a>
    </section>

    <section>
      <h2>Artifacts</h2>
      <div class="search-row">
        <input type="search" id="search-input" placeholder="Search ref, digest, maintainer, stage, CVE/malware id or title…" />
      </div>
      <table>
        <thead>
          <tr>
            <th>Ref</th><th>Type</th><th>Status</th><th>Stage</th><th>CVEs</th><th>Malware</th><th>Misconfig</th><th>Secrets</th><th>Other</th><th>Updated</th><th></th>
          </tr>
        </thead>
        <tbody id="artifact-rows"></tbody>
      </table>
    </section>
  </div>

  <div id="detail-view" hidden>
    <div id="detail-body"></div>
  </div>
</div>

<div class="modal-overlay" id="register-modal-overlay" hidden>
  <div class="modal-box" role="dialog" aria-modal="true">
    <button class="modal-close" id="register-modal-close" aria-label="Close" type="button">&times;</button>
    <h2>Register an artifact</h2>
    <form class="register-form" id="register-form">
      <input type="text" id="reg-ref" placeholder="alpine:3.19, /path/to/file, ghcr.io/org/chart:1.0" required />
      <select id="reg-type">
        <option value="image">image</option>
        <option value="file">file</option>
        <option value="sbom">sbom</option>
        <option value="sarif">sarif</option>
      </select>
      <input type="text" id="reg-expected-digest" placeholder="sha256:… (optional, pins the digest)" />
      <input type="text" id="reg-maintainer-team" placeholder="Maintainer team (optional)" />
      <input type="email" id="reg-maintainer-email" placeholder="Maintainer contact email (optional)" />
      <button type="submit" class="primary"><i class="ti ti-plus" aria-hidden="true"></i> Register</button>
    </form>
  </div>
</div>

<!--
  env.js is NOT part of this file -- it's generated at container
  startup by charts/supply-chain-monitor/templates/dashboard/deployment.yaml's render-config
  initContainer, from the scm-monitor-api-auth Secret and
  scm-dashboard-config ConfigMap (see docs/architecture.md,
  "Configuring the dashboard via ConfigMap/Secret instead of by
  hand"). It sets window.SCM_CONFIG = { apiBase, apiKey,
  allowManualRegistration, showConnectionSettings } before the script below runs. Opening this file directly (or in a test) without
  that initContainer just means the request 404s/fails and
  window.SCM_CONFIG stays undefined -- the script below already
  handles that by falling back to the old manual-entry behavior.
-->
<script src="env.js"></script>
<script>
(function () {
  // Default to the same host the dashboard itself was loaded from, just
  // on the API's NodePort (30300) instead of the dashboard's (30301).
  // This self-adapts whether you're on localhost (podman runtime) or a
  // Colima VM address (colima runtime, where NodePorts aren't reachable
  // via "localhost" at all) -- a hardcoded "localhost" default broke
  // the colima path outright. Still overridable and remembered below.
  var DEFAULT_API_BASE = window.location.protocol + '//' + window.location.hostname + ':30300';
  // window.SCM_CONFIG is set by env.js (see the comment above this
  // script tag) -- rendered at container startup from the
  // scm-monitor-api-auth Secret and scm-dashboard-config ConfigMap, so
  // a fresh browser gets a working API key and (optionally) a fixed
  // API address with no manual step. localStorage still wins over it
  // if a person has explicitly typed/saved a different value in the
  // fields below -- that's a deliberate escape hatch (pointing this
  // one browser tab at a different environment temporarily), not the
  // normal path.
  var injected = window.SCM_CONFIG || {};

  var state = {
    apiBase: localStorage.getItem('scm-api-base') || injected.apiBase || DEFAULT_API_BASE,
    // Every request to monitor-api now requires `Authorization: Bearer
    // <key>` (see internal/api/router.go's withAuth).
    apiKey: localStorage.getItem('scm-api-key') || injected.apiKey || '',
    stages: [],
    artifacts: [],
    busy: {},
    searchQuery: '',
    detailTab: 'cve_findings'
  };
  var lastDetailId = null;

  // currentDetailID reads the artifact id straight out of location.hash
  // (#/artifacts/<id>) rather than mirroring it into state -- location.hash
  // is already the single source of truth for "which view is active" (it's
  // what makes a detail page bookmarkable/shareable), so a second copy in
  // state could drift from it after back/forward navigation.
  function currentDetailID() {
    var m = /^#\/artifacts\/(.+)$/.exec(location.hash);
    return m ? decodeURIComponent(m[1]) : null;
  }

  function goToDetail(id) {
    location.hash = '#/artifacts/' + encodeURIComponent(id);
    render();
  }

  function goToList() {
    location.hash = '';
    render();
  }

  var els = {
    apiBase: document.getElementById('api-base'),
    apiKey: document.getElementById('api-key'),
    saveApi: document.getElementById('save-api'),
    refresh: document.getElementById('refresh'),
    status: document.getElementById('status'),
    cards: document.getElementById('cards'),
    stages: document.getElementById('stages'),
    rows: document.getElementById('artifact-rows'),
    search: document.getElementById('search-input'),
    form: document.getElementById('register-form'),
    ref: document.getElementById('reg-ref'),
    type: document.getElementById('reg-type'),
    expectedDigest: document.getElementById('reg-expected-digest'),
    maintainerTeam: document.getElementById('reg-maintainer-team'),
    maintainerEmail: document.getElementById('reg-maintainer-email'),
    listView: document.getElementById('list-view'),
    detailView: document.getElementById('detail-view'),
    detailBody: document.getElementById('detail-body'),
    registerLinkSection: document.getElementById('register-link-section'),
    registerLink: document.getElementById('register-link'),
    registerModalOverlay: document.getElementById('register-modal-overlay'),
    registerModalClose: document.getElementById('register-modal-close'),
    connSettings: document.getElementById('conn-settings')
  };
  els.apiBase.value = state.apiBase;
  els.apiKey.value = state.apiKey;

  // The "+ Register an artifact" link is hidden unless the chart's
  // dashboard.allowManualRegistration is explicitly "true" (see
  // values.yaml) -- fail-closed like the injected apiBase/apiKey
  // pattern's own convention, so a dashboard opened without env.js
  // (or with the value unset/false) never exposes ad-hoc registration
  // a deployment didn't opt into.
  els.registerLinkSection.hidden = injected.allowManualRegistration !== 'true';

  // Opposite default from allowManualRegistration above: this is a
  // display preference, not a security gate, so it stays visible unless
  // a deployment explicitly opts out -- a dashboard opened without env.js
  // (or with the value unset/anything other than "false") keeps the API
  // base/key fields and Refresh visible, the same as before this toggle
  // existed. #status is deliberately NOT part of #conn-settings and not
  // gated here: setStatus (below) hides its idle "Connecting…"/
  // "Connected to…" text under the same preference, but always shows an
  // error regardless -- a dashboard silently displaying stale data
  // because its API died is worse than one extra line of chrome.
  els.connSettings.hidden = injected.showConnectionSettings === 'false';
  els.status.hidden = injected.showConnectionSettings === 'false';

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function timeAgo(iso) {
    if (!iso) return '—';
    var diff = (Date.now() - new Date(iso).getTime()) / 1000;
    if (diff < 60) return Math.max(0, Math.round(diff)) + 's ago';
    if (diff < 3600) return Math.round(diff / 60) + 'm ago';
    if (diff < 86400) return Math.round(diff / 3600) + 'h ago';
    return Math.round(diff / 86400) + 'd ago';
  }

  function statusBadge(status) {
    var map = {
      registered: 'badge-neutral',
      scanning: 'badge-warning',
      scanned: 'badge-success',
      failed: 'badge-danger'
    };
    return '<span class="badge ' + (map[status] || 'badge-neutral') + '">' + esc(status) + '</span>';
  }

  function severityBadge(sev) {
    var s = (sev || '').toLowerCase();
    var cls = 'badge-neutral';
    if (s === 'critical' || s === 'high') cls = 'badge-danger';
    else if (s === 'medium') cls = 'badge-warning';
    return '<span class="badge ' + cls + '">' + esc(sev || 'unknown') + '</span>';
  }

  // findingIsNew flags a finding as newly discovered on the artifact's
  // most recent scan/submission, so the dashboard can call it out
  // rather than showing it exactly the same as a finding that's been
  // open for months. There's no explicit "was this discovered on the
  // very last update" flag from the API -- instead this compares
  // first_seen_at against the artifact's own updated_at: the backend
  // (MergeFindings, called from inside the same store.Update() as the
  // one that sets updated_at) stamps a brand-new finding's first_seen_at
  // with the same "now" used for that update, so the two timestamps
  // land within milliseconds of each other in practice. A several-
  // second window comfortably absorbs that slack without ever mistaking
  // an old, still-open finding for a new one on some later, unrelated
  // update.
  function findingIsNew(f, a) {
    if (!f.first_seen_at || !a.updated_at || f.status === 'fixed') return false;
    var diffMs = Math.abs(new Date(f.first_seen_at).getTime() - new Date(a.updated_at).getTime());
    return diffMs < 5000;
  }

  // CVE_ID_RE matches a bare CVE id (e.g. "CVE-2024-1234") -- used to
  // decide whether a finding gets a "Read more" link to NVD below.
  // Deliberately checks f.id itself rather than the bucket it's in:
  // SARIF documents can mix a real CVE in among misconfiguration/secret/
  // other findings (see classifyBucket), so bucket alone isn't a
  // reliable signal -- an id that looks like a CVE gets the link
  // regardless of which bucket it landed in, and a non-CVE id (an AVD
  // rule, a ClamAV signature constant) never does.
  var CVE_ID_RE = /^CVE-\d{4}-\d+$/i;

  // renderFinding is the one place that decides how a single finding
  // looks, for all five buckets (CVE/malware/misconfiguration/secret/
  // other) -- so "new" and "fixed" render identically everywhere
  // instead of each bucket's map() callback growing its own
  // slightly-different copy.
  //   showId: CVE/SARIF findings lead with their ID (e.g. "CVE-2024-1234"),
  //     with the title (if any) appended -- malware findings lead with
  //     the title (a signature name) since their ID is just a constant
  //     ("clamav-signature-match") with no information of its own.
  // The id/title text is a single ellipsis-truncated line (a CVE
  // description pulled through from a scanner can run to a paragraph)
  // -- the full text is still available via the title attribute (a
  // native browser tooltip, no extra JS) and, for real CVEs, via the
  // "Read more" link out to NVD's own page for that id.
  function renderFinding(f, a, showId) {
    var fullText = showId
      ? f.id + (f.title ? ' — ' + f.title : '')
      : (f.title || f.id);
    var label = esc(fullText);

    var lifecycleBadge = '';
    if (f.status === 'fixed') {
      lifecycleBadge = ' <span class="badge badge-success">Fixed ' + esc(timeAgo(f.resolved_at)) + '</span>';
    } else if (findingIsNew(f, a)) {
      lifecycleBadge = ' <span class="badge badge-accent">New</span>';
    }

    var readMore = CVE_ID_RE.test(f.id)
      ? ' <a class="finding-link" href="https://nvd.nist.gov/vuln/detail/' + encodeURIComponent(f.id) +
        '" target="_blank" rel="noopener noreferrer">Read more</a>'
      : '';

    var rowCls = 'finding badge-neutral' + (f.status === 'fixed' ? ' finding-fixed' : '');
    return '<div class="' + rowCls + '">' + severityBadge(f.severity) +
      '<span class="finding-label" title="' + esc(fullText) + '">' + label + '</span>' +
      lifecycleBadge + readMore + '</div>';
  }

  function countCell(n) {
    return '<span class="' + (n > 0 ? 'count-nonzero' : 'count-zero') + '">' + n + '</span>';
  }

  // openFindings is what every "how many CVEs does this have" count
  // (the summary cards, the per-artifact table columns) should be
  // counting -- a "fixed" finding stays in the array as a permanent
  // record (see MergeFindings/renderFinding above), so counting the raw
  // array length would make every resolved CVE or cleaned-up malware
  // match look like it's still an active problem. Treats a missing/
  // unset status as open rather than excluding it, so this fails safe
  // toward showing a finding rather than silently hiding it.
  function openFindings(list) {
    return (list || []).filter(function (f) { return f.status !== 'fixed'; });
  }

  var FINDING_BUCKETS = [
    'cve_findings', 'malware_findings', 'misconfiguration_findings',
    'secret_findings', 'other_findings'
  ];

  // Matches a search query against every metadata field on an artifact
  // (id, ref, digest, type, status, stage, maintainer) plus every open
  // finding in every bucket (id, title, severity, source) -- so
  // searching a CVE ID or malware signature name finds every image
  // still affected by it, the same way searching a maintainer team
  // finds everything they own. Findings already fixed are excluded via
  // openFindings, the same filter every visible count on this page
  // (the bucket columns, the "With CVEs" card, the modal) already
  // applies -- otherwise a search for a resolved CVE would surface a
  // row showing 0 in every finding column, which reads as a bug, not
  // a match. Case-insensitive substring match, not a query language:
  // this dataset is small enough (fetched whole into state.artifacts
  // already) that a linear scan on every keystroke is plenty fast, so
  // there's no need for a backend search endpoint or an index.
  function matchesSearch(a, query) {
    var q = query.trim().toLowerCase();
    if (!q) return true;
    var fields = [
      a.id, a.ref, a.digest, a.type, a.status, a.current_stage,
      a.maintainer_team, a.maintainer_email
    ];
    for (var i = 0; i < fields.length; i++) {
      if (fields[i] && String(fields[i]).toLowerCase().indexOf(q) !== -1) return true;
    }
    for (var b = 0; b < FINDING_BUCKETS.length; b++) {
      var findings = openFindings(a[FINDING_BUCKETS[b]]);
      for (var f = 0; f < findings.length; f++) {
        var finding = findings[f];
        if (
          (finding.id && finding.id.toLowerCase().indexOf(q) !== -1) ||
          (finding.title && finding.title.toLowerCase().indexOf(q) !== -1) ||
          (finding.severity && finding.severity.toLowerCase().indexOf(q) !== -1) ||
          (finding.source && finding.source.toLowerCase().indexOf(q) !== -1)
        ) return true;
      }
    }
    return false;
  }

  async function fetchJSON(path, opts) {
    opts = opts || {};
    var headers = Object.assign({}, opts.headers || {});
    if (state.apiKey) headers['Authorization'] = 'Bearer ' + state.apiKey;
    var res = await fetch(state.apiBase + path, Object.assign({}, opts, { headers: headers }));
    var body = null;
    try { body = await res.json(); } catch (e) { /* no body */ }
    if (!res.ok) {
      // Called out distinctly from other errors: a 401 almost always
      // means the "Key" field above is empty or stale, not that
      // anything is actually broken.
      if (res.status === 401) {
        throw new Error('Unauthorized — check the API key above');
      }
      var msg = (body && body.error) ? body.error : (res.status + ' ' + res.statusText);
      throw new Error(msg);
    }
    return body;
  }

  function setStatus(text, isError) {
    els.status.textContent = text;
    els.status.className = isError ? 'error' : '';
    // See the comment where els.status.hidden is first set, above: an
    // error always shows even with showConnectionSettings: "false", so
    // a broken/unreachable API doesn't render as a quietly-empty table.
    if (isError) els.status.hidden = false;
    else if (injected.showConnectionSettings === 'false') els.status.hidden = true;
  }

  async function loadAll() {
    try {
      var stagesRes = await fetchJSON('/api/v1/pipeline/stages');
      var artifacts = await fetchJSON('/api/v1/artifacts');
      state.stages = (stagesRes && stagesRes.stages) || [];
      state.artifacts = artifacts || [];
      setStatus('Connected to ' + state.apiBase, false);
      render();
    } catch (err) {
      setStatus("Couldn't reach " + state.apiBase + ' — ' + err.message, true);
    }
  }

  function render() {
    var detailID = currentDetailID();
    if (detailID) {
      renderDetailView(detailID);
    } else {
      renderListView();
    }
  }

  function renderListView() {
    els.listView.hidden = false;
    els.detailView.hidden = true;
    renderCards();
    renderStages();
    renderRows();
  }

  function renderDetailView(id) {
    els.listView.hidden = true;
    els.detailView.hidden = false;
    // A fresh id resets the findings tab to CVE -- otherwise leaving
    // "Secrets" selected on one artifact would carry over to the next
    // artifact you open, which reads as a bug (missing findings) rather
    // than a leftover selection.
    if (id !== lastDetailId) {
      state.detailTab = 'cve_findings';
      lastDetailId = id;
    }
    var a = state.artifacts.filter(function (x) { return x.id === id; })[0];
    if (!a) {
      // A genuinely missing artifact (bad link, or deleted in another
      // tab) gets a real empty state instead of silently rendering
      // nothing -- this also covers the moment right after loadAll()
      // resolves on a hard reload of a detail URL, before the id is in
      // state.artifacts yet.
      els.detailBody.innerHTML =
        '<p class="muted">Artifact not found. It may have been deleted.</p>' +
        '<button type="button" class="link-btn" data-action="back">← Back to artifacts</button>';
      return;
    }
    els.detailBody.innerHTML = renderDetailPage(a);
  }

  function renderCards() {
    var total = state.artifacts.length;
    var scanning = state.artifacts.filter(function (a) { return a.status === 'scanning'; }).length;
    var withCVEs = state.artifacts.filter(function (a) { return openFindings(a.cve_findings).length > 0; }).length;
    var withMalware = state.artifacts.filter(function (a) { return openFindings(a.malware_findings).length > 0; }).length;
    var withOther = state.artifacts.filter(function (a) { return openFindings(a.other_findings).length > 0; }).length;
    // These two are appended after the original five rather than
    // inserted among them, so the existing cards keep their positions
    // (some tests index into this array by position).
    var withMisconfig = state.artifacts.filter(function (a) { return openFindings(a.misconfiguration_findings).length > 0; }).length;
    var withSecrets = state.artifacts.filter(function (a) { return openFindings(a.secret_findings).length > 0; }).length;
    var cards = [
      ['Artifacts', total],
      ['Scanning now', scanning],
      ['With CVEs', withCVEs],
      ['With malware', withMalware],
      ['With other findings', withOther],
      ['With misconfigurations', withMisconfig],
      ['With secrets', withSecrets]
    ];
    els.cards.innerHTML = cards.map(function (c) {
      return '<div class="card"><div class="n">' + c[1] + '</div><div class="l">' + c[0] + '</div></div>';
    }).join('');
  }

  function renderStages() {
    if (!state.stages.length) {
      els.stages.innerHTML = '<span class="muted">No pipeline stages configured.</span>';
      return;
    }
    var counts = {};
    var unassigned = 0;
    state.artifacts.forEach(function (a) {
      if (a.current_stage) counts[a.current_stage] = (counts[a.current_stage] || 0) + 1;
      else unassigned++;
    });
    var pills = state.stages.map(function (s) {
      return '<div class="stage-pill">' + esc(s) + '<span class="count">' + (counts[s] || 0) + '</span></div>';
    });
    pills.push('<div class="stage-pill">unassigned<span class="count">' + unassigned + '</span></div>');
    els.stages.innerHTML = pills.join('');
  }

  function renderRows() {
    if (!state.artifacts.length) {
      // "Register one above" only makes sense when that link actually
      // exists -- see allowManualRegistration's gate above.
      var emptyMsg = els.registerLinkSection.hidden
        ? 'No artifacts yet.'
        : 'No artifacts yet. Register one above to get started.';
      els.rows.innerHTML = '<tr><td colspan="11" class="empty">' + emptyMsg + '</td></tr>';
      return;
    }
    var matched = state.artifacts.filter(function (a) { return matchesSearch(a, state.searchQuery); });
    if (!matched.length) {
      els.rows.innerHTML = '<tr><td colspan="11" class="empty">No artifacts match &quot;' + esc(state.searchQuery.trim()) + '&quot;.</td></tr>';
      return;
    }
    var rows = [];
    matched
      .slice()
      .sort(function (a, b) { return new Date(b.updated_at) - new Date(a.updated_at); })
      .forEach(function (a) {
        var busy = !!state.busy[a.id];
        rows.push(
          '<tr data-id="' + esc(a.id) + '">' +
            '<td class="ref" title="' + esc(a.ref) + '">' + esc(a.ref) + '</td>' +
            '<td>' + esc(a.type) + '</td>' +
            '<td>' + statusBadge(a.status) + '</td>' +
            '<td>' + (a.current_stage ? esc(a.current_stage) : '<span class="muted">—</span>') + '</td>' +
            '<td>' + countCell(openFindings(a.cve_findings).length) + '</td>' +
            '<td>' + countCell(openFindings(a.malware_findings).length) + '</td>' +
            '<td>' + countCell(openFindings(a.misconfiguration_findings).length) + '</td>' +
            '<td>' + countCell(openFindings(a.secret_findings).length) + '</td>' +
            '<td>' + countCell(openFindings(a.other_findings).length) + '</td>' +
            '<td class="muted">' + timeAgo(a.updated_at) + '</td>' +
            '<td class="actions">' +
              '<button data-action="scan" data-id="' + esc(a.id) + '" ' + (busy ? 'disabled' : '') + '>' +
                (busy ? 'Scanning…' : '<i class="ti ti-player-play" aria-hidden="true"></i> Scan') +
              '</button>' +
              '<button data-action="toggle" data-id="' + esc(a.id) + '">Details</button>' +
              '<button data-action="delete" data-id="' + esc(a.id) + '" data-ref="' + esc(a.ref) + '" ' + (busy ? 'disabled' : '') + '>' +
                '<i class="ti ti-trash" aria-hidden="true"></i> Delete' +
              '</button>' +
            '</td>' +
          '</tr>'
        );
      });
    els.rows.innerHTML = rows.join('');
  }

  // lastScanText reads Artifact.LastScanAt (set server-side only when
  // /scan or /findings actually completes -- see
  // internal/api/handlers.go) rather than updated_at, which also moves
  // on unrelated mutations like a /stage call or the digest backfill
  // and would otherwise misreport those as a fresh scan.
  function lastScanText(a) {
    if (!a.last_scan_at) return 'Not yet scanned';
    return timeAgo(a.last_scan_at);
  }

  // maintainerText is the modal's read-only view of who owns an
  // artifact -- "Not set" (not an empty string) so a never-configured
  // artifact reads as a deliberate state, not a rendering glitch.
  function maintainerText(a) {
    if (!a.maintainer_team && !a.maintainer_email) return '<span class="muted">Not set</span>';
    return esc(a.maintainer_team) + ' — <a href="mailto:' + esc(a.maintainer_email) + '">' + esc(a.maintainer_email) + '</a>';
  }

  // documentLinks renders a "Download SBOM"/"Download SARIF report"
  // button for each document that's actually been captured (a.has_sbom/
  // has_sarif, set by the API -- see Artifact.HasSBOM's comment; never
  // both false-and-missing-button vs true-and-broken-download, since
  // the flag and the document's existence are the same fact from the
  // same source). Buttons, not plain <a href> links: every API route
  // requires an Authorization: Bearer header (see router.go's withAuth),
  // which a browser never attaches to a plain link navigation -- see
  // downloadDocument below for the fetch-as-blob approach this requires.
  function documentLinks(a) {
    var links = [];
    if (a.has_sbom) links.push('<button type="button" class="link-btn" data-action="download-sbom" data-id="' + esc(a.id) + '">Download SBOM</button>');
    if (a.has_sarif) links.push('<button type="button" class="link-btn" data-action="download-sarif" data-id="' + esc(a.id) + '">Download SARIF report</button>');
    if (!links.length) return '<span class="muted">Not yet generated</span>';
    return links.join(' · ');
  }

  // downloadDocument fetches a document as an authenticated request
  // (fetchJSON can't be reused as-is: it always calls res.json(), which
  // would try to parse a multi-megabyte SBOM/SARIF document as a single
  // JSON value just to throw it away), then triggers a save via a
  // synthetic, temporary <a download> -- the standard way to save a
  // fetched Blob to disk from JS, since the browser download UI itself
  // only ever triggers off an <a> element, never directly off a fetch
  // response.
  async function downloadDocument(id, kind, filename) {
    var headers = {};
    if (state.apiKey) headers['Authorization'] = 'Bearer ' + state.apiKey;
    var res = await fetch(state.apiBase + '/api/v1/artifacts/' + id + '/documents/' + kind, { headers: headers });
    if (!res.ok) {
      throw new Error(res.status === 401 ? 'Unauthorized — check the API key above' : (res.status + ' ' + res.statusText));
    }
    var blob = await res.blob();
    var url = URL.createObjectURL(blob);
    var link = document.createElement('a');
    link.href = url;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(url);
  }

  var BUCKET_LABELS = {
    cve_findings: 'CVE',
    malware_findings: 'Malware',
    misconfiguration_findings: 'Misconfig',
    secret_findings: 'Secret',
    other_findings: 'Other'
  };

  // riskSpectrum is the detail page's one signature visual: a single bar
  // whose segment widths are proportional to open-finding severity, so
  // an artifact's risk reads as a shape at a glance instead of six
  // separate counts competing for attention. Colored in the same three
  // buckets severityBadge already uses (critical+high share "danger" --
  // there's no separate token for critical, and inventing one here would
  // make this page speak a different severity language than every badge
  // elsewhere), but the label text stays granular so "3 critical, 5
  // high" isn't flattened into one number.
  function riskSpectrum(a) {
    var counts = { critical: 0, high: 0, medium: 0, low: 0, unknown: 0 };
    var buckets = { danger: 0, warning: 0, neutral: 0 };
    FINDING_BUCKETS.forEach(function (key) {
      openFindings(a[key]).forEach(function (f) {
        var s = (f.severity || '').toLowerCase();
        if (s === 'critical') { counts.critical++; buckets.danger++; }
        else if (s === 'high') { counts.high++; buckets.danger++; }
        else if (s === 'medium') { counts.medium++; buckets.warning++; }
        else if (s === 'low') { counts.low++; buckets.neutral++; }
        else { counts.unknown++; buckets.neutral++; }
      });
    });
    var total = buckets.danger + buckets.warning + buckets.neutral;
    if (!total) return '<div class="risk-spectrum-empty muted">No open findings.</div>';
    var label = ['critical', 'high', 'medium', 'low', 'unknown']
      .filter(function (k) { return counts[k] > 0; })
      .map(function (k) { return counts[k] + ' ' + k; })
      .join(' · ');
    var bar =
      (buckets.danger ? '<span class="risk-seg risk-danger" style="flex:' + buckets.danger + '"></span>' : '') +
      (buckets.warning ? '<span class="risk-seg risk-warning" style="flex:' + buckets.warning + '"></span>' : '') +
      (buckets.neutral ? '<span class="risk-seg risk-neutral" style="flex:' + buckets.neutral + '"></span>' : '');
    return '<div class="risk-spectrum"><div class="risk-bar">' + bar + '</div><div class="risk-label">' + esc(label) + '</div></div>';
  }

  // pipelineTracker reuses the .stage-pill look from the "Pipeline
  // stages" summary above the table -- the same visual language for the
  // same concept (a stage), just one artifact's history instead of the
  // whole fleet's current distribution. a.stage_history already arrives
  // chronological (oldest first, per the old modal's own .reverse() to
  // show newest-first) which reads naturally left-to-right here. A
  // note, if any, is a title-attribute tooltip rather than always-on
  // text: notes can run long, and this is a single scannable line, not
  // a timeline column with room to spare.
  function pipelineTracker(a) {
    var hist = a.stage_history || [];
    if (!hist.length) return '<span class="muted">No stage events recorded yet.</span>';
    return '<div class="pipeline-track">' + hist.map(function (e) {
      var title = e.note ? esc(e.stage + ' — ' + e.note) : esc(e.stage);
      return '<div class="stage-pill" title="' + title + '">' + esc(e.stage) +
        '<span class="count">' + esc(new Date(e.timestamp).toLocaleDateString()) + '</span></div>';
    }).join('<span class="pipeline-arrow">→</span>') + '</div>';
  }

  // renderFindingsTabs shows one finding bucket at a time (state.detailTab)
  // instead of the old modal's six parallel columns -- a full page has
  // room to let one category's findings breathe (full titles, full CVE
  // ids) rather than every bucket truncating to fit six-way. Tab labels
  // still show every bucket's open count via countCell, so switching
  // categories is informed, not a guess. showId matches renderFinding's
  // original per-bucket behavior exactly (malware ids are a constant
  // signature name with no information of their own; every other bucket
  // leads with its id).
  function renderFindingsTabs(a) {
    var activeKey = state.detailTab || 'cve_findings';
    var tabsHtml = FINDING_BUCKETS.map(function (key) {
      var active = key === activeKey;
      return '<button type="button" class="tab' + (active ? ' tab-active' : '') + '" data-action="tab" data-bucket="' + key + '">' +
        BUCKET_LABELS[key] + ' ' + countCell(openFindings(a[key]).length) + '</button>';
    }).join('');

    var list = a[activeKey] || [];
    var showId = activeKey !== 'malware_findings';
    var listHtml = list.length
      ? list.map(function (f) { return renderFinding(f, a, showId); }).join('')
      : '<span class="muted">No ' + BUCKET_LABELS[activeKey].toLowerCase() + ' findings.</span>';

    return '<div class="tabs">' + tabsHtml + '</div><div class="tab-panel">' + listHtml + '</div>';
  }

  // renderDetailPage builds the full artifact detail page: identity
  // (ref/digest set large and monospace -- the digest is the artifact's
  // actual immutable identity, a tag is just a mutable label pointing at
  // it), the risk spectrum signature, pipeline history, and tabbed
  // findings. The maintainer edit form is rendered every time (not built
  // on demand when Edit is clicked) and just kept hidden -- simpler than
  // injecting markup later, and its inputs are pre-filled with the
  // artifact's current values so Cancel needs no extra state to restore.
  function renderDetailPage(a) {
    var busy = !!state.busy[a.id];
    return (
      '<div class="detail-header">' +
        '<button type="button" class="link-btn" data-action="back">← Back</button>' +
        '<div class="detail-actions">' +
          '<button type="button" data-action="scan" data-id="' + esc(a.id) + '" ' + (busy ? 'disabled' : '') + '>' +
            (busy ? 'Scanning…' : '<i class="ti ti-player-play" aria-hidden="true"></i> Scan') +
          '</button>' +
          '<button type="button" data-action="delete" data-id="' + esc(a.id) + '" data-ref="' + esc(a.ref) + '" ' + (busy ? 'disabled' : '') + '>' +
            '<i class="ti ti-trash" aria-hidden="true"></i> Delete' +
          '</button>' +
        '</div>' +
      '</div>' +
      '<h2 class="detail-ref">' + esc(a.ref) + '</h2>' +
      '<div class="detail-digest">' + (a.digest ? esc(a.digest) : '<span class="muted">digest not resolved</span>') + '</div>' +
      '<div class="modal-meta">' +
        '<span>' + esc(a.type) + '</span>' +
        '<span>' + statusBadge(a.status) + '</span>' +
        '<span><strong>Last scan:</strong> ' + esc(lastScanText(a)) + '</span>' +
        '<span><strong>Maintainer:</strong> ' + maintainerText(a) +
          ' <button type="button" class="link-btn" data-action="edit-maintainer">Edit</button></span>' +
        '<span><strong>Documents:</strong> ' + documentLinks(a) + '</span>' +
      '</div>' +
      '<div class="maintainer-edit" id="maintainer-edit" data-id="' + esc(a.id) + '" hidden>' +
        '<input type="text" id="maintainer-edit-team" placeholder="Team" value="' + esc(a.maintainer_team || '') + '" />' +
        '<input type="email" id="maintainer-edit-email" placeholder="Contact email" value="' + esc(a.maintainer_email || '') + '" />' +
        '<button type="button" class="primary" data-action="save-maintainer">Save</button>' +
        '<button type="button" data-action="cancel-edit-maintainer">Cancel</button>' +
      '</div>' +
      riskSpectrum(a) +
      '<h3 class="detail-section-title">Pipeline</h3>' +
      pipelineTracker(a) +
      '<h3 class="detail-section-title">Findings</h3>' +
      renderFindingsTabs(a) +
      (a.last_scan_errors && a.last_scan_errors.length ? '<div class="errs">' + a.last_scan_errors.map(esc).join('<br>') + '</div>' : '')
    );
  }

  // Delegated (bound once to detailBody, not re-attached on every render
  // the way a per-button onclick would need to be) since renderDetailPage
  // rebuilds the container's innerHTML from scratch every time it draws.
  els.detailBody.addEventListener('click', async function (ev) {
    var btn = ev.target.closest('button[data-action]');
    if (!btn) return;
    var action = btn.getAttribute('data-action');

    if (action === 'back') { goToList(); return; }
    if (action === 'tab') { state.detailTab = btn.getAttribute('data-bucket'); render(); return; }
    if (action === 'scan') { scanArtifact(btn.getAttribute('data-id')); return; }
    if (action === 'delete') { await deleteArtifact(btn.getAttribute('data-id'), btn.getAttribute('data-ref')); return; }

    if (action === 'download-sbom' || action === 'download-sarif') {
      var docID = btn.getAttribute('data-id');
      var docArtifact = state.artifacts.filter(function (x) { return x.id === docID; })[0];
      var kind = action === 'download-sbom' ? 'sbom' : 'sarif';
      var ext = kind === 'sarif' ? '.sarif' : '.json';
      var safeRef = docArtifact ? docArtifact.ref.replace(/[^a-zA-Z0-9._-]/g, '_') : docID;
      try {
        await downloadDocument(docID, kind, safeRef + '-' + kind + ext);
      } catch (err) {
        setStatus('Could not download ' + kind + ' — ' + err.message, true);
      }
      return;
    }

    var editBox = document.getElementById('maintainer-edit');
    if (!editBox) return;

    if (action === 'edit-maintainer') {
      editBox.hidden = false;
      return;
    }
    if (action === 'cancel-edit-maintainer') {
      editBox.hidden = true;
      return;
    }
    if (action === 'save-maintainer') {
      var id = editBox.getAttribute('data-id');
      var team = document.getElementById('maintainer-edit-team').value.trim();
      var email = document.getElementById('maintainer-edit-email').value.trim();
      if (!team || !email) {
        setStatus('Maintainer team and contact email are both required', true);
        return;
      }
      try {
        var updated = await fetchJSON('/api/v1/artifacts/' + id + '/maintainer', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ team: team, email: email })
        });
        for (var i = 0; i < state.artifacts.length; i++) {
          if (state.artifacts[i].id === id) { state.artifacts[i] = updated; break; }
        }
        render();
        setStatus('Maintainer updated', false);
      } catch (err) {
        setStatus('Could not update maintainer — ' + err.message, true);
      }
    }
  });

  async function scanArtifact(id) {
    state.busy[id] = true;
    render();
    try {
      await fetchJSON('/api/v1/artifacts/' + id + '/scan', { method: 'POST' });
    } catch (err) {
      setStatus('Scan failed for ' + id + ' — ' + err.message, true);
    } finally {
      delete state.busy[id];
      await loadAll();
    }
  }

  // deleteArtifact is permanent -- there's no undo and no soft-delete
  // (see docs/architecture.md, "Deleting an artifact"), so this is the
  // one destructive action on the dashboard that gets a confirm()
  // guard in front of it. window.confirm is a real, blocking browser
  // dialog here (not stubbed out), so the dashboard's own JS tests
  // stub window.confirm to drive both the accept and cancel paths.
  async function deleteArtifact(id, ref) {
    if (!window.confirm('Delete ' + (ref || id) + '? This cannot be undone.')) return;
    state.busy[id] = true;
    render();
    try {
      await fetchJSON('/api/v1/artifacts/' + id, { method: 'DELETE' });
      // Leaving the hash pointed at a now-deleted artifact would land on
      // the detail view's "not found" state after loadAll() below --
      // clearing it first sends a delete-from-the-detail-page back to
      // the list instead, same as a delete-from-the-table-row already
      // stays on the list.
      if (currentDetailID() === id) location.hash = '';
    } catch (err) {
      setStatus('Delete failed for ' + id + ' — ' + err.message, true);
    } finally {
      delete state.busy[id];
      await loadAll();
    }
  }

  els.rows.addEventListener('click', function (ev) {
    var btn = ev.target.closest('button[data-action]');
    if (!btn) return;
    var id = btn.getAttribute('data-id');
    var action = btn.getAttribute('data-action');
    if (action === 'scan') scanArtifact(id);
    if (action === 'toggle') goToDetail(id);
    if (action === 'delete') deleteArtifact(id, btn.getAttribute('data-ref'));
  });

  // Covers back/forward navigation and any manual edit of the hash --
  // clicks that set location.hash themselves (goToDetail/goToList) also
  // call render() directly, since jsdom (and this app's own tests) don't
  // dispatch 'hashchange' synchronously the way a real browser does.
  window.addEventListener('hashchange', render);

  function openRegisterModal() {
    els.registerModalOverlay.hidden = false;
  }

  function closeRegisterModal() {
    els.registerModalOverlay.hidden = true;
  }

  els.registerLink.addEventListener('click', function (ev) {
    ev.preventDefault();
    openRegisterModal();
  });
  els.registerModalClose.addEventListener('click', closeRegisterModal);
  els.registerModalOverlay.addEventListener('click', function (ev) {
    if (ev.target === els.registerModalOverlay) closeRegisterModal();
  });

  document.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Escape') return;
    if (!els.registerModalOverlay.hidden) closeRegisterModal();
  });

  els.form.addEventListener('submit', async function (ev) {
    ev.preventDefault();
    var ref = els.ref.value.trim();
    if (!ref) return;

    var body = { ref: ref, type: els.type.value };
    var expected = els.expectedDigest.value.trim();
    if (expected) body.expected_digest = expected;

    var team = els.maintainerTeam.value.trim();
    var email = els.maintainerEmail.value.trim();
    if (!!team !== !!email) {
      setStatus('Maintainer team and contact email must both be filled in, or both left blank', true);
      return;
    }
    if (team) {
      body.maintainer_team = team;
      body.maintainer_email = email;
    }

    try {
      await fetchJSON('/api/v1/artifacts', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      els.ref.value = '';
      els.expectedDigest.value = '';
      els.maintainerTeam.value = '';
      els.maintainerEmail.value = '';
      closeRegisterModal();
      setStatus('Artifact registered', false);
      await loadAll();
    } catch (err) {
      setStatus('Could not register artifact — ' + err.message, true);
    }
  });

  els.saveApi.addEventListener('click', function () {
    state.apiBase = els.apiBase.value.trim() || DEFAULT_API_BASE;
    state.apiKey = els.apiKey.value.trim();
    localStorage.setItem('scm-api-base', state.apiBase);
    localStorage.setItem('scm-api-key', state.apiKey);
    loadAll();
  });
  els.refresh.addEventListener('click', loadAll);

  els.search.addEventListener('input', function () {
    state.searchQuery = els.search.value;
    renderRows();
  });

  loadAll();
  setInterval(loadAll, 10000);
})();
</script>
</body>
</html>
