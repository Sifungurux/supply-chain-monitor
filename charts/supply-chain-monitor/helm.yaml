  # docs/architecture.md for why the in-memory store was replaced.
  # POSTGRES_PASSWORD is deliberately absent here: it comes from the
  # scm-postgres-credentials Secret (templates/postgres/secret.yaml) via
  # this chart's monitor-api/deployment.yaml secretKeyRef, not this
  # plaintext ConfigMap.
