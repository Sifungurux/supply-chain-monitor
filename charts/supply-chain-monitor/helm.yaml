# Source: supply-chain-monitor/templates/monitor-api/trivy-db-refresh-cronjob.yaml
# Keeps scm-trivy-db-cache current after trivy-db-cache-primer-job's
# one-time install-time download -- every isolated Trivy scan-worker
# Job (IsolatedTrivyScanner) always passes --skip-db-update /
# --skip-java-db-update (see main.go's runScanWorker), so without this
# CronJob the DB would stay frozen at whatever it was the day this
# chart was first installed. Mirrors
# templates/postgres/backup-cronjob.yaml's shape closely -- see that
# file's comment for the general pattern.
#
# Reuses monitor-api's own image, same as the primer Job -- trivy is
# already installed into it.
#
# concurrencyPolicy: Forbid (same as the postgres backup CronJob):
# two overlapping refreshes writing into the same PVC at once is only
# ever wasted work, never a correctness problem worth allowing, so
# there's no reason to let it happen.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: scm-trivy-db-refresh
  namespace: default
  labels:
    app: scm-trivy-db-refresh
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app: scm-trivy-db-refresh
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app: scm-trivy-db-refresh
        spec:
          restartPolicy: Never
          containers:
            - name: trivy-db-refresh
              image: "monitor-api:dev"
              command: ["sh", "-c"]
              args:
                - |
                  set -eu
                  args=""
                  [ -n "${TRIVY_DB_REPOSITORY:-}" ] && args="--db-repository ${TRIVY_DB_REPOSITORY}"
                  echo "refreshing trivy vulnerability DB in ${TRIVY_CACHE_DIR}"
                  trivy image --cache-dir "${TRIVY_CACHE_DIR}" --download-db-only ${args}
                  javaargs=""
                  [ -n "${TRIVY_JAVA_DB_REPOSITORY:-}" ] && javaargs="--java-db-repository ${TRIVY_JAVA_DB_REPOSITORY}"
                  echo "refreshing trivy java DB in ${TRIVY_CACHE_DIR}"
                  trivy image --cache-dir "${TRIVY_CACHE_DIR}" --download-java-db-only ${javaargs}
                  echo "trivy DB cache refreshed"
              env:
                - name: TRIVY_CACHE_DIR
                  value: "/trivy-cache"
                - name: TRIVY_DB_REPOSITORY
                  value: ""
                - name: TRIVY_JAVA_DB_REPOSITORY
                  value: ""
              volumeMounts:
                - name: trivy-cache
                  mountPath: "/trivy-cache"
              resources:
                limits:
                  cpu: 500m
                  memory: 768Mi
                requests:
                  cpu: 100m
                  memory: 256Mi
          volumes:
            - name: trivy-cache
              persistentVolumeClaim:
                claimName: scm-trivy-db-cache

---
# Source: supply-chain-monitor/templates/postgres/backup-cronjob.yaml
# Daily pg_dump of scm-postgres into scm-postgres-backups, gzip-compressed,
# with simple filename-based retention (keeps the newest keepBackups
# files, deletes older ones) -- see docs/architecture.md ("Postgres
# backups") and README's "Backing up and restoring Postgres" for the
# human-facing how-to, including on-demand backups (`make db-backup`)
# and restoring (`make db-restore BACKUP=...`).
#
# Uses the same image as the database itself specifically so pg_dump's
# version always matches the server's -- pg_dump is generally
# forward-compatible with newer servers but not guaranteed
# backward-compatible with older ones, and using the same image
# sidesteps that question entirely.
#
# Deliberately NOT hardened the same way monitor-api's scan-worker Job
# is (no forced non-root user, no read-only root filesystem): this
# container only ever touches this cluster's own trusted database
# credentials and its own dump output, never untrusted external
# content, so that hardening's actual payoff here is much smaller.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: scm-postgres-backup
  namespace: default
  labels:
    app: scm-postgres-backup
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app: scm-postgres-backup
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: scm-postgres-backup
        spec:
          restartPolicy: Never
          containers:
            - name: pg-dump
              image: "percona/percona-distribution-postgresql:17.10"
              command: ["sh", "-c"]
              args:
                - |
                  set -eu
                  ts=$(date -u +%Y%m%dT%H%M%SZ)
                  out="/backups/scm-postgres-${ts}.sql.gz"
                  echo "backing up ${POSTGRES_DB} to ${out}"
                  export PGPASSWORD="$POSTGRES_PASSWORD"
                  pg_dump -h "$POSTGRES_HOST" -p "$POSTGRES_PORT" -U "$POSTGRES_USER" -d "$POSTGRES_DB" | gzip > "$out"
                  echo "backup complete: $(du -h "$out" | cut -f1)"
                  cd /backups
                  count=$(ls -1t scm-postgres-*.sql.gz 2>/dev/null | wc -l)
                  if [ "$count" -gt "$KEEP_BACKUPS" ]; then
                    echo "pruning to the newest $KEEP_BACKUPS backups (had $count)"
                    ls -1t scm-postgres-*.sql.gz | tail -n +$((KEEP_BACKUPS + 1)) | xargs -r rm -v --
                  fi
              env:
                - name: POSTGRES_HOST
                  value: scm-postgres.default.svc.cluster.local
                - name: POSTGRES_PORT
                  value: "5432"
                - name: KEEP_BACKUPS
                  value: "7"
              envFrom:
                - secretRef:
                    name: scm-postgres-credentials
              volumeMounts:
                - name: backups
                  mountPath: /backups
              resources:
                limits:
                  cpu: 500m
                  memory: 256Mi
                requests:
                  cpu: 50m
                  memory: 64Mi
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: scm-postgres-backups

---
# Source: supply-chain-monitor/templates/gateway/gateway.yaml
# References the GatewayClass gatewayclass.yaml creates in this same
# chart -- if Traefik's own HelmRelease hasn't reconciled yet (or the
# Gateway API CRDs from cluster/install-gateway-api.sh aren't
# installed), this Gateway simply sits with an unaccepted/unknown
# status until both exist; no strict apply-ordering is required,
# Flux/Traefik converge on their own.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: scm-gateway
  namespace: default
spec:
  gatewayClassName: traefik
  listeners:
    # listenerPort (8000 by default), not 80 -- deliberately. Traefik's
    # own docs are explicit that a Gateway listener's port must match
    # one of Traefik's actual configured EntryPoint ports
    # (https://doc.traefik.io/traefik/routing/providers/kubernetes-gateway/#listeners),
    # and Traefik's "web" EntryPoint (k8s/releases/traefik-helmrelease.yaml
    # doesn't override ports.web.port) is configured on container port
    # 8000 internally -- port 80 only exists one layer further out, as
    # Traefik's Service's exposedPort/NodePort (30080) mapping onto that
    # same container port. Using 80 here (matching the *external* port)
    # looked reasonable but doesn't match anything Traefik itself knows
    # about, so it silently programmed no route at all: every request
    # landed on Traefik's own default "no route" handler instead
    # (`404 page not found`, Go's stdlib http.NotFound text -- not
    # nginx's 404 page, which is what tipped this off as a Traefik-level
    # routing problem rather than the dashboard itself). Clients still
    # connect at the external NodePort (30080) exactly as before --
    # this port only affects how Traefik wires the Gateway to its own
    # EntryPoint internally, nothing external changes.
    - name: http
      port: 8000
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same

---
# Source: supply-chain-monitor/templates/gateway/gatewayclass.yaml
# "Skeleton" GatewayClass -- normally the ingress controller's own chart
# creates this (Traefik's chart can, via gatewayClass.enabled), but
# that's explicitly turned off in k8s/releases/traefik-helmrelease.yaml
# so this application chart owns it instead, matching this project's
# general preference for explicit, hand-written resources over relying
# on a chart's own default-object convenience behavior (e.g.
# k8s/flux-system/gotk-sync.yaml being hand-written instead of using
# `flux bootstrap`). GatewayClass is cluster-scoped (no namespace) --
# controllerName must match whatever ingress controller is actually
# installed; currently Traefik (see k8s/releases/traefik-helmrelease.yaml
# and https://doc.traefik.io/traefik/routing/providers/kubernetes-gateway/).
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: traefik
spec:
  controllerName: traefik.io/gateway-controller

---
# Source: supply-chain-monitor/templates/gateway/httproute.yaml
# Routes everything through scm-gateway (see gateway.yaml) to the
# dashboard's own Service (templates/dashboard/service.yaml) -- no
# hostname restriction, so this matches on any Host header, reachable at
# whatever address/port Traefik itself is exposed on (NodePort 30080 --
# see k8s/releases/traefik-helmrelease.yaml). The dashboard's existing
# direct NodePort (30301) still works unchanged; this is an additional
# path in, not a replacement.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: scm-dashboard
  namespace: default
spec:
  parentRefs:
    - name: scm-gateway
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: scm-dashboard
          port: 80
---
# Source: supply-chain-monitor/templates/monitor-api/trivy-db-cache-pvc.yaml
# The vulnerability DB every isolated Trivy scan-worker Job
# (IsolatedTrivyScanner) reads -- pre-downloaded and kept warm by
# trivy-db-cache-primer-job.yaml (once, at install/upgrade time) and
# trivy-db-refresh-cronjob.yaml (daily thereafter), rather than each
# scan-worker Job downloading its own copy. See
# docs/architecture.md ("Isolating Trivy scanning") for the full
# rationale; short version: trivy's vulnerability DB is opened
# read-only internally, so many scan-worker Jobs can safely share one
# copy of it concurrently, but the DB itself is large enough (and
# public-internet-fetched often enough) that downloading it fresh per
# scan would make every scan slow and network-dependent.
#
# A pre-install/pre-upgrade hook, exactly like
# templates/postgres/pvc.yaml's scm-postgres-backups PVC, and for the
# identical reason: most single-node dev clusters' default StorageClass
# (e.g. k3d/colima's "local-path") uses volumeBindingMode:
# WaitForFirstConsumer, which only binds a PVC once some pod actually
# gets scheduled against it. Without a hook, this PVC would have no
# real consumer until either the primer Job below or the first real
# scan-worker Job runs -- and a scan-worker Job only ever runs on
# demand, so with no hook this PVC would sit Pending indefinitely and
# Helm/Flux's readiness wait would eventually time out on it.
#
# hook-weight -5 (same as scm-postgres-backups) so this exists before
# the primer Job (-4) tries to mount it.
#
# ReadWriteOnce, not ReadWriteMany: this project's dev clusters
# (colima/k3d) are single-node, so every pod that mounts this PVC --
# the primer Job, the refresh CronJob, and however many concurrent
# scan-worker Jobs -- lands on the same node anyway, and RWO allows
# any number of pods on that one node to mount it simultaneously (RWO
# restricts to one *node*, not one *pod*). A genuinely multi-node
# cluster would need a ReadWriteMany-capable StorageClass (e.g. NFS)
# instead -- flagged here rather than silently assumed away.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: scm-trivy-db-cache
  namespace: default
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi

---
# Source: supply-chain-monitor/templates/postgres/pvc.yaml
# Separate from scm-postgres-data (the live database's own PVC) on
# purpose: a backup that lives on the exact same volume as the data it's
# backing up wouldn't survive the one failure mode backups exist for in
# the first place (that PVC/its underlying storage getting corrupted or
# lost).
#
# This is a pre-install/pre-upgrade hook, not a normal chart resource --
# deliberately, and paired with backup-pvc-primer-job.yaml. Most
# single-node dev clusters' default StorageClass (e.g. k3s/k3d/colima's
# "local-path") uses volumeBindingMode: WaitForFirstConsumer, which only
# binds a PVC once some pod actually gets scheduled against it. This
# PVC's only real consumer is scm-postgres-backup, a CronJob that
# doesn't run until its own schedule fires -- so with no consumer at
# install time, it would stay Pending forever, and Helm's readiness
# wait would eventually time out on it (the exact error this fixes:
# "PersistentVolumeClaim/.../scm-postgres-backups status: InProgress").
# Making this a pre-install hook (applied before Helm's wait step even
# starts) and following it immediately with a tiny primer Job that
# mounts it once is enough to trigger binding, regardless of which
# provisioner/StorageClass is actually in play.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: scm-postgres-backups
  namespace: default
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi

---
# Source: supply-chain-monitor/templates/monitor-api/trivy-db-cache-primer-job.yaml
# Populates scm-trivy-db-cache with a real, usable vulnerability DB
# once, at install/upgrade time -- pairs with trivy-db-cache-pvc.yaml's
# hook annotations (see that file's comment for the WaitForFirstConsumer
# "why"). Unlike scm-postgres-backups-primer (which only touches its
# PVC to trigger binding, since scm-postgres-backup won't actually run
# until its own schedule fires), this primer does the real work: every
# scan-worker Job created before trivy-db-refresh-cronjob's first
# scheduled run needs *something* to read, and --skip-db-update means
# it will never try to fetch one itself.
#
# Reuses monitor-api's own image rather than pulling a separate trivy
# image -- trivy is already installed into it (see Dockerfile), the
# same reason the isolated scan-worker Jobs do this too.
#
# hook-weight -4 (after the PVC's -5, before anything that expects a
# populated cache to exist). Not hardened like the actual scan-worker
# Jobs (no forced non-root user, no read-only root filesystem) --
# same reasoning as scm-postgres-backup: this only ever touches
# trivy's own public DB source and its own cache directory, never
# untrusted external content.
apiVersion: batch/v1
kind: Job
metadata:
  name: scm-trivy-db-cache-primer
  namespace: default
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-4"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: primer
          image: "monitor-api:dev"
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              args=""
              [ -n "${TRIVY_DB_REPOSITORY:-}" ] && args="--db-repository ${TRIVY_DB_REPOSITORY}"
              echo "downloading trivy vulnerability DB into ${TRIVY_CACHE_DIR}"
              trivy image --cache-dir "${TRIVY_CACHE_DIR}" --download-db-only ${args}
              javaargs=""
              [ -n "${TRIVY_JAVA_DB_REPOSITORY:-}" ] && javaargs="--java-db-repository ${TRIVY_JAVA_DB_REPOSITORY}"
              echo "downloading trivy java DB into ${TRIVY_CACHE_DIR}"
              trivy image --cache-dir "${TRIVY_CACHE_DIR}" --download-java-db-only ${javaargs}
              echo "trivy DB cache primed"
          env:
            - name: TRIVY_CACHE_DIR
              value: "/trivy-cache"
            - name: TRIVY_DB_REPOSITORY
              value: ""
            - name: TRIVY_JAVA_DB_REPOSITORY
              value: ""
          volumeMounts:
            - name: trivy-cache
              mountPath: "/trivy-cache"
          resources:
            limits:
              cpu: 500m
              memory: 768Mi
            requests:
              cpu: 100m
              memory: 256Mi
      volumes:
        - name: trivy-cache
          persistentVolumeClaim:
            claimName: scm-trivy-db-cache

---
# Source: supply-chain-monitor/templates/postgres/backup-pvc-primer-job.yaml
# Pairs with scm-postgres-backups' pre-install/pre-upgrade hook
# annotations in pvc.yaml -- see that file's comment for the full "why".
# Short version: this Job's only job is to mount scm-postgres-backups
# and exit immediately, which is enough to make a
# WaitForFirstConsumer-mode StorageClass actually bind the volume,
# before Helm's own readiness wait starts watching for it. Without
# this, the PVC has no real consumer until scm-postgres-backup (the
# CronJob) first fires on its schedule, and Helm/Flux's wait times out
# well before then.
#
# Reuses the postgres image already being pulled for the main
# Deployment/CronJob rather than adding a second image to pull.
# hook-weight -4 (vs. the PVC's -5) guarantees the PVC exists first;
# hook-delete-policy cleans the Job up after each run so re-upgrades
# don't leave a trail of completed Jobs behind.
apiVersion: batch/v1
kind: Job
metadata:
  name: scm-postgres-backups-primer
  namespace: default
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-4"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 120
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: primer
          image: "percona/percona-distribution-postgresql:17.10"
          command: ["sh", "-c", "echo scm-postgres-backups primed && exit 0"]
          volumeMounts:
            - name: backups
              mountPath: /backups
      volumes:
        - name: backups
          persistentVolumeClaim:
            claimName: scm-postgres-backups

