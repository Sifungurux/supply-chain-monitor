apiVersion: apps/v1
kind: Deployment
metadata:
  name: scm-clamav
  namespace: {{ .Release.Namespace }}
  labels:
    app: scm-clamav
spec:
  # Configurable (default 1, see values.yaml's clamav.replicas comment)
  # -- each pod independently freshclams its own virus DB into its own
  # ephemeral storage (no shared PVC here), so scaling this up is just
  # "more independent ClamAV instances behind the same Service", not a
  # coordination problem the way scaling something with shared state
  # would be. scm-clamav's Service (service.yaml) already load-balances
  # across however many pods match this selector, so no other template
  # needs to change for this to take effect.
  replicas: {{ .Values.clamav.replicas }}
  selector:
    matchLabels:
      app: scm-clamav
  template:
    metadata:
      labels:
        app: scm-clamav
    spec:
      # `preferred` (not `required`): on a single-node cluster (colima,
      # the default runtime -- see cluster/create-cluster.sh) this is a
      # no-op and every replica still schedules fine on the one node. On
      # a multi-node cluster (podman/k3d path with SCM_K3D_AGENTS set,
      # see cluster/k3d-config.yaml) it spreads replicas across nodes
      # instead of letting the scheduler stack them all on one, which
      # would defeat the point of testing clamav.replicas under a
      # multi-node cluster in the first place -- see README's "Scaling
      # ClamAV".
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: scm-clamav
      containers:
        - name: clamav
          image: "{{ .Values.clamav.image.repository }}:{{ .Values.clamav.image.tag }}"
          imagePullPolicy: {{ .Values.clamav.image.pullPolicy }}
          ports:
            - containerPort: 3310
          resources:
            {{- toYaml .Values.clamav.resources | nindent 12 }}
          # first boot downloads the virus DB (freshclam) and can take a
          # few minutes -- see values.yaml's readiness/liveness comment.
          readinessProbe:
            tcpSocket:
              port: 3310
            initialDelaySeconds: {{ .Values.clamav.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.clamav.readiness.periodSeconds }}
            failureThreshold: {{ .Values.clamav.readiness.failureThreshold }}
          livenessProbe:
            tcpSocket:
              port: 3310
            initialDelaySeconds: {{ .Values.clamav.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.clamav.liveness.periodSeconds }}
