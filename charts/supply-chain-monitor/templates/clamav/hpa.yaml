{{- if .Values.clamav.autoscaling.enabled }}
# Scales scm-clamav on CPU utilization between min/max replicas -- see
# values.yaml's clamav.autoscaling comments and README's "Scaling
# ClamAV". Requires a metrics-server (metrics.k8s.io) in the target
# cluster to actually act on; without one this object just sits idle,
# same as any HPA with no metrics source.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: scm-clamav
  namespace: {{ .Release.Namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: scm-clamav
  minReplicas: {{ .Values.clamav.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.clamav.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.clamav.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
