# Embeds dashboard/index.html (copied into this chart at
# files/index.html -- Helm's .Files.Get can only read files inside the
# chart directory, not arbitrary repo paths, and .Files paths are always
# relative to the chart root regardless of which templates/ subfolder
# this file itself lives in) verbatim, so the running dashboard always
# matches the source file exactly. `make check-dashboard-configmap`
# catches drift between the two -- see Makefile and docs/architecture.md
# for why this check exists (a real bug shipped once from these silently
# going out of sync).
apiVersion: v1
kind: ConfigMap
metadata:
  name: scm-dashboard-html
  namespace: {{ .Release.Namespace }}
data:
  index.html: |
{{ .Files.Get "files/index.html" | indent 4 }}
---
# Optional override for the dashboard's own API address -- see
# values.yaml's dashboard.apiBase comment.
apiVersion: v1
kind: ConfigMap
metadata:
  name: scm-dashboard-config
  namespace: {{ .Release.Namespace }}
data:
  DASHBOARD_API_BASE: {{ .Values.dashboard.apiBase | quote }}
  DASHBOARD_ALLOW_MANUAL_REGISTRATION: {{ .Values.dashboard.allowManualRegistration | quote }}
  # Whether the proxy admits POST at all (see the nginx limit_except in
  # the Deployment). Published to the page as well as enforced in nginx
  # so the UI can hide controls it is no longer allowed to use -- a
  # button that always 403s is worse than no button.
  DASHBOARD_ALLOW_WRITES: {{ .Values.dashboard.allowWrites | quote }}
  DASHBOARD_SHOW_CONNECTION_SETTINGS: {{ .Values.dashboard.showConnectionSettings | quote }}
