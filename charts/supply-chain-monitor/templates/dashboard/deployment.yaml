apiVersion: apps/v1
kind: Deployment
metadata:
  name: scm-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    app: scm-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scm-dashboard
  template:
    metadata:
      labels:
        app: scm-dashboard
      annotations:
        # Forces a new pod any time the embedded index.html or
        # DASHBOARD_API_BASE changes -- see monitor-api's deployment.yaml
        # for the same pattern and why it's needed, and for why the path
        # below has an explicit "/dashboard/" segment instead of relying
        # on $.Template.BasePath to already include it ($.Template.BasePath
        # is always "<chart>/templates", not the subdirectory of the
        # currently-rendering template).
        checksum/config: {{ include (print $.Template.BasePath "/dashboard/configmap.yaml") . | sha256sum }}
        # This pod reads the API key through secretKeyRef too (see the
        # render-config initContainer below), and env vars are captured
        # once at container start -- so without this, rotating the key
        # left the dashboard presenting the old one until somebody
        # restarted it by hand. Same gap monitor-api's own deployment
        # had.
        checksum/api-key: {{ include (print $.Template.BasePath "/monitor-api/auth-secret.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      # uid 101 is nginx-unprivileged's own "nginx" user. fsGroup so the
      # initContainer can write the rendered index.html/env.js into the
      # shared emptyDir, and nginx can read them back.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
      # The dashboard used to require a person to paste the API key
      # into a browser field by hand -- fine for one person on one
      # laptop, annoying (and easy to get wrong) for anyone else who
      # opens the page. This initContainer renders env.js (a plain
      # `window.SCM_CONFIG = {...}` assignment) from the *same*
      # scm-monitor-api-auth Secret monitor-api itself reads, so the
      # dashboard is pre-configured with a working key with zero manual
      # steps -- see docs/architecture.md ("Configuring the dashboard
      # via ConfigMap/Secret instead of by hand").
      initContainers:
        - name: render-config
          image: "{{ .Values.dashboard.image.repository }}:{{ .Values.dashboard.image.tag }}"
          # initContainers are judged by Pod Security Admission exactly
          # like regular containers -- this one had no securityContext
          # at all and was the only thing (besides clamav, deliberately)
          # keeping this chart off the restricted profile. It writes
          # only into the /html emptyDir, so a read-only rootfs is fine.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              cp /config-src/index.html /html/index.html
              # Escape backslashes and double quotes so an odd API_KEY
              # or DASHBOARD_API_BASE value can't break out of the JS
              # string literal below -- good enough for this project's
              # scope (a local dev cluster), not a substitute for a
              # real templating engine if this ever needs to be
              # hardened further.
              # THE KEY THIS PROXY ATTACHES IS THE DASHBOARD'S, NOT THE
              # MASTER KEY. Every request the proxy forwards carries this
              # credential, and the proxy is reachable by anyone who can
              # reach the dashboard -- so whatever it holds is effectively
              # public to that audience. The master key authenticates as
              # client "default" with unrestricted scope, which made
              # "can load the dashboard" equal to "can delete any
              # artifact" (report S1).
              #
              # DASHBOARD_API_KEY is resolved by the chart from the named
              # "dashboard" client (see the namedKey helper), so
              # monitorApi.apiKeyScopes can limit it -- scopes key off
              # the client name, and a consumer sharing the master key
              # cannot be scoped at all.
              #
              # FAIL CLOSED, rather than proxying with the master key.
              #
              # This used to warn and carry on. A warning on stderr in a
              # pod nobody is tailing is not a control: the deployment
              # came up looking healthy while every anonymous visitor to
              # the dashboard held unrestricted API authority through the
              # proxy -- register, scan, submit findings, upload fleet
              # VEX. Report 2026-09-09, S-1.
              #
              # Refusing to attach ANY credential degrades the dashboard
              # to read-nothing (the API answers 401) instead of
              # silently over-granting. That is loud in the way a
              # warning was not: the page visibly does not work, which
              # is the correct signal for "no dashboard key exists".
              #
              # The fix is one command -- cluster/chart-secrets.sh
              # generates a named "dashboard" client -- and the error
              # below says so.
              if [ "$DASHBOARD_API_KEY" = "$API_KEY" ]; then
                echo "ERROR: no 'dashboard' entry in monitorApi.apiKeys." >&2
                echo "ERROR: refusing to proxy with the MASTER key -- that is unrestricted, and anyone" >&2
                echo "ERROR: who can reach this dashboard would inherit it (register/scan/findings/VEX)." >&2
                echo "ERROR: run cluster/chart-secrets.sh to generate a scoped dashboard key." >&2
                DASHBOARD_API_KEY=""
              fi
              ESCAPED_KEY=$(printf '%s' "$DASHBOARD_API_KEY" | sed 's/\\/\\\\/g; s/"/\\"/g')
              ESCAPED_BASE=$(printf '%s' "$DASHBOARD_API_BASE" | sed 's/\\/\\\\/g; s/"/\\"/g')
              ESCAPED_ALLOW_MANUAL_REG=$(printf '%s' "$DASHBOARD_ALLOW_MANUAL_REGISTRATION" | sed 's/\\/\\\\/g; s/"/\\"/g')
              ESCAPED_SHOW_CONN_SETTINGS=$(printf '%s' "$DASHBOARD_SHOW_CONNECTION_SETTINGS" | sed 's/\\/\\\\/g; s/"/\\"/g')
              ESCAPED_ALLOW_WRITES=$(printf '%s' "$DASHBOARD_ALLOW_WRITES" | sed 's/\\/\\\\/g; s/"/\\"/g')
              # NO apiKey IN env.js. That file is served by nginx to any
              # browser that can reach the dashboard, so writing the key
              # into it published the only credential this API has --
              # full register/scan/delete authority, retrievable with a
              # plain `curl .../env.js` (report S1).
              #
              # The key now lives only in the nginx config below, inside
              # the pod, and is attached server-side to proxied requests.
              printf 'window.SCM_CONFIG = { apiBase: "%s", allowManualRegistration: "%s", showConnectionSettings: "%s", allowWrites: "%s" };\n' "$ESCAPED_BASE" "$ESCAPED_ALLOW_MANUAL_REG" "$ESCAPED_SHOW_CONN_SETTINGS" "$ESCAPED_ALLOW_WRITES" > /html/env.js

              # The dashboard calls /dash-api/... on its own origin; this
              # proxy strips that prefix and adds the Authorization the
              # browser no longer has.
              #
              # /dash-api rather than /api DELIBERATELY: the Gateway
              # already routes /api/ straight to monitor-api for real API
              # clients (templates/gateway/httproute-api.yaml), so a
              # dashboard calling /api/ would bypass this proxy when
              # served through the Gateway and get a 401. A distinct
              # prefix always lands here, on both the Gateway path and
              # the direct NodePort.
              #
              # This replaces the image's default.conf, so the static
              # server block has to be reproduced here too.
              cat > /nginx-conf/default.conf <<NGINX_EOF
              server {
                listen 8080;
                server_name _;
                root /usr/share/nginx/html;
                index index.html;

                location / {
                  try_files \$uri \$uri/ =404;
                }

                location /dash-api/ {
                  # SECOND LOCK, INDEPENDENT OF THE KEY'S SCOPES.
                  # Denying a method here means a mis-scoped or
                  # accidentally-rotated-to-master key still cannot use
                  # it through this proxy -- two independent things have
                  # to be wrong, not one.
                  #
                  # READ-ONLY BY DEFAULT. This proxy attaches a
                  # credential server-side to everything it forwards,
                  # and it is reachable by anyone who can reach the
                  # dashboard -- so every method allowed here is a
                  # method the anonymous visitor has. GET and HEAD are
                  # what a dashboard needs to be a dashboard.
                  #
                  # dashboard.allowWrites re-admits POST for the Scan
                  # and Register buttons. It is a deliberate choice to
                  # make "can load the dashboard" mean "can trigger
                  # work", which is reasonable on a private cluster and
                  # is why the flag exists -- but it should be a
                  # decision, not the default nobody noticed.
                  #
                  # DELETE, PUT and PATCH are never admitted here,
                  # whatever the flag says. Destructive routes are
                  # admin-scoped at the API too (see NewRouter), so this
                  # is the second of two locks on them.
                  #
                  # limit_except lists the methods that are ALLOWED --
                  # everything else falls into the block and is denied.
                  limit_except GET HEAD{{ if .Values.dashboard.allowWrites }} POST{{ end }} {
                    deny all;
                  }
{{- if .Values.monitorApi.tls.enabled }}
                  # HTTPS upstream, VERIFIED against the private CA.
                  # proxy_ssl_verify defaults to off in nginx, which
                  # would encrypt the hop while accepting any
                  # certificate -- that stops a passive reader but not
                  # an active one, and this hop carries the dashboard's
                  # API key. proxy_ssl_name is what makes the SAN match.
                  proxy_pass https://${MONITOR_API_ADDR}/;
                  proxy_ssl_trusted_certificate /ca/scm-ca.crt;
                  proxy_ssl_verify on;
                  proxy_ssl_verify_depth 2;
                  proxy_ssl_name ${MONITOR_API_HOST};
                  proxy_ssl_server_name on;
{{- else }}
                  proxy_pass http://${MONITOR_API_ADDR}/;
{{- end }}
                  # ESCAPED_KEY, not API_KEY. This heredoc is unquoted,
                  # so \${API_KEY} expanded to the MASTER key env var --
                  # on every request, not merely as a fallback when no
                  # dashboard key existed. ESCAPED_KEY (the named
                  # "dashboard" client, escaped for this quoted context)
                  # was computed above and then referenced nowhere, so
                  # the whole named-key-plus-scopes design for the
                  # dashboard was inert: monitorApi.apiKeyScopes could
                  # scope the dashboard client all it liked and the
                  # proxy still presented an unrestricted credential.
                  #
                  # Verified on a live cluster before the fix: the
                  # generated config carried the master key's prefix
                  # while DASHBOARD_API_KEY, correctly populated in the
                  # pod env, went unused.
                  proxy_set_header Authorization "Bearer ${ESCAPED_KEY}";
                  proxy_set_header Host \$host;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_http_version 1.1;
                  # Scan dispatch answers 202 quickly, but document
                  # uploads and large lists can take a while.
                  proxy_read_timeout 120s;
                }
              }
              NGINX_EOF
          env:
            - name: DASHBOARD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: scm-monitor-api-auth
                  key: DASHBOARD_API_KEY
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  # Same Secret templates/monitor-api/auth-secret.yaml
                  # creates -- both live in the same chart/namespace now,
                  # so this cross-service Secret reference works the
                  # same way it did as two separate charts.
                  name: scm-monitor-api-auth
                  key: API_KEY
{{- if .Values.monitorApi.tls.enabled }}
            # Hostname alone, for SNI and SAN matching -- MONITOR_API_ADDR
            # carries the :8080 that proxy_ssl_name must not include.
            - name: MONITOR_API_HOST
              value: {{ printf "monitor-api.%s.svc.cluster.local" .Release.Namespace | quote }}
{{- end }}
            - name: MONITOR_API_ADDR
              value: {{ printf "monitor-api.%s.svc.cluster.local:8080" .Release.Namespace | quote }}
            - name: DASHBOARD_API_BASE
              valueFrom:
                configMapKeyRef:
                  name: scm-dashboard-config
                  key: DASHBOARD_API_BASE
            - name: DASHBOARD_ALLOW_MANUAL_REGISTRATION
              valueFrom:
                configMapKeyRef:
                  name: scm-dashboard-config
                  key: DASHBOARD_ALLOW_MANUAL_REGISTRATION
            - name: DASHBOARD_SHOW_CONNECTION_SETTINGS
              valueFrom:
                configMapKeyRef:
                  name: scm-dashboard-config
                  key: DASHBOARD_SHOW_CONNECTION_SETTINGS
            - name: DASHBOARD_ALLOW_WRITES
              valueFrom:
                configMapKeyRef:
                  name: scm-dashboard-config
                  key: DASHBOARD_ALLOW_WRITES
          volumeMounts:
            - name: dashboard-html
              mountPath: /config-src
              readOnly: true
            - name: html
              mountPath: /html
            - name: nginx-conf
              mountPath: /nginx-conf
      containers:
        - name: nginx
          image: "{{ .Values.dashboard.image.repository }}:{{ .Values.dashboard.image.tag }}"
          ports:
            # 8080, not 80: a non-root process cannot bind a privileged
            # port, which is the whole reason this image exists. The
            # Service keeps port 80 externally and targets 8080 here.
            - containerPort: 8080
          volumeMounts:
            # Serves the initContainer's rendered output (index.html +
            # env.js), not the ConfigMap directly -- nginx never sees
            # the Secret itself, only what render-config already wrote
            # into this emptyDir.
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
{{- if .Values.monitorApi.tls.enabled }}
            # The private CA nginx verifies the upstream against
            # (proxy_ssl_trusted_certificate). Without it
            # proxy_ssl_verify on refuses every request rather than
            # falling back to unverified -- which is the correct
            # direction to fail.
            - name: api-ca
              mountPath: /ca
              readOnly: true
{{- end }}
            # readOnlyRootFilesystem needs these two: nginx writes its
            # pid and client-body temp files under /tmp, and proxy/fastcgi
            # caches under /var/cache/nginx. Without them the container
            # starts and then fails on the first request rather than at
            # boot, which is a worse failure to diagnose.
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: nginx-tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 2
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
          resources:
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
{{- if .Values.monitorApi.tls.enabled }}
        - name: api-ca
          secret:
            secretName: scm-ca-tls
            items:
              - key: ca.crt
                path: scm-ca.crt
{{- end }}
        - name: dashboard-html
          configMap:
            name: scm-dashboard-html
        - name: html
          emptyDir: {}
        - name: nginx-conf
          emptyDir: {}
        - name: nginx-tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
