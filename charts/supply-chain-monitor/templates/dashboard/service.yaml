apiVersion: v1
kind: Service
metadata:
  name: scm-dashboard
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: scm-dashboard
  ports:
    - name: http
      port: 80
      # 8080: the dashboard runs nginx-unprivileged, which cannot bind
      # port 80. The Service's own port stays 80, so nothing referring to
      # this Service by port needs to change.
      targetPort: 8080
      nodePort: {{ .Values.dashboard.service.nodePort }}
  type: NodePort
