# docker_auth's full config.yml -- a Secret (not a ConfigMap) since it
# embeds the three accounts' bcrypt password hashes, credential material
# even though not reversible in practice. Re-rendered on every `helm
# upgrade` (Sprig's `bcrypt` embeds a fresh random salt each call, so this
# Secret's content changes even when the underlying cleartext password in
# values.yaml doesn't) -- harmless, since a fresh bcrypt hash of the same
# plaintext still authenticates that same plaintext identically. Unlike
# signing-cert-secret.yaml, there's nothing here that needs to survive
# unchanged across upgrades.
apiVersion: v1
kind: Secret
metadata:
  name: scm-docker-auth-config
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  config.yml: |
    server:
      addr: ":{{ .Values.dockerAuth.service.port }}"
      # No certificate/key here on purpose -- leaving both unset means
      # this listener serves plain HTTP, not TLS. Every registry-facing
      # tool in this project already runs plain-HTTP by convention
      # (oras --plain-http, unpacker --insecure), and the Docker
      # Registry Token Authentication spec's realm endpoint doesn't
      # require HTTPS -- the one unavoidable TLS-shaped piece is the JWT
      # *signing* keypair below, which is inherent to the spec itself,
      # not a transport-security requirement.

    token:
      issuer: {{ .Values.dockerAuth.tokenIssuer | quote }}
      expiration: {{ .Values.dockerAuth.tokenExpirationSeconds }}
      # Explicit signing keypair, since server.certificate/key are
      # unset above (docker_auth falls back to signing with the
      # server's own TLS cert/key when this is omitted -- there isn't
      # one here). Mounted from signing-cert-secret.yaml, the same
      # keypair registry/deployment.yaml trusts via
      # REGISTRY_AUTH_TOKEN_ROOTCERTBUNDLE.
      certificate: "/certs/tls.crt"
      key: "/certs/tls.key"
      disable_legacy_key_id: {{ .Values.dockerAuth.disableLegacyKeyId }}

    users:
      {{ .Values.dockerAuth.accounts.reader.username | quote }}:
        password: {{ .Values.dockerAuth.accounts.reader.password | bcrypt | quote }}
      {{ .Values.dockerAuth.accounts.writer.username | quote }}:
        password: {{ .Values.dockerAuth.accounts.writer.password | bcrypt | quote }}
      {{ .Values.dockerAuth.accounts.admin.username | quote }}:
        password: {{ .Values.dockerAuth.accounts.admin.password | bcrypt | quote }}

    acl:
      - match: {account: {{ .Values.dockerAuth.accounts.reader.username | quote }}}
        actions: ["pull"]
        comment: "Read-only access to every repository."
      - match: {account: {{ .Values.dockerAuth.accounts.writer.username | quote }}}
        actions: ["pull", "push"]
        comment: "Read-write access to every repository."
      - match: {account: {{ .Values.dockerAuth.accounts.admin.username | quote }}}
        actions: ["*"]
        comment: "Unrestricted access, including delete."
      # Access is denied by default -- no catch-all rule below this one.
