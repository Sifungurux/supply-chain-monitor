{{- if not .Values.dockerAuth.existingSecret }}
# docker_auth's full config.yml -- a Secret (not a ConfigMap) since it
# embeds the accounts' bcrypt password hashes, credential material
# even though not reversible in practice.
#
# ACCOUNTS WITH NO PASSWORD ARE OMITTED ENTIRELY, both from `users` and
# from the ACL. That is the whole safety property of this file now that
# values.yaml ships no passwords: Sprig's `bcrypt` hashes an empty
# string perfectly happily, and the result is a valid hash that
# authenticates an EMPTY PASSWORD -- so rendering an account whose
# password was left unset would not fail closed, it would publish an
# account anyone can log into. An account docker_auth has never heard
# of simply cannot authenticate, which is the behaviour an unset
# credential should have.
#
# dockerAuth.existingSecret: true skips this Secret entirely and expects
# you to have created one under this same name yourself -- same
# convention as postgres.credentials.existingSecret (templates/postgres/
# secret.yaml). Re-rendered on every `helm
# upgrade` (Sprig's `bcrypt` embeds a fresh random salt each call, so this
# Secret's content changes even when the underlying cleartext password in
# values.yaml doesn't) -- harmless, since a fresh bcrypt hash of the same
# plaintext still authenticates that same plaintext identically. Unlike
# signing-cert-secret.yaml, there's nothing here that needs to survive
# unchanged across upgrades.
apiVersion: v1
kind: Secret
metadata:
  name: scm-docker-auth-config
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  config.yml: |
    server:
      addr: ":{{ .Values.dockerAuth.service.port }}"
{{- if .Values.registry.tls.enabled }}
      # TLS on the token endpoint, matching the registry. A client that
      # gets a 401 is redirected here to exchange credentials for a
      # bearer token -- serving that over plain HTTP would put the
      # credentials, and the token they buy, on the wire in cleartext
      # while the registry itself was encrypted. The realm URL the
      # registry advertises switches scheme with this same flag (see
      # templates/registry/deployment.yaml).
      #
      # Separate keypair from the JWT *signing* one below: this one
      # secures the transport and is rotated by cert-manager, that one
      # is the token's identity and must survive upgrades untouched.
      certificate: "/tls/tls.crt"
      key: "/tls/tls.key"
{{- else }}
      # No certificate/key -- leaving both unset serves plain HTTP. The
      # Docker Registry Token Authentication spec's realm endpoint does
      # not require HTTPS; set registry.tls.enabled to encrypt it.
{{- end }}

    token:
      issuer: {{ .Values.dockerAuth.tokenIssuer | quote }}
      expiration: {{ .Values.dockerAuth.tokenExpirationSeconds }}
      # Explicit signing keypair, since server.certificate/key are
      # unset above (docker_auth falls back to signing with the
      # server's own TLS cert/key when this is omitted -- there isn't
      # one here). Mounted from signing-cert-secret.yaml, the same
      # keypair registry/deployment.yaml trusts via
      # REGISTRY_AUTH_TOKEN_ROOTCERTBUNDLE.
      certificate: "/certs/tls.crt"
      key: "/certs/tls.key"
      disable_legacy_key_id: {{ .Values.dockerAuth.disableLegacyKeyId }}

    # Only accounts that actually have a password -- see the header.
    {{- $configured := list }}
    {{- range $role := list "reader" "writer" "admin" }}
      {{- $account := index $.Values.dockerAuth.accounts $role }}
      {{- if $account.password }}
        {{- $configured = append $configured (dict "account" $account "role" $role) }}
      {{- end }}
    {{- end }}
    users:{{ if not $configured }} {}{{ end }}
    {{- range $entry := $configured }}
      {{ $entry.account.username | quote }}:
        password: {{ $entry.account.password | bcrypt | quote }}
    {{- end }}

    # One rule per configured account. An ACL entry naming an account
    # that does not exist would never match, but leaving them in would
    # advertise access that cannot be obtained -- which reads as a bug
    # when someone later cannot log in as it.
    acl:{{ if not $configured }} []{{ end }}
    {{- range $entry := $configured }}
      {{- if eq $entry.role "reader" }}
      - match: {account: {{ $entry.account.username | quote }}}
        actions: ["pull"]
        comment: "Read-only access to every repository."
      {{- else if eq $entry.role "writer" }}
      - match: {account: {{ $entry.account.username | quote }}}
        actions: ["pull", "push"]
        comment: "Read-write access to every repository."
      {{- else }}
      - match: {account: {{ $entry.account.username | quote }}}
        actions: ["*"]
        comment: "Unrestricted access, including delete."
      {{- end }}
    {{- end }}
      # Access is denied by default -- no catch-all rule below this one.
{{- end }}
