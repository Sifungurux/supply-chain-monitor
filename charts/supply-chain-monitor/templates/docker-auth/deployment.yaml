apiVersion: apps/v1
kind: Deployment
metadata:
  name: scm-docker-auth
  namespace: {{ .Release.Namespace }}
  labels:
    app: scm-docker-auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scm-docker-auth
  template:
    metadata:
      labels:
        app: scm-docker-auth
      annotations:
        # Same reasoning as monitor-api/deployment.yaml's identical
        # checksum/config annotation: forces a new pod any time either
        # mounted Secret's rendered content changes, since neither the
        # image tag nor the Deployment spec itself changes when only a
        # values.yaml account/ACL edit does.
        checksum/config: {{ include (print $.Template.BasePath "/docker-auth/config-secret.yaml") . | sha256sum }}
        checksum/signing-cert: {{ include (print $.Template.BasePath "/docker-auth/signing-cert-secret.yaml") . | sha256sum }}
    spec:
      # Non-root: docker_auth reads its config and certs from two
      # Secrets and writes nothing, so it needs no writable path at all.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
      containers:
        - name: docker-auth
          image: "{{ .Values.dockerAuth.image.repository }}:{{ .Values.dockerAuth.image.tag }}"
          imagePullPolicy: {{ .Values.dockerAuth.image.pullPolicy }}
          args:
            - /config/config.yml
          ports:
            - containerPort: {{ .Values.dockerAuth.service.port }}
          volumeMounts:
            # readOnlyRootFilesystem needs a writable /tmp: docker_auth
            # logs via glog, which creates files under /tmp at startup
            # and exits(2) if it cannot ("cannot create log: ...
            # read-only file system"). Verified by watching it
            # CrashLoopBackOff without this -- the same trap monitor-api
            # hit with its docker config.
            - name: scratch
              mountPath: /tmp
            - name: config
              mountPath: /config
              readOnly: true
            - name: signing-cert
              mountPath: /certs
              readOnly: true
{{- if .Values.registry.tls.enabled }}
            - name: tls
              mountPath: /tls
              readOnly: true
{{- end }}
          readinessProbe:
            tcpSocket:
              port: {{ .Values.dockerAuth.service.port }}
            initialDelaySeconds: 3
          livenessProbe:
            tcpSocket:
              port: {{ .Values.dockerAuth.service.port }}
            initialDelaySeconds: 5
          resources:
            {{- toYaml .Values.dockerAuth.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: scratch
          emptyDir: {}
        - name: config
          secret:
            secretName: scm-docker-auth-config
{{- if .Values.registry.tls.enabled }}
        - name: tls
          secret:
            secretName: scm-docker-auth-tls
{{- end }}
        - name: signing-cert
          secret:
            secretName: scm-docker-auth-signing
