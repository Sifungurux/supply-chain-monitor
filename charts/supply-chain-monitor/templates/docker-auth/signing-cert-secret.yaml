# The JWT signing keypair docker_auth uses to sign tokens (token.certificate/
# token.key in config-secret.yaml) and the registry trusts via
# REGISTRY_AUTH_TOKEN_ROOTCERTBUNDLE (registry/deployment.yaml, wired in
# once auth is enabled). Deliberately its own Secret, separate from
# config-secret.yaml: this one needs to survive `helm upgrade` unchanged
# (see the `lookup` guard below), the config document doesn't.
#
# genSelfSignedCert would otherwise generate a BRAND NEW keypair on every
# single `helm template`/`helm upgrade` render (Helm re-evaluates the whole
# template tree every time, with no built-in "keep what's already there"
# behavior) -- silently invalidating every token docker_auth has already
# issued and instantly 401ing any pull/push mid-flight the moment the new
# registry config picks up the new rootcertbundle. `lookup` checks whether
# this exact Secret already exists in the cluster and reuses its data
# verbatim if so, only generating a fresh keypair the first time (or after
# an explicit `kubectl delete secret` / `helm uninstall`). Standard Helm
# idiom for exactly this "stable self-signed cert across upgrades" problem
# (the same one webhook-TLS charts hit).
#
# `lookup` returns an empty map (not an error) against `helm template`
# --dry-run or a not-yet-existing cluster/namespace, in which case this
# always takes the "generate fresh" branch -- safe for CI/local rendering
# that never has a real API server to query.
{{- $secretName := "scm-docker-auth-signing" -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
{{- if $existing }}
  tls.crt: {{ index $existing.data "tls.crt" }}
  tls.key: {{ index $existing.data "tls.key" }}
{{- else }}
  {{- $cert := genSelfSignedCert .Values.dockerAuth.tokenIssuer nil nil 3650 }}
  tls.crt: {{ $cert.Cert | b64enc }}
  tls.key: {{ $cert.Key | b64enc }}
{{- end }}
