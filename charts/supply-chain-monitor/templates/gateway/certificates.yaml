{{- $caNeeded := or .Values.gateway.tls.enabled .Values.registry.tls.enabled }}
{{- if $caNeeded }}
# TLS for the Gateway, issued by cert-manager
# (k8s/releases/cert-manager-helmrelease.yaml).
#
# THREE OBJECTS, NOT ONE, and the shape is the point. The naive version
# is a single self-signed leaf certificate, which means every client has
# to trust that exact certificate, and trust it again the moment it is
# reissued or a second hostname is added. Instead:
#
#   selfSigned Issuer  ->  CA Certificate  ->  CA Issuer  ->  leaf cert
#
# so there is ONE certificate to trust (the CA), it stays stable across
# every reissue of the leaf, and any further certificate this cluster
# needs is already trusted by anyone who trusted the CA once.
#
# This is a private CA: browsers warn until it is trusted, and it is not
# a substitute for a real certificate on anything public. It is the
# honest option for a cluster with no public DNS name and no reachable
# ACME endpoint -- which is why an ACME/Let's Encrypt issuer is not
# offered here rather than being configured and silently failing.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: scm-selfsigned
  namespace: {{ .Release.Namespace }}
spec:
  selfSigned: {}
---
# The CA itself. isCA plus a long duration deliberately: this is the
# certificate a human trusts once in a browser or an OS trust store, and
# re-trusting it every 90 days would be user-hostile for zero security
# benefit in a private cluster. The LEAF below rotates on cert-manager's
# normal schedule; this does not.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: scm-ca
  namespace: {{ .Release.Namespace }}
spec:
  isCA: true
  commonName: supply-chain-monitor local CA
  secretName: scm-ca-tls
  duration: {{ .Values.gateway.tls.caDuration | quote }}
  renewBefore: {{ .Values.gateway.tls.caRenewBefore | quote }}
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: scm-selfsigned
    kind: Issuer
    group: cert-manager.io
---
# Issues leaf certificates FROM the CA above.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: scm-ca-issuer
  namespace: {{ .Release.Namespace }}
spec:
  ca:
    secretName: scm-ca-tls
---
{{- end }}
{{- if .Values.gateway.tls.enabled }}
---
# The Gateway's own certificate. Referenced by gateway.yaml's https
# listener via certificateRefs -- the listener names this Secret, and
# cert-manager keeps it populated and renewed.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: scm-gateway-tls
  namespace: {{ .Release.Namespace }}
spec:
  secretName: scm-gateway-tls
  duration: {{ .Values.gateway.tls.duration | quote }}
  renewBefore: {{ .Values.gateway.tls.renewBefore | quote }}
  privateKey:
    algorithm: ECDSA
    size: 256
    # Rotate the key on every renewal rather than reusing it. A renewed
    # certificate over the same key is a weaker guarantee than a genuinely
    # new one, and nothing here pins the key.
    rotationPolicy: Always
  dnsNames:
    {{- range .Values.gateway.tls.dnsNames }}
    - {{ . | quote }}
    {{- end }}
  issuerRef:
    name: scm-ca-issuer
    kind: Issuer
    group: cert-manager.io
{{- end }}
{{- if .Values.registry.tls.enabled }}
---
# scm-registry's serving certificate.
#
# THE SAN LIST IS LOAD-BEARING. monitor-api addresses the registry by
# its FULL cluster FQDN (REGISTRY_ADDR in
# templates/monitor-api/configmap.yaml renders
# "<svc>.<ns>.svc.cluster.local:<port>"), so a certificate carrying only
# the short name would fail hostname verification for every in-cluster
# client -- and TLS name mismatches surface as an opaque handshake error,
# not as anything naming the certificate. All three forms are listed
# because all three are used somewhere.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: scm-registry-tls
  namespace: {{ .Release.Namespace }}
spec:
  secretName: scm-registry-tls
  duration: {{ .Values.gateway.tls.duration | quote }}
  renewBefore: {{ .Values.gateway.tls.renewBefore | quote }}
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  dnsNames:
    - {{ .Values.monitorApi.registry.service | quote }}
    - {{ printf "%s.%s.svc" .Values.monitorApi.registry.service .Release.Namespace | quote }}
    - {{ printf "%s.%s.svc.cluster.local" .Values.monitorApi.registry.service .Release.Namespace | quote }}
  issuerRef:
    name: scm-ca-issuer
    kind: Issuer
    group: cert-manager.io
---
# scm-docker-auth's token endpoint. Same reasoning: a client that gets a
# 401 from the registry is redirected to this realm and must complete a
# TLS handshake against it, so it needs a name the client actually used.
#
# Note the registry itself does NOT call this service -- token auth is
# client-side (fetch token here, present it there), and the registry
# only verifies the JWT signature against its rootcertbundle. So no
# registry-to-docker-auth trust is required by this change.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: scm-docker-auth-tls
  namespace: {{ .Release.Namespace }}
spec:
  secretName: scm-docker-auth-tls
  duration: {{ .Values.gateway.tls.duration | quote }}
  renewBefore: {{ .Values.gateway.tls.renewBefore | quote }}
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  dnsNames:
    - "scm-docker-auth"
    - {{ printf "scm-docker-auth.%s.svc" .Release.Namespace | quote }}
    - {{ printf "scm-docker-auth.%s.svc.cluster.local" .Release.Namespace | quote }}
  issuerRef:
    name: scm-ca-issuer
    kind: Issuer
    group: cert-manager.io
{{- end }}
