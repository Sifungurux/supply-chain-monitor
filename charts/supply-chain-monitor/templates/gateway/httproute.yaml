# Routes everything through scm-gateway (see gateway.yaml) to the
# dashboard's own Service (templates/dashboard/service.yaml) -- no
# hostname restriction, so this matches on any Host header, reachable at
# whatever address/port Traefik itself is exposed on (NodePort 30080 --
# see k8s/releases/traefik-helmrelease.yaml). The dashboard's existing
# direct NodePort (30301) still works unchanged; this is an additional
# path in, not a replacement.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: scm-dashboard
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
{{- if not (and .Values.gateway.tls.enabled .Values.gateway.tls.redirectHTTP) }}
    # Only serves the dashboard over plain HTTP when it is NOT being
    # redirected. With the redirect on, the http listener gets the
    # redirect route below instead -- attaching both here would mean two
    # routes matching the same path on the same listener, and which one
    # wins is not something to leave to tie-breaking rules.
    - name: scm-gateway
      sectionName: http
{{- end }}
{{- if .Values.gateway.tls.enabled }}
    # ATTACHES TO THE https LISTENER TOO, and it has to be said
    # explicitly. sectionName pins a route to ONE named listener, so the
    # http entry above does not cover https -- the TLS handshake
    # completes, Traefik finds no route attached to that listener, and
    # every HTTPS request returns 404 from its default handler.
    #
    # That is the same silent-404 failure mode gateway.yaml documents
    # for the listener port, arriving by a different road: nothing
    # errors, the Gateway reports both listeners programmed, both
    # Certificates report Ready, and the chart looks entirely healthy.
    # Caught only by actually completing a request over HTTPS.
    - name: scm-gateway
      sectionName: https
{{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: scm-dashboard
          port: 80
{{- if and .Values.gateway.tls.enabled .Values.gateway.tls.redirectHTTP }}
---
# Sends plain HTTP to HTTPS, so a bearer token cannot be handed over an
# unencrypted connection just because someone typed the wrong scheme.
#
# THE PORT HERE IS THE EXTERNAL ONE, and that is the exact opposite of
# the listener's rule -- which is why it is stated twice rather than
# left to be inferred. A listener port names Traefik's INTERNAL
# EntryPoint (8443), because Traefik is wiring its own plumbing. This
# port goes into a Location header that a BROWSER dials, so it must be
# the address a client can actually reach (NodePort 30443). Using 8443
# here would redirect every visitor to a port nothing listens on, and
# using 30443 on the listener programs no route at all. Same two
# numbers, opposite places, and both failures are silent.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: scm-https-redirect
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: scm-gateway
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            port: {{ .Values.gateway.tls.redirectPort }}
            # 308, not 301: 308 is the permanent redirect that REQUIRES
            # the method and body to be preserved. A 301 lets a client
            # turn a POST into a GET, which would silently drop the body
            # of any write that arrived over http.
            statusCode: 308
{{- end }}
