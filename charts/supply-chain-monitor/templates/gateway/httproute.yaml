# Routes everything through scm-gateway (see gateway.yaml) to the
# dashboard's own Service (templates/dashboard/service.yaml) -- no
# hostname restriction, so this matches on any Host header, reachable at
# whatever address/port Traefik itself is exposed on (NodePort 30080 --
# see k8s/releases/traefik-helmrelease.yaml). The dashboard's existing
# direct NodePort (30301) still works unchanged; this is an additional
# path in, not a replacement.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: scm-dashboard
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: scm-gateway
      sectionName: http
{{- if .Values.gateway.tls.enabled }}
    # ATTACHES TO THE https LISTENER TOO, and it has to be said
    # explicitly. sectionName pins a route to ONE named listener, so the
    # http entry above does not cover https -- the TLS handshake
    # completes, Traefik finds no route attached to that listener, and
    # every HTTPS request returns 404 from its default handler.
    #
    # That is the same silent-404 failure mode gateway.yaml documents
    # for the listener port, arriving by a different road: nothing
    # errors, the Gateway reports both listeners programmed, both
    # Certificates report Ready, and the chart looks entirely healthy.
    # Caught only by actually completing a request over HTTPS.
    - name: scm-gateway
      sectionName: https
{{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: scm-dashboard
          port: 80
