{{- if not .Values.monitorApi.apiKeyExistingSecret }}
# Dev-only API key for monitor-api's shared-key auth -- see
# values.yaml's monitorApi.apiKey comment. Set
# monitorApi.apiKeyExistingSecret: true instead of overriding apiKey
# once a real key is involved -- see README's "Bringing your own
# secrets". scm-monitor-api-auth is also the exact name that flag
# expects you to have already created yourself.
apiVersion: v1
kind: Secret
metadata:
  name: scm-monitor-api-auth
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  API_KEY: {{ .Values.monitorApi.apiKey | quote }}
  # Named keys, flattened to the "name:key,name:key" form the binary
  # parses (internal/api.ParseAPIKeys). Accepting a map here as well as
  # the flat string is what lets valuesFrom inject one opaque Secret
  # value while values.yaml can still be edited as readable YAML.
  API_KEYS: {{ include "supply-chain-monitor.apiKeys" . | quote }}
{{- end }}
