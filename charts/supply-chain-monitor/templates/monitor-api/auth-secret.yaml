{{- if not .Values.monitorApi.apiKeyExistingSecret }}
# Dev-only API key for monitor-api's shared-key auth -- see
# values.yaml's monitorApi.apiKey comment. Set
# monitorApi.apiKeyExistingSecret: true instead of overriding apiKey
# once a real key is involved -- see README's "Bringing your own
# secrets". scm-monitor-api-auth is also the exact name that flag
# expects you to have already created yourself.
#
# Only CREDENTIALS live here. What each key is permitted to do
# (monitorApi.apiKeyScopes, report H1) is rendered into the monitor-api
# ConfigMap instead: scopes are not secret, and this Secret carries a
# checksum/api-key annotation, so keeping them here would roll
# monitor-api as though a credential had rotated every time somebody
# adjusted a permission.
apiVersion: v1
kind: Secret
metadata:
  name: scm-monitor-api-auth
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  API_KEY: {{ .Values.monitorApi.apiKey | quote }}
  # Named keys, flattened to the "name:key,name:key" form the binary
  # parses (internal/api.ParseAPIKeys). Accepting a map here as well as
  # the flat string is what lets valuesFrom inject one opaque Secret
  # value while values.yaml can still be edited as readable YAML.
  API_KEYS: {{ include "supply-chain-monitor.apiKeys" . | quote }}
  # Per-consumer keys, resolved from API_KEYS above with a master-key
  # fallback (see the namedKey helper). Rendered as their own Secret
  # entries because the consumers that need them -- the sweep CronJobs
  # -- take their credential from a secretKeyRef with no shell to parse
  # the combined value, and because a consumer referencing exactly one
  # key cannot accidentally read another's.
  DASHBOARD_API_KEY: {{ include "supply-chain-monitor.namedKey" (dict "ctx" . "name" "dashboard") | quote }}
  SWEEP_API_KEY: {{ include "supply-chain-monitor.namedKey" (dict "ctx" . "name" "sweep") | quote }}
{{- end }}
