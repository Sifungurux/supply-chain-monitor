apiVersion: v1
kind: ConfigMap
metadata:
  name: monitor-api-config
  namespace: {{ .Release.Namespace }}
data:
  LISTEN_ADDR: {{ .Values.monitorApi.listenAddr | quote }}
  PIPELINE_STAGES: {{ .Values.monitorApi.pipelineStages | quote }}
  CLAMAV_ADDR: {{ printf "%s.%s.svc.cluster.local:%s" .Values.monitorApi.clamav.service .Release.Namespace .Values.monitorApi.clamav.port | quote }}
  REGISTRY_ADDR: {{ printf "%s.%s.svc.cluster.local:%s" .Values.monitorApi.registry.service .Release.Namespace .Values.monitorApi.registry.port | quote }}
  # Postgres holds every artifact/finding/stage-history record -- see
  # docs/architecture.md for why the in-memory store was replaced.
  # POSTGRES_PASSWORD is deliberately absent here: it comes from the
  # scm-postgres-credentials Secret (templates/postgres/secret.yaml) via
  # this chart's monitor-api/deployment.yaml secretKeyRef, not this
  # plaintext ConfigMap.
  POSTGRES_HOST: {{ printf "%s.%s.svc.cluster.local" .Values.monitorApi.postgres.service .Release.Namespace | quote }}
  POSTGRES_PORT: {{ .Values.monitorApi.postgres.port | quote }}
  POSTGRES_USER: {{ .Values.monitorApi.postgres.user | quote }}
  POSTGRES_DB: {{ .Values.monitorApi.postgres.db | quote }}
  POSTGRES_SSLMODE: {{ .Values.monitorApi.postgres.sslmode | quote }}
  # pgxpool connection pool sizing -- see main.go's buildPostgresDSN and
  # values.yaml's monitorApi.postgres.pool comment for why these aren't
  # just left at pgxpool's own CPU-derived default.
  POSTGRES_POOL_MAX_CONNS: {{ .Values.monitorApi.postgres.pool.maxConns | quote }}
  POSTGRES_POOL_MIN_CONNS: {{ .Values.monitorApi.postgres.pool.minConns | quote }}
  # unpacker (github.com/Sifungurux/unpacker) pull settings, used to
  # unpack image artifacts before ClamAV scans their contents.
  # monitor-api itself never runs unpacker directly -- these are
  # forwarded into the env of each per-scan Kubernetes Job it creates
  # (see internal/scanner/isolated_unpacker.go and docs/architecture.md,
  # "Isolating the unpack+scan step").
  UNPACKER_INSECURE: {{ .Values.monitorApi.unpacker.insecure | quote }}
  UNPACKER_PUBLIC: {{ .Values.monitorApi.unpacker.public | quote }}
  UNPACKER_MAX_FILE_MB: {{ .Values.monitorApi.unpacker.maxFileMB | quote }}
  # Almost always the same image monitor-api itself runs from, since
  # `monitor-api scan-worker` is the same binary in a different mode --
  # defaults to monitorApi.image.repository:monitorApi.image.tag unless
  # scanWorkerImage is explicitly overridden.
  SCAN_WORKER_IMAGE: {{ (.Values.monitorApi.scanWorkerImage | default (printf "%s:%s" .Values.monitorApi.image.repository .Values.monitorApi.image.tag)) | quote }}
  # Left false here -- this is the real in-cluster deployment, which
  # does have the ServiceAccount token isolation needs (see
  # serviceaccount.yaml). true is only ever meant for running the
  # monitor-api binary standalone outside Kubernetes -- see README,
  # "Running monitor-api outside a Kubernetes pod".
  DISABLE_SCAN_ISOLATION: {{ .Values.monitorApi.disableScanIsolation | quote }}
  # Off by default -- see monitorApi.scanWorker.verboseLogs's own
  # comment in values.yaml. Read here by runAPIServer, which both sets
  # scanner.VerboseScanLogs directly for the in-process fallback path
  # (DISABLE_SCAN_ISOLATION=true) and forwards it into every isolated
  # scanner's Job as that Job's own SCM_SCAN_VERBOSE (see
  # internal/scanner/isolated_trivy.go/isolated_unpacker.go).
  SCAN_WORKER_VERBOSE_LOGS: {{ .Values.monitorApi.scanWorker.verboseLogs | quote }}
  # How long Kubernetes lets a scan-worker Job's pod run, and how long
  # the API handler itself waits for one to finish -- see
  # monitorApi.scanWorker.activeDeadlineSeconds/monitorApi.scanTimeoutSeconds's
  # own comments in values.yaml for why the second must stay above the
  # first. main.go's runAPIServer validates that relationship at startup.
  SCAN_WORKER_ACTIVE_DEADLINE_SECONDS: {{ .Values.monitorApi.scanWorker.activeDeadlineSeconds | quote }}
  SCAN_TIMEOUT_SECONDS: {{ .Values.monitorApi.scanTimeoutSeconds | quote }}
  # Server-side cap on concurrent scans -- the bound that keeps N
  # simultaneous scan-worker Jobs from exhausting a node's disk between
  # them. See monitorApi.scanConcurrency's own comment in values.yaml.
  SCAN_CONCURRENCY: {{ .Values.monitorApi.scanConcurrency | quote }}
  # Outbound scan notifications -- see monitorApi.notifications in
  # values.yaml. Only the non-secret settings live here; the HMAC secret
  # and the Slack URL come from the scm-monitor-api-notify Secret (see
  # notify-secret.yaml for why the Slack URL counts as a credential).
  NOTIFY_WEBHOOK_URL: {{ .Values.monitorApi.notifications.webhookURL | quote }}
  NOTIFY_MIN_SEVERITY: {{ .Values.monitorApi.notifications.minSeverity | quote }}
  # file/sbom/sarif artifacts can be registered with an OCI registry
  # reference instead of a path already inside this pod -- oras pull
  # fetches them from scm-registry first (see internal/scanner/fetch.go).
  FETCH_PLAIN_HTTP: {{ .Values.monitorApi.fetchPlainHTTP | quote }}
  # Makes expected_digest required on every registration and turns a
  # mismatch into Artifact.Unsafe = true instead of a 409 refusal -- see
  # this value's own comment above and NewRouter's in internal/api/router.go.
  REQUIRE_DIGEST: {{ .Values.monitorApi.requireDigest | quote }}
  # The shared, centrally-refreshed vulnerability-DB cache
  # IsolatedTrivyScanner mounts read-only into each trivy scan-worker
  # Job -- see trivy-db-cache-pvc.yaml/trivy-db-cache-primer-job.yaml/
  # trivy-db-refresh-cronjob.yaml and docs/architecture.md ("Isolating
  # Trivy scanning"). Independent of TRIVY_DB_REPOSITORY below (that's
  # about *where* trivy pulls a DB from; this is about *where on disk*
  # the isolated worker looks for the one already pulled).
  TRIVY_CACHE_CLAIM: {{ .Values.monitorApi.trivyCache.pvcName | quote }}
  TRIVY_CACHE_DIR: {{ .Values.monitorApi.trivyCache.mountPath | quote }}
  # grype's counterpart to the pair above -- see
  # grype-db-cache-pvc.yaml/grype-db-cache-primer-job.yaml/
  # grype-db-refresh-cronjob.yaml. Always set (not conditional on
  # cveScanner) so switching cveScanner from "trivy" to "grype"/"both"
  # on an existing deployment doesn't also require a chart change to
  # pick these up.
  GRYPE_CACHE_CLAIM: {{ .Values.monitorApi.grypeCache.pvcName | quote }}
  GRYPE_CACHE_DIR: {{ .Values.monitorApi.grypeCache.mountPath | quote }}
  # Selects which CVE scanner(s) run for image/sbom artifacts -- see
  # values.yaml's monitorApi.cveScanner comment and main.go's
  # runAPIServer.
  CVE_SCANNER: {{ .Values.monitorApi.cveScanner | quote }}
  # Lets an "image"-mode scan-worker Job upload a generated SBOM/SARIF
  # document back to this Service -- see monitorApi.scanWorker.apiBaseURL's
  # own comment in values.yaml.
  SCAN_WORKER_API_BASE_URL: {{ .Values.monitorApi.scanWorker.apiBaseURL | quote }}
  {{- if .Values.monitorApi.trivyDB.enabled }}
  # air-gapped operation -- see cluster/seed-trivy-db.sh and README's
  # "Air-gapped operation".
  TRIVY_DB_REPOSITORY: {{ .Values.monitorApi.trivyDB.repository | quote }}
  TRIVY_JAVA_DB_REPOSITORY: {{ .Values.monitorApi.trivyDB.javaRepository | quote }}
  TRIVY_SKIP_DB_UPDATE: {{ .Values.monitorApi.trivyDB.skipUpdate | quote }}
  TRIVY_SKIP_JAVA_DB_UPDATE: {{ .Values.monitorApi.trivyDB.skipJavaUpdate | quote }}
  {{- end }}
  # Operator-configured pluggable scanners (a different CVE scanner than
  # trivy, a different SBOM tool, ...) -- see
  # internal/scanner/pluggable.go, docs/architecture.md ("Pluggable
  # scanners"), and this value's own comment in values.yaml.
  # `toJson` on an empty list renders "[]", which main.go's
  # getenv("PLUGGABLE_SCANNERS", "") treats as present-but-empty -- fine,
  # since an empty JSON array unmarshals to zero specs either way; this
  # key is always set (unlike the TRIVY_DB_REPOSITORY block above,
  # which is conditional) so removing an entry from
  # monitorApi.pluggableScanners actually clears it on the next upgrade
  # instead of leaving a stale ConfigMap key around.
  PLUGGABLE_SCANNERS: {{ .Values.monitorApi.pluggableScanners | toJson | quote }}
  # Per-key request rate limiting -- see internal/api/ratelimit.go and
  # values.yaml's monitorApi.rateLimit comment. requestsPerSecond <= 0
  # (the default) disables it. Always set (not conditional) so turning
  # it off again from a nonzero value actually clears/updates the
  # ConfigMap key on the next upgrade.
  RATE_LIMIT_RPS: {{ .Values.monitorApi.rateLimit.requestsPerSecond | quote }}
  RATE_LIMIT_BURST: {{ .Values.monitorApi.rateLimit.burst | quote }}
  # Names the Secret (registry-credentials-secret.yaml) main.go should
  # forward REGISTRY_USERNAME/PASSWORD from into each isolated scan-worker
  # Job it creates -- REGISTRY_USERNAME/PASSWORD themselves come via
  # deployment.yaml's secretKeyRef below, not this plaintext ConfigMap,
  # since main.go only needs the Secret's *name* here to pass along to
  # isolated_trivy.go/isolated_unpacker.go's own SecretEnvVars wiring.
  REGISTRY_CREDENTIALS_SECRET: "scm-registry-credentials"
