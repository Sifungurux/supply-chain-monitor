apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitor-api
  namespace: {{ .Release.Namespace }}
  labels:
    app: monitor-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: monitor-api
  template:
    metadata:
      labels:
        app: monitor-api
      annotations:
        # Forces a new ReplicaSet (and pod) any time the ConfigMap's
        # rendered content changes, even though the image tag itself
        # (monitor-api:dev) usually doesn't -- without this, `helm
        # upgrade`/Flux reconciling a values change to, say,
        # pipelineStages wouldn't actually restart the running pod.
        # Doesn't help with a same-tag *image* rebuild though -- that's
        # what `make deploy`'s explicit rollout restart is still for.
        #
        # $.Template.BasePath is always "<chart>/templates" -- the
        # chart-root templates dir, NOT directory-relative to whichever
        # template is currently rendering (a wrong assumption that broke
        # this exact line during the single-chart consolidation, once
        # configmap.yaml moved from a flat templates/ into
        # templates/monitor-api/). Hence the explicit "/monitor-api/"
        # segment below instead of relying on BasePath to already
        # include it.
        checksum/config: {{ include (print $.Template.BasePath "/monitor-api/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: monitor-api
      # Matches the hardening every scan-worker Job already carries (see
      # internal/k8sjob/job.go's NewScanJob): the API server has no more
      # need for root or for a writable image than a scan worker does.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
      containers:
        - name: monitor-api
          image: "{{ .Values.monitorApi.image.repository }}:{{ .Values.monitorApi.image.tag }}"
          imagePullPolicy: {{ .Values.monitorApi.image.pullPolicy }}
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: monitor-api-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: scm-postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: scm-monitor-api-auth
                  key: API_KEY
            # Authenticates this pod's own in-process pull paths
            # (RegistryFetcher, UnpackerScanner's generated
            # dockerconfig.json, trivy's native TRIVY_USERNAME/PASSWORD)
            # against scm-registry's token-auth -- see main.go's
            # runAPIServer and docs/architecture.md's registry-auth
            # section. registry-credentials-secret.yaml is the read-only
            # scm-reader account; monitor-api never pushes.
            - name: REGISTRY_USERNAME
              valueFrom:
                secretKeyRef:
                  name: scm-registry-credentials
                  key: REGISTRY_USERNAME
            - name: REGISTRY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: scm-registry-credentials
                  key: REGISTRY_PASSWORD
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            # main.go blocks startup on connectStoreWithRetry (up to 12
            # attempts, 5s apart -- worst case ~60s) if Postgres isn't
            # accepting connections yet, which is routine on a fresh
            # deploy where both pods start at once. The process doesn't
            # even open :8080 until that finishes, so readiness probes
            # just harmlessly fail (connection refused) until it does.
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            # Unlike readinessProbe, a liveness failure kills the pod --
            # this needs enough total slack (initialDelay +
            # periodSeconds * failureThreshold) to outlast the ~60s
            # worst-case connectStoreWithRetry loop above, or a slow
            # Postgres bring-up would get the still-retrying
            # monitor-api pod killed and restarted right as it was
            # about to succeed.
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml .Values.monitorApi.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # readOnlyRootFilesystem needs a writable /tmp: monitor-api
            # is NOT write-free the way "all persistence goes through
            # Postgres" suggests. main.go's writeDockerConfig does
            # os.MkdirTemp + os.WriteFile at startup whenever registry
            # credentials are configured (they are -- REGISTRY_USERNAME
            # comes from scm-registry-credentials) and log.Fatalf's if
            # that fails, so without this the pod CrashLoopBackOffs
            # before it ever serves a request. FetchingScanner
            # (internal/scanner/fetch.go) and the SBOM/SARIF document
            # generation path do the same per request.
            #
            # This mirrors NewScanJob's own "scratch" emptyDir at /tmp --
            # the hardening being matched here has always included it,
            # for exactly this reason.
            - name: scratch
              mountPath: /tmp
      volumes:
        - name: scratch
          emptyDir: {}
