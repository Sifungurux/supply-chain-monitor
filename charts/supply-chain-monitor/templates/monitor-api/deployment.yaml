apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitor-api
  namespace: {{ .Release.Namespace }}
  labels:
    app: monitor-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: monitor-api
  template:
    metadata:
      labels:
        app: monitor-api
      annotations:
        # Forces a new ReplicaSet (and pod) any time the ConfigMap's
        # rendered content changes, even though the image tag itself
        # (monitor-api:dev) usually doesn't -- without this, `helm
        # upgrade`/Flux reconciling a values change to, say,
        # pipelineStages wouldn't actually restart the running pod.
        # Doesn't help with a same-tag *image* rebuild though -- that's
        # what `make deploy`'s explicit rollout restart is still for.
        #
        # $.Template.BasePath is always "<chart>/templates" -- the
        # chart-root templates dir, NOT directory-relative to whichever
        # template is currently rendering (a wrong assumption that broke
        # this exact line during the single-chart consolidation, once
        # configmap.yaml moved from a flat templates/ into
        # templates/monitor-api/). Hence the explicit "/monitor-api/"
        # segment below instead of relying on BasePath to already
        # include it.
        checksum/config: {{ include (print $.Template.BasePath "/monitor-api/configmap.yaml") . | sha256sum }}
        # The two Secrets this pod reads through secretKeyRef. Env vars
        # are captured once, at container start, so a rotated credential
        # is invisible to a running pod -- it keeps presenting the old
        # one until something happens to restart it.
        #
        # That is not hypothetical: rotating the registry password left
        # monitor-api holding the previous value while docker_auth had
        # already been re-rendered with a hash of the new one, so every
        # pull failed 401 with both Secrets looking correct and the pod
        # reporting healthy. The ConfigMap had this annotation and these
        # did not, which is exactly the gap.
        #
        # scm-postgres-credentials is deliberately NOT here. Rotating it
        # has a required order (update the Secret, ALTER ROLE against
        # the running database, THEN restart) -- see
        # cluster/chart-secrets.sh. Rolling monitor-api on step one
        # would restart it against a password the database does not have
        # yet, turning a documented three-step rotation into a window of
        # failed readiness.
        checksum/registry-credentials: {{ include (print $.Template.BasePath "/monitor-api/registry-credentials-secret.yaml") . | sha256sum }}
        checksum/api-key: {{ include (print $.Template.BasePath "/monitor-api/auth-secret.yaml") . | sha256sum }}
    spec:
      serviceAccountName: monitor-api
      # Matches the hardening every scan-worker Job already carries (see
      # internal/k8sjob/job.go's NewScanJob): the API server has no more
      # need for root or for a writable image than a scan worker does.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
      containers:
        - name: monitor-api
          image: "{{ .Values.monitorApi.image.repository }}:{{ .Values.monitorApi.image.tag }}"
          imagePullPolicy: {{ .Values.monitorApi.image.pullPolicy }}
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: monitor-api-config
            {{- if or .Values.monitorApi.notifications.webhookSecret .Values.monitorApi.notifications.slackURL }}
            # Notification credentials (HMAC secret, Slack URL) -- see
            # notify-secret.yaml. optional: false is deliberate: if the
            # chart rendered the Secret, a missing one means something
            # deleted it, and starting without notifications configured
            # while claiming they are is worse than failing to start.
            - secretRef:
                name: scm-monitor-api-notify
            {{- end }}
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: scm-postgres-credentials
                  key: POSTGRES_PASSWORD
            {{- if .Values.monitorApi.postgres.dsnExistingSecret }}
            # A complete connection string, which main.go's
            # buildPostgresDSN prefers over every POSTGRES_* field in the
            # ConfigMap -- see monitorApi.postgres.dsnExistingSecret.
            # From a Secret because a DSN carries the password.
            - name: POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.monitorApi.postgres.dsnExistingSecret | quote }}
                  key: {{ .Values.monitorApi.postgres.dsnSecretKey | quote }}
            {{- end }}
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: scm-monitor-api-auth
                  key: API_KEY
{{- if .Values.registry.tls.enabled }}
            # SSL_CERT_DIR, deliberately NOT SSL_CERT_FILE.
            #
            # In Go, SSL_CERT_FILE REPLACES the system trust store: set
            # it to our CA and oras/trivy/grype instantly stop trusting
            # gcr.io, ghcr.io and docker.io, so every scan of a public
            # image fails. SSL_CERT_DIR is additive -- Go still loads the
            # default cert files and then reads every file in these
            # directories -- so the private CA is trusted ALONGSIDE the
            # public roots.
            #
            # monitor-api needs this itself, not just the scan-worker
            # Jobs: resolveDigest runs oras in THIS pod on every
            # registration (main.go's OrasDigestResolver), and the
            # in-process fetch paths do too.
            # Names the Secret k8sjob mounts into every scan-worker Job
            # (internal/k8sjob/job.go). Injected there centrally rather
            # than per-scanner, so a new scanner cannot forget it.
            - name: SCAN_WORKER_REGISTRY_CA_SECRET
              value: scm-ca-tls
            - name: SSL_CERT_DIR
              value: /etc/ssl/certs:/ca
{{- end }}
            - name: TRUSTED_PROXY_CIDRS
              # Falls back to networkPolicy.nodeCIDRs so the cluster's
              # trusted address space is defined once. See
              # values.yaml's monitorApi.trustedProxyCIDRs for what that
              # default does and does not protect against.
              value: {{ join "," (default .Values.networkPolicy.nodeCIDRs .Values.monitorApi.trustedProxyCIDRs) | quote }}
            - name: API_KEYS
              valueFrom:
                secretKeyRef:
                  name: scm-monitor-api-auth
                  key: API_KEYS
                  # Optional so an operator-supplied secret
                  # (apiKeyExistingSecret) that predates named keys
                  # still starts -- the binary treats absent as "no
                  # named keys", which is the pre-feature behaviour.
                  optional: true
            # Authenticates this pod's own in-process pull paths
            # (RegistryFetcher, UnpackerScanner's generated
            # dockerconfig.json, trivy's native TRIVY_USERNAME/PASSWORD)
            # against scm-registry's token-auth -- see main.go's
            # runAPIServer and docs/architecture.md's registry-auth
            # section. registry-credentials-secret.yaml is the read-only
            # scm-reader account; monitor-api never pushes.
            - name: REGISTRY_USERNAME
              valueFrom:
                secretKeyRef:
                  name: scm-registry-credentials
                  key: REGISTRY_USERNAME
            - name: REGISTRY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: scm-registry-credentials
                  key: REGISTRY_PASSWORD
          readinessProbe:
            httpGet:
              # /readyz, NOT /healthz: this one actually pings Postgres,
              # so a database that goes away after startup takes this pod
              # out of the Service instead of leaving it Ready and
              # serving 500s from every endpoint that touches the store.
              # It rejoins on its own when the check passes again.
              path: /readyz
              port: 8080
            # main.go blocks startup on connectStoreWithRetry (up to 12
            # attempts, 5s apart -- worst case ~60s) if Postgres isn't
            # accepting connections yet, which is routine on a fresh
            # deploy where both pods start at once. The process doesn't
            # even open :8080 until that finishes, so readiness probes
            # just harmlessly fail (connection refused) until it does.
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              # Stays /healthz, which deliberately checks nothing but
              # the process itself. A liveness failure KILLS the
              # container, so pointing this at the database would turn a
              # Postgres outage into every monitor-api pod restarting on
              # a loop for the duration -- a recoverable dependency
              # failure converted into a crashloop that can't recover.
              # See internal/api/health.go.
              path: /healthz
              port: 8080
            # Unlike readinessProbe, a liveness failure kills the pod --
            # this needs enough total slack (initialDelay +
            # periodSeconds * failureThreshold) to outlast the ~60s
            # worst-case connectStoreWithRetry loop above, or a slow
            # Postgres bring-up would get the still-retrying
            # monitor-api pod killed and restarted right as it was
            # about to succeed.
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml .Values.monitorApi.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
{{- if .Values.monitorApi.cosign.trustedRootSecret }}
            - name: sigstore-trusted-root
              mountPath: /etc/sigstore
              readOnly: true
{{- end }}
{{- if .Values.registry.tls.enabled }}
            - name: registry-ca
              mountPath: /ca
              readOnly: true
{{- end }}
{{- if and .Values.postgres.tls.enabled .Values.postgres.tls.verify }}
            - name: postgres-ca
              mountPath: /postgres-ca
              readOnly: true
{{- end }}
            # readOnlyRootFilesystem needs a writable /tmp: monitor-api
            # is NOT write-free the way "all persistence goes through
            # Postgres" suggests. main.go's writeDockerConfig does
            # os.MkdirTemp + os.WriteFile at startup whenever registry
            # credentials are configured (they are -- REGISTRY_USERNAME
            # comes from scm-registry-credentials) and log.Fatalf's if
            # that fails, so without this the pod CrashLoopBackOffs
            # before it ever serves a request. FetchingScanner
            # (internal/scanner/fetch.go) and the SBOM/SARIF document
            # generation path do the same per request.
            #
            # This mirrors NewScanJob's own "scratch" emptyDir at /tmp --
            # the hardening being matched here has always included it,
            # for exactly this reason.
            - name: scratch
              mountPath: /tmp
            {{- with .Values.monitorApi.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
{{- if .Values.registry.tls.enabled }}
        - name: registry-ca
          secret:
            secretName: scm-ca-tls
            items:
              - key: ca.crt
                path: scm-ca.crt
{{- end }}
{{- if and .Values.postgres.tls.enabled .Values.postgres.tls.verify }}
        # Separate from registry-ca even though it is the same CA
        # today. That mount is gated on registry.tls.enabled, and
        # hanging the database path off an unrelated feature flag is
        # how someone turns off registry TLS and takes monitor-api's
        # connection pool down with it.
        - name: postgres-ca
          secret:
            secretName: scm-ca-tls
            items:
              - key: ca.crt
                path: ca.crt
{{- end }}
{{- if .Values.monitorApi.cosign.trustedRootSecret }}
        # The trust root for a PRIVATE Sigstore. Deliberately NOT
        # optional: with cosign enabled and this Secret named but
        # missing, verification would fall back to the PUBLIC instance
        # and report passes against a trust root this deployment never
        # chose -- so the pod must refuse to start instead.
        - name: sigstore-trusted-root
          secret:
            secretName: {{ .Values.monitorApi.cosign.trustedRootSecret | quote }}
{{- end }}
        - name: scratch
          emptyDir: {}
        {{- with .Values.monitorApi.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
