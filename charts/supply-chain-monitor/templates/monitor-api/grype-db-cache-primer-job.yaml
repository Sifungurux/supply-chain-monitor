# Populates scm-grype-db-cache with a real, usable vulnerability DB
# once, at install/upgrade time -- pairs with grype-db-cache-pvc.yaml's
# hook annotations. Mirrors trivy-db-cache-primer-job.yaml's shape and
# reasoning exactly (see that file's comment) -- every isolated grype
# scan-worker Job passes GRYPE_DB_AUTO_UPDATE=false (main.go's
# runScanWorker, via GrypeDBConfig.SkipDBUpdate), so it will never try
# to fetch a DB itself; something has to put one there first.
#
# Reuses monitor-api's own image rather than pulling a separate grype
# image -- grype is already installed into it (see Dockerfile).
#
# `grype db update` is grype's documented one-shot DB-population
# command (confirmed via `grype db --help` against the real binary --
# "Download and install the latest vulnerability database").
#
# Gated behind cveScanner != "trivy": every existing deployment
# defaults to cveScanner: trivy and never reads this DB at all, so
# there's no reason to spend install/upgrade time (or the DB's ~1GB+
# download) downloading one nothing uses -- see values.yaml's
# monitorApi.cveScanner comment.
{{- if ne .Values.monitorApi.cveScanner "trivy" }}
apiVersion: batch/v1
kind: Job
metadata:
  name: scm-grype-db-cache-primer
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-4"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  template:
    spec:
      restartPolicy: Never
      # Mirrors the DB-refresh CronJob this primes (see
      # grype-db-refresh-cronjob.yaml): same uid as the scan-worker that
      # reads the cache, and fsGroup so a cache root created by an
      # earlier root-run Job stays writable.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      containers:
        - name: primer
          image: {{ include "supply-chain-monitor.monitorApiImage" . | quote }}
          # Deliberately no readOnlyRootFilesystem: these run trivy/grype/psql,
          # which use TMPDIR and other rootfs paths that have not been verified
          # here. Dropping capabilities and privilege escalation is safe
          # regardless -- assuming a read-only rootfs is what crash-looped
          # monitor-api when it was added without checking.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              echo "downloading grype vulnerability DB into ${GRYPE_DB_CACHE_DIR}"
              # Sweep grype's abandoned download staging directories
              # BEFORE updating, not after.
              #
              # grype does not remove its temp dir when an update fails,
              # and each one is ~700MB-1.3GB. So one failure makes the
              # next failure likelier, and a cache that has failed enough
              # times CANNOT succeed again at any size: on 2026-10-07
              # this volume held ten of them, ~8GB inside 10Gi, and
              # `grype db update` died with "unable to create db client
              # temp dir: no space left on device" -- which reads as a
              # sizing problem and is not one. Raising 2Gi to 10Gi
              # (#224) bought time and nothing else.
              #
              # That failure is not confined to the cache. This Job is a
              # Helm PRE-UPGRADE HOOK, so its failure fails the upgrade,
              # Flux rolls back, and every unrelated change in the same
              # commit is reverted. The cluster sat on a three-week-old
              # chart and image that way, with each new deploy appearing
              # to merge and silently reverting.
              #
              # Before, not after, because an "after" cleanup never runs
              # on the path that creates the garbage -- the failing one.
              #
              # Best-effort for the same reason the chmod below is: a
              # leftover owned by an earlier uid cannot be removed by
              # this one, and under `set -eu` that would fail a primer
              # that is otherwise about to succeed. If the sweep cannot
              # free enough, `grype db update` fails on its own and says
              # so.
              stale=$(find "${GRYPE_DB_CACHE_DIR}" -maxdepth 1 -name 'grype-db-download*' 2>/dev/null | wc -l | tr -d ' ')
              if [ "${stale}" -gt 0 ]; then
                echo "sweeping ${stale} abandoned grype download staging director(ies)"
                find "${GRYPE_DB_CACHE_DIR}" -maxdepth 1 -name 'grype-db-download*' \
                  -exec rm -rf {} + 2>/dev/null || true
              fi
              grype db update
              # grype creates its own schema-versioned subdirectory
              # (e.g. .../6/) mode 0700, owned by whatever uid this Job
              # runs as -- 65534, per this pod's own securityContext
              # above (it was never root: the comment here used to say
              # so, from before that securityContext existed).
              # The scan-worker Jobs that read this PVC run as uid 65534
              # (see k8sjob.NewScanJob's securityContext), so without
              # this they can't even traverse into it -- grype exits 1
              # on every scan with an empty stderr, which surfaced as
              # "grype scan failed for ...: exit status 1 ()" and, until
              # 2026-08-10, meant grype had never recorded a single
              # finding while trivy had 145k. The DB files themselves
              # are already world-readable; only the directory bit is
              # missing, and a+rX adds traversal without granting write.
              # Best-effort, exactly as in grype-db-refresh-cronjob.yaml:
              # now that this Job runs as 65534, anything left over from
              # when it ran as root cannot be chmod'd by a non-owner
              # ("Operation not permitted"), and under `set -eu` that
              # fails the whole Job -- which is precisely what happened
              # the first time this was run non-root. The leftovers are
              # already reachable via the fsGroup above, and a DB this
              # Job installs comes out owned by 65534 anyway, so failing
              # here would break a working primer to fix nothing.
              chmod -R a+rX "${GRYPE_DB_CACHE_DIR}" 2>/dev/null || true
              echo "grype DB cache primed"
          env:
            - name: GRYPE_DB_CACHE_DIR
              value: {{ .Values.monitorApi.grypeCache.mountPath | quote }}
          volumeMounts:
            - name: grype-cache
              mountPath: {{ .Values.monitorApi.grypeCache.mountPath | quote }}
          resources:
            {{- toYaml .Values.monitorApi.grypeCache.resources | nindent 12 }}
      volumes:
        - name: grype-cache
          persistentVolumeClaim:
            claimName: {{ .Values.monitorApi.grypeCache.pvcName }}
{{- end }}
