# Keeps scm-grype-db-cache current after grype-db-cache-primer-job's
# one-time install-time download -- every isolated grype scan-worker
# Job always sets GRYPE_DB_AUTO_UPDATE=false (see main.go's
# runScanWorker), so without this CronJob the DB would stay frozen at
# whatever it was the day this chart was first installed. Mirrors
# trivy-db-refresh-cronjob.yaml's shape closely -- see that file's
# comment for the general pattern.
#
# Reuses monitor-api's own image, same as the primer Job -- grype is
# already installed into it.
#
# concurrencyPolicy: Forbid (same as trivy's refresh CronJob): two
# overlapping refreshes writing into the same PVC at once is only ever
# wasted work, never worth allowing.
#
# Gated behind cveScanner != "trivy" -- see grype-db-cache-primer-job.yaml's
# identical gating and values.yaml's monitorApi.cveScanner comment.
{{- if ne .Values.monitorApi.cveScanner "trivy" }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: scm-grype-db-refresh
  namespace: {{ .Release.Namespace }}
  labels:
    app: scm-grype-db-refresh
spec:
  schedule: {{ .Values.monitorApi.grypeCache.refreshSchedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app: scm-grype-db-refresh
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app: scm-grype-db-refresh
        spec:
          restartPolicy: Never
          # Same hardening the scan-worker Jobs carry (internal/k8sjob/
          # job.go's NewScanJob), plus fsGroup -- which is load-bearing
          # here, not decoration. This Job used to run as root and
          # created its cache directories root-owned; a uid-65534
          # process cannot write into those (measured: "Permission
          # denied" touching scm-grype-db-cache/6). fsGroup makes
          # kubelet recursively chgrp the volume to 65534 and add group
          # write at mount time, which is what lets the non-root refresh
          # keep updating a cache root created earlier by root.
          securityContext:
            seccompProfile:
              type: RuntimeDefault
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
          containers:
            - name: grype-db-refresh
              image: {{ include "supply-chain-monitor.monitorApiImage" . | quote }}
              # Deliberately no readOnlyRootFilesystem: these run trivy/grype/psql,
              # which use TMPDIR and other rootfs paths that have not been verified
              # here. Dropping capabilities and privilege escalation is safe
              # regardless -- assuming a read-only rootfs is what crash-looped
              # monitor-api when it was added without checking.
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              command: ["sh", "-c"]
              args:
                - |
                  set -eu
                  echo "refreshing grype vulnerability DB in ${GRYPE_DB_CACHE_DIR}"
                  grype db update
                  # The 0700-directory problem this used to solve is
                  # mostly gone now that this Job runs as 65534 -- the
                  # same uid the scan-worker runs as -- so every
                  # directory it creates is already owned and readable
                  # by the reader. See grype-db-cache-primer-job.yaml
                  # for the original symptom (grype silently returning
                  # zero findings for four days).
                  #
                  # Kept, but best-effort: anything left over from when
                  # this Job ran as root cannot be chmod'd by a
                  # non-owner ("Operation not permitted"), and under
                  # `set -eu` that would fail the whole refresh. Those
                  # leftovers are already reachable via the fsGroup
                  # above, so failing here would break a working refresh
                  # to fix nothing.
                  chmod -R a+rX "${GRYPE_DB_CACHE_DIR}" 2>/dev/null || true
                  echo "grype DB cache refreshed"
              env:
                - name: GRYPE_DB_CACHE_DIR
                  value: {{ .Values.monitorApi.grypeCache.mountPath | quote }}
              volumeMounts:
                - name: grype-cache
                  mountPath: {{ .Values.monitorApi.grypeCache.mountPath | quote }}
              resources:
                {{- toYaml .Values.monitorApi.grypeCache.resources | nindent 16 }}
          volumes:
            - name: grype-cache
              persistentVolumeClaim:
                claimName: {{ .Values.monitorApi.grypeCache.pvcName }}
{{- end }}
