# The bearer token Prometheus presents when monitorApi.metricsToken
# gates /metrics (report S4).
#
# Its own Secret rather than an entry in scm-monitor-api-auth: that one
# carries a checksum annotation that rolls monitor-api whenever it
# changes, and a scrape token is not an API credential -- rotating it
# should not restart the API. It is also referenced by a ServiceMonitor,
# which lives in whatever namespace Prometheus watches.
{{- if .Values.monitorApi.metricsToken }}
apiVersion: v1
kind: Secret
metadata:
  name: scm-monitor-api-metrics
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  METRICS_TOKEN: {{ .Values.monitorApi.metricsToken | quote }}
{{- end }}
