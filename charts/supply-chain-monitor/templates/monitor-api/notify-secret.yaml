{{- if or .Values.monitorApi.notifications.webhookSecret .Values.monitorApi.notifications.slackURL }}
# Holds the two notification credentials that must not sit in a
# ConfigMap: the HMAC signing secret, and the Slack incoming webhook URL
# (which IS the credential -- anyone holding it can post to the channel,
# so it gets the same treatment as a password rather than being treated
# as "just a URL" alongside the generic webhook URL in the ConfigMap).
#
# Rendered only when at least one is set, so a deployment using neither
# doesn't carry an empty Secret around.
apiVersion: v1
kind: Secret
metadata:
  name: scm-monitor-api-notify
  namespace: {{ .Release.Namespace }}
  labels:
    app: monitor-api
type: Opaque
stringData:
  {{- with .Values.monitorApi.notifications.webhookSecret }}
  NOTIFY_WEBHOOK_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.monitorApi.notifications.slackURL }}
  NOTIFY_SLACK_URL: {{ . | quote }}
  {{- end }}
{{- end }}
