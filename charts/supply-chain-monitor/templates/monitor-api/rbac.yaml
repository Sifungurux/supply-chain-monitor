# Scopes exactly what monitor-api's own ServiceAccount token (see
# serviceaccount.yaml -- automountServiceAccountToken flipped to true
# for this) can do: create/get/delete a scan-worker Job and read its
# pod's logs, and only within this one namespace. No access to any
# other resource (Secrets, ConfigMaps, other namespaces, cluster-scoped
# anything) -- see internal/k8sjob/client.go for the exact calls this
# permits and docs/architecture.md for why monitor-api needs this at
# all now.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: monitor-api-scan-jobs
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
{{- if .Values.monitorApi.scanScratch.storageClass }}
  # Only granted when scan scratch space comes from a StorageClass.
  # Kubernetes treats a pod requesting a generic ephemeral volume as
  # creating a PVC indirectly, so the identity creating those Jobs needs
  # to be allowed to create them -- and delete, since the volume's whole
  # point is that it dies with its pod. Left ungranted otherwise: an
  # emptyDir needs none of this, and a permission nothing uses is a
  # permission worth not having.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create", "delete"]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: monitor-api-scan-jobs
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: monitor-api
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: monitor-api-scan-jobs
  apiGroup: rbac.authorization.k8s.io
