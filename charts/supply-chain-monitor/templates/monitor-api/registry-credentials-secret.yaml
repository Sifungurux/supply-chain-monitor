# monitor-api only ever PULLS from scm-registry (fetch.go, unpacker.go,
# trivy's own registry client) -- never pushes -- so it only ever needs
# the read-only scm-reader account, reusing the exact same
# username/password dockerAuth.accounts.reader already defines for
# docker_auth's own ACL (templates/docker-auth/config-secret.yaml).
# Deliberately not a new values.yaml field: duplicating the password
# there would just be one more place for the two to drift out of sync.
apiVersion: v1
kind: Secret
metadata:
  name: scm-registry-credentials
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  REGISTRY_USERNAME: {{ .Values.dockerAuth.accounts.reader.username | quote }}
  REGISTRY_PASSWORD: {{ .Values.dockerAuth.accounts.reader.password | quote }}
