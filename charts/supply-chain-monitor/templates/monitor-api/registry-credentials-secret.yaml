# monitor-api normally only PULLS from scm-registry (fetch.go,
# unpacker.go, trivy's own registry client), so it normally gets the
# read-only scm-reader account, reusing the exact same username/password
# dockerAuth.accounts.reader already defines for docker_auth's own ACL
# (templates/docker-auth/config-secret.yaml). Deliberately not a new
# values.yaml field: duplicating the password there would just be one
# more place for the two to drift out of sync.
#
# monitorApi.mirrorArtifacts.enabled CHANGES THAT. Mirroring copies each
# registered artifact INTO this registry with `oras copy`, which needs
# push -- and scm-reader's ACL is `actions: ["pull"]`, full stop. With
# the reader account every copy would 403, and because mirroring is
# best-effort by design the only symptom would be "mirroring silently
# never sticks", indistinguishable from a full PVC. So this switches to
# scm-writer (`["pull", "push"]` on every repository, so no ACL change
# is needed for the mirror/ prefix) precisely when mirroring is on, and
# not one moment earlier: monitor-api holding push credentials it has no
# use for is exactly the kind of standing privilege nobody revisits.
#
# Gated on the SAME dockerAuth.existingSecret flag as docker_auth's own
# config, because the two are halves of one credential set: that config
# holds the bcrypt hashes docker_auth checks against, this holds the
# cleartext monitor-api presents. Managing one externally and letting
# the chart render the other from values it no longer has is not a
# state worth supporting -- they would simply disagree, and the symptom
# would be 401s from the registry with both objects looking fine.
{{- if not .Values.dockerAuth.existingSecret }}
{{- $account := .Values.dockerAuth.accounts.reader }}
{{- if .Values.monitorApi.mirrorArtifacts.enabled }}
{{- $account = .Values.dockerAuth.accounts.writer }}
{{- if not $account.password }}
{{- fail "monitorApi.mirrorArtifacts.enabled needs dockerAuth.accounts.writer.password set: mirroring PUSHES into scm-registry and the read-only reader account cannot. An account with no password is omitted from docker_auth entirely (see templates/docker-auth/config-secret.yaml), so rendering this would hand monitor-api credentials that cannot even pull -- run cluster/chart-secrets.sh, which generates all three." }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: scm-registry-credentials
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  REGISTRY_USERNAME: {{ $account.username | quote }}
  REGISTRY_PASSWORD: {{ $account.password | quote }}
{{- end }}

{{- /*
Inline registryCredentials entries, rendered as ONE
kubernetes.io/dockerconfigjson Secret.

Only entries with an inline username belong here. An entry naming an
existingDockerConfigSecret is mounted as it is -- this chart cannot read
it (`lookup` returns nil under `helm template`, which is exactly what CI
renders), so folding it in here would produce an auths map that looks
complete and is empty. Both kinds land in the same directory in the pod
and are merged there; see main.go's mergeRegistryAuths.
*/}}
{{- $inline := dict }}
{{- range .Values.monitorApi.registryCredentials }}
{{- if .username }}
{{- $_ := set $inline .host (dict "username" .username "password" .password "auth" (printf "%s:%s" .username .password | b64enc)) }}
{{- end }}
{{- end }}
{{- if $inline }}
---
apiVersion: v1
kind: Secret
metadata:
  name: scm-registry-credentials-inline
  namespace: {{ .Release.Namespace }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ dict "auths" $inline | toJson | b64enc | quote }}
{{- end }}

{{- /*
Inline `ca:` PEMs, one key per host, mounted as a directory that
SSL_CERT_DIR names. Go reads every file in such a directory, so the file
names only have to be distinct -- the host, with the characters a
Secret key may not contain replaced.
*/}}
{{- $cas := dict }}
{{- range .Values.monitorApi.registryCredentials }}
{{- if .ca }}
{{- $_ := set $cas (printf "%s.crt" (.host | replace ":" "-" | replace "/" "-")) (.ca | b64enc) }}
{{- end }}
{{- end }}
{{- if $cas }}
---
apiVersion: v1
kind: Secret
metadata:
  name: scm-registry-extra-cas
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
{{- range $name, $pem := $cas }}
  {{ $name }}: {{ $pem | quote }}
{{- end }}
{{- end }}
