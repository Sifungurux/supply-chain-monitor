# REGISTRY_USERNAME/PASSWORD is the read-only scm-reader account, reusing
# the exact same username/password dockerAuth.accounts.reader already
# defines for docker_auth's own ACL (templates/docker-auth/config-secret.yaml).
# Deliberately not a new values.yaml field: duplicating the password
# there would just be one more place for the two to drift out of sync.
#
# It stays the READER even with mirroring on, because these two keys are
# not monitor-api's alone: every scan-worker Job reads them from this
# same Secret by these same key names (see isolated_trivy.go /
# isolated_grype.go). Those Jobs run scanner binaries over untrusted
# image content, and handing them push access to the registry that holds
# the mirrored copies -- copies this service then scans -- would put a
# write path into the artifact store one exploited scanner away.
#
# MIRROR_REGISTRY_USERNAME/PASSWORD is the push-capable scm-writer
# account, rendered only when mirroring is on and mounted only on the
# monitor-api Deployment. `oras copy` needs push on the destination and
# scm-reader's ACL is `actions: ["pull"]`, full stop; with the reader
# every copy 403s, and because mirroring is best-effort by design the
# only symptom would be "mirroring silently never sticks",
# indistinguishable from a full PVC. Verified against the live registry
# before splitting these: a copy attempted with the reader is refused
# with `unauthorized ... Action:push Name:mirror/...`.
#
# Gated on the SAME dockerAuth.existingSecret flag as docker_auth's own
# config, because the two are halves of one credential set: that config
# holds the bcrypt hashes docker_auth checks against, this holds the
# cleartext monitor-api presents. Managing one externally and letting
# the chart render the other from values it no longer has is not a
# state worth supporting -- they would simply disagree, and the symptom
# would be 401s from the registry with both objects looking fine.
{{- if not .Values.dockerAuth.existingSecret }}
{{- if .Values.monitorApi.mirrorArtifacts.enabled }}
{{- if not .Values.dockerAuth.accounts.writer.password }}
{{- fail "monitorApi.mirrorArtifacts.enabled needs dockerAuth.accounts.writer.password set: mirroring PUSHES into scm-registry and the read-only reader account cannot. An account with no password is omitted from docker_auth entirely (see templates/docker-auth/config-secret.yaml), so rendering this would publish a mirror credential that cannot authenticate at all -- run cluster/chart-secrets.sh, which generates all three." }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: scm-registry-credentials
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  REGISTRY_USERNAME: {{ .Values.dockerAuth.accounts.reader.username | quote }}
  REGISTRY_PASSWORD: {{ .Values.dockerAuth.accounts.reader.password | quote }}
{{- if .Values.monitorApi.mirrorArtifacts.enabled }}
  MIRROR_REGISTRY_USERNAME: {{ .Values.dockerAuth.accounts.writer.username | quote }}
  MIRROR_REGISTRY_PASSWORD: {{ .Values.dockerAuth.accounts.writer.password | quote }}
{{- end }}
{{- end }}

{{- /*
Inline registryCredentials entries, rendered as ONE
kubernetes.io/dockerconfigjson Secret.

Only entries with an inline username belong here. An entry naming an
existingDockerConfigSecret is mounted as it is -- this chart cannot read
it (`lookup` returns nil under `helm template`, which is exactly what CI
renders), so folding it in here would produce an auths map that looks
complete and is empty. Both kinds land in the same directory in the pod
and are merged there; see main.go's mergeRegistryAuths.
*/}}
{{- $inline := dict }}
{{- range .Values.monitorApi.registryCredentials }}
{{- if .username }}
{{- $_ := set $inline .host (dict "username" .username "password" .password "auth" (printf "%s:%s" .username .password | b64enc)) }}
{{- end }}
{{- end }}
{{- if $inline }}
---
apiVersion: v1
kind: Secret
metadata:
  name: scm-registry-credentials-inline
  namespace: {{ .Release.Namespace }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ dict "auths" $inline | toJson | b64enc | quote }}
{{- end }}

{{- /*
Inline `ca:` PEMs, one key per host, mounted as a directory that
SSL_CERT_DIR names. Go reads every file in such a directory, so the file
names only have to be distinct -- the host, with the characters a
Secret key may not contain replaced.
*/}}
{{- $cas := dict }}
{{- range .Values.monitorApi.registryCredentials }}
{{- if .ca }}
{{- $_ := set $cas (printf "%s.crt" (.host | replace ":" "-" | replace "/" "-")) (.ca | b64enc) }}
{{- end }}
{{- end }}
{{- if $cas }}
---
apiVersion: v1
kind: Secret
metadata:
  name: scm-registry-extra-cas
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
{{- range $name, $pem := $cas }}
  {{ $name }}: {{ $pem | quote }}
{{- end }}
{{- end }}
