apiVersion: v1
kind: ServiceAccount
metadata:
  name: monitor-api
  namespace: {{ .Release.Namespace }}
# Deliberately flipped from false to true: monitor-api creates and
# watches a Kubernetes Job per image scan (see
# internal/scanner/isolated_unpacker.go and docs/architecture.md,
# "Isolating the unpack+scan step") instead of unpacking and scanning
# arbitrary, potentially malicious image content in its own process --
# it genuinely needs to call the Kubernetes API now. rbac.yaml's Role
# scopes what this token can actually do down to exactly that (create/
# get/delete Jobs and read Pod logs, in this namespace only) rather
# than leaving it with cluster-wide access. The unpack+scan step itself
# still never sees this token -- it runs in a separate pod under
# scm-scan-worker's ServiceAccount below, which has none at all.
automountServiceAccountToken: true
---
# Used only by the per-scan Jobs internal/scanner/isolated_unpacker.go
# creates -- deliberately separate from monitor-api's own ServiceAccount
# above. No Role is ever bound to this one: the pod that unpacks and
# parses untrusted image content has zero Kubernetes API access, not
# just a token-less version of monitor-api's own scoped-down access.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scm-scan-worker
  namespace: {{ .Release.Namespace }}
automountServiceAccountToken: false
