# Runs `monitor-api sweep-registered` (main.go) on a schedule -- scans a
# bounded batch of artifacts still sitting at status "registered" (never
# scanned since creation), oldest first, and opportunistically backfills
# a missing digest along the way (the same registry resolution
# registration itself attempts, but registration-time resolution is
# one-shot and never retried on its own -- see resolveDigest's own
# comment in internal/api/handlers.go, and scanArtifact's for the
# backfill). Mirrors trivy-db-refresh-cronjob.yaml's shape closely -- see
# that file's own comment for the general pattern.
#
# Reuses monitor-api's own image: sweep-registered is the same binary as
# the API server and scan-worker, just a third `os.Args[1]` mode -- no
# separate build/image needed.
#
# Calls back into the running monitor-api Service over plain HTTP (GET
# /api/v1/artifacts, POST .../scan), the same way isolated scan-worker
# Jobs already call back to upload generated documents -- not a direct
# Postgres connection, so this needs no Kubernetes API access and no
# special ServiceAccount/RBAC at all.
#
# concurrencyPolicy: Forbid (same as the postgres backup and trivy DB
# refresh CronJobs): two overlapping sweeps could pick and scan the same
# artifacts twice, which is wasted work, not a correctness problem worth
# allowing.
{{- if .Values.monitorApi.sweep.enabled }}
{{- if le (mul .Values.monitorApi.sweep.timeoutMinutes 60) (int .Values.monitorApi.scanTimeoutSeconds) }}
{{- fail (printf "monitorApi.sweep.timeoutMinutes (%ds) must exceed monitorApi.scanTimeoutSeconds (%ds). The sweep blocks waiting for each scan it starts, so a budget below one scan's maximum duration cannot finish even a single artifact -- every run with real work would die DeadlineExceeded, which is exactly the regression this guard exists to prevent." (mul .Values.monitorApi.sweep.timeoutMinutes 60) (int .Values.monitorApi.scanTimeoutSeconds)) }}
{{- end }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: scm-sweep-registered
  namespace: {{ .Release.Namespace }}
  labels:
    app: scm-sweep-registered
spec:
  schedule: {{ .Values.monitorApi.sweep.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app: scm-sweep-registered
    spec:
      backoffLimit: 1
      # DERIVED, not a literal, and deliberately larger than the
      # sweep's own SWEEP_TIMEOUT_MINUTES budget below.
      #
      # These two used to be independently hardcoded at the same 600s.
      # Equal is not safe: this clock starts when the Job is created
      # (image pull, container start) while the sweep's own starts a
      # second or two later inside the process, so Kubernetes always
      # won the race and killed the pod before it could exit gracefully
      # and log its summary. Every genuinely-busy run was reported as
      # DeadlineExceeded with no output explaining what it had done.
      #
      # The 300s of headroom is the same margin sweep-sbom-cronjob.yaml
      # uses, for the same reason.
      activeDeadlineSeconds: {{ add (mul .Values.monitorApi.sweep.timeoutMinutes 60) 300 }}
      template:
        metadata:
          labels:
            app: scm-sweep-registered
        spec:
          restartPolicy: Never
          # Same hardening the scan-worker Jobs carry (internal/k8sjob/
          # job.go's NewScanJob). Safe without a writable /tmp, unlike
          # the API Deployment: `monitor-api sweep-registered` returns
          # from main() before runAPIServer's writeDockerConfig is ever
          # reached, and does nothing but HTTP calls to monitor-api's own
          # Service (see runSweepRegistered).
          securityContext:
            seccompProfile:
              type: RuntimeDefault
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
          containers:
            - name: sweep-registered
              image: "{{ .Values.monitorApi.image.repository }}:{{ .Values.monitorApi.image.tag }}"
              # Deliberately no readOnlyRootFilesystem: these run trivy/grype/psql,
              # which use TMPDIR and other rootfs paths that have not been verified
              # here. Dropping capabilities and privilege escalation is safe
              # regardless -- assuming a read-only rootfs is what crash-looped
              # monitor-api when it was added without checking.
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              args: ["sweep-registered"]
              env:
                - name: SWEEP_API_BASE_URL
                  value: "http://monitor-api:8080"
                - name: SWEEP_BATCH_SIZE
                  value: {{ .Values.monitorApi.sweep.batchSize | quote }}
                # Passed explicitly so the process budget and the Job
                # deadline above come from ONE value and cannot drift
                # into agreeing by coincidence again.
                - name: SWEEP_TIMEOUT_MINUTES
                  value: {{ .Values.monitorApi.sweep.timeoutMinutes | quote }}
                # 0 means this sweep never rescans on age alone -- the
                # staleness WARNING is independent and shows regardless.
                # See monitorApi.scanFreshness.
                #
                # rescanAfterDays, NOT warnAfterDays: the scanning
                # cadence and the alerting threshold are different
                # questions, and sharing one value makes the badge
                # meaningless at any aggressive cadence (rescans are
                # paced at batchSize per run, so artifacts legitimately
                # sit past an aggressive threshold most of the time).
                # Falls back to warnAfterDays when unset, which is what
                # this did before the two were split.
                - name: SWEEP_RESCAN_STALE_AFTER_DAYS
                  value: {{ if .Values.monitorApi.scanFreshness.autoRescan }}{{ default .Values.monitorApi.scanFreshness.warnAfterDays .Values.monitorApi.scanFreshness.rescanAfterDays | quote }}{{ else }}"0"{{ end }}
                # Adds one more pass: already-scanned artifacts that have
                # never had mirroring settled (source_ref empty), rescanned
                # so the copy happens. Without it, "copy what is already
                # registered" would never reach the artifacts registered
                # before mirroring was turned on -- they are neither
                # "registered" nor "failed", and staleness rescanning is
                # off by default. Paced by SWEEP_BATCH_SIZE and it
                # converges: each scan settles source_ref either way.
                - name: SWEEP_MIRROR_BACKFILL
                  value: {{ .Values.monitorApi.mirrorArtifacts.enabled | quote }}
                - name: SWEEP_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: scm-monitor-api-auth
                      key: API_KEY
              resources:
                {{- toYaml .Values.monitorApi.sweep.resources | nindent 16 }}
{{- end }}
