# Runs `monitor-api sweep-registered` with SWEEP_MODE=sbom-only --
# re-derives the cve bucket for every image artifact that already has a
# stored SBOM, by running grype against that document instead of pulling
# and re-scanning the image. See main.go's sweepSBOMOnly and
# docs/architecture.md ("SBOM re-evaluation sweep").
#
# A SECOND CronJob rather than a mode of the existing one, deliberately:
# the two run on completely different cadences (every 15 minutes vs
# daily), cover different populations, and neither can substitute for
# the other -- malware findings come only from the full sweep. Folding
# them together would mean one schedule serving two jobs badly.
#
# Scheduled shortly after the CVE database refresh (trivyCache 03:00 /
# grypeCache 04:00 UTC by default): re-evaluating against yesterday's
# vulnerability DB would buy nothing at all, so this must not race the
# refresh that gives it a reason to run.
#
# NO cveScanner GUARD. This used to require grype and refuse to render
# for cveScanner: "trivy" -- wrong on both counts. The re-evaluation now
# uses whichever tool built the cve bucket (main.go's
# sbomReevalScanner), and trivy's DB cache PVC, primer Job and refresh
# CronJob are deployed unconditionally, so every configuration has a
# working tool.
#
# Same image, ServiceAccount-less shape and hardening as
# sweep-registered-cronjob.yaml -- see that file's own comment for the
# general pattern and for why calling back through the API needs no
# Kubernetes access.
{{- if .Values.monitorApi.sweepSbom.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: scm-sweep-sbom
  namespace: {{ .Release.Namespace }}
  labels:
    app: scm-sweep-sbom
spec:
  schedule: {{ .Values.monitorApi.sweepSbom.schedule | quote }}
  # Forbid, same as the full sweep: a run that outlives its schedule is
  # already covering the whole fleet, and a second concurrent one would
  # just contend for the same grype scan slots.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app: scm-sweep-sbom
    spec:
      backoffLimit: 1
      # Comfortably above sweepSbom.timeoutMinutes, so the sweep's own
      # budget is what fires first and the run gets to log its summary
      # ("N re-evaluated, N failed, N skipped") rather than being killed
      # mid-loop with nothing said.
      activeDeadlineSeconds: {{ add (mul .Values.monitorApi.sweepSbom.timeoutMinutes 60) 300 }}
      template:
        metadata:
          labels:
            app: scm-sweep-sbom
        spec:
          restartPolicy: Never
          securityContext:
            seccompProfile:
              type: RuntimeDefault
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
{{- if .Values.monitorApi.tls.enabled }}
          volumes:
            - name: api-ca
              secret:
                secretName: scm-ca-tls
                items:
                  - key: ca.crt
                    path: scm-ca.crt
{{- end }}
          containers:
            - name: sweep-sbom
              image: "{{ .Values.monitorApi.image.repository }}:{{ .Values.monitorApi.image.tag }}"
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              args: ["sweep-registered"]
              env:
                # Scheme follows monitorApi.tls.enabled -- see the
                # apiBaseURL helper. A caller left on http:// when the
                # server moves to TLS fails outright, at whatever hour
                # its CronJob runs rather than at deploy time.
                - name: SWEEP_API_BASE_URL
                  value: {{ include "supply-chain-monitor.apiBaseURL" . | quote }}
                # The one variable that makes this a different sweep.
                - name: SWEEP_MODE
                  value: "sbom-only"
                # 0 = every eligible artifact in one run. See
                # values.yaml for why this mode is not paced in batches
                # the way the full sweep is.
                - name: SWEEP_BATCH_SIZE
                  value: {{ .Values.monitorApi.sweepSbom.batchSize | quote }}
                - name: SWEEP_TIMEOUT_MINUTES
                  value: {{ .Values.monitorApi.sweepSbom.timeoutMinutes | quote }}
                # The named "sweep" client, NOT the master key. This
                # used to take API_KEY, which authenticates as client
                # "default" with unrestricted scope -- so a CronJob that
                # only lists artifacts and posts scans carried authority
                # to delete every artifact in the fleet. Scopes key off
                # the client NAME, so sharing the master key made this
                # consumer impossible to limit at all (report S2).
                # Falls back to the master key when no sweep entry
                # exists; see the namedKey helper.
{{- if .Values.monitorApi.tls.enabled }}
                # Additive, never SSL_CERT_FILE: that REPLACES Go's
                # system trust store, and this Job would stop trusting
                # everything public. See values.yaml's note.
                - name: SSL_CERT_DIR
                  value: "/etc/ssl/certs:/ca"
{{- end }}
                - name: SWEEP_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: scm-monitor-api-auth
                      key: SWEEP_API_KEY
{{- if .Values.monitorApi.tls.enabled }}
              volumeMounts:
                - name: api-ca
                  mountPath: /ca
                  readOnly: true
{{- end }}
              resources:
                {{- toYaml .Values.monitorApi.sweepSbom.resources | nindent 16 }}
{{- end }}
