{{- if .Values.networkPolicy.enabled }}
# monitor-api: ingress restricted to the things that legitimately call
# it, egress left broad except for the metadata service.
#
# The asymmetry is deliberate. Unlike a scan-worker, monitor-api has a
# genuinely wide and moving egress surface -- the kube-apiserver (it
# CREATES the scan Jobs), Postgres, clamd, the registry, public
# registries for digest resolution, and operator-configured notification
# webhooks pointing anywhere at all. A default-deny egress here would be
# a long allow-list that silently breaks a feature the first time
# someone configures a new webhook host. So this blocks the one
# destination that is never legitimate and leaves the rest to
# ValidateRef at the application layer (see internal/scanner/refvalidate.go).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: scm-monitor-api
  namespace: {{ .Release.Namespace }}
  labels:
    app: monitor-api
spec:
  podSelector:
    matchLabels:
      app: monitor-api
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        # The ingress controller, which fronts every browser/CLI call.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressControllerNamespace }}
        # In-namespace callers: scan-worker Jobs uploading generated
        # SBOM/SARIF documents, the sweep CronJob, and the dashboard.
        - podSelector: {}
        # Kubelet probe traffic. This one is load-bearing and easy to
        # get wrong: monitor-api's readiness/liveness probes are
        # httpGet, and probe packets come FROM THE NODE, not from any
        # pod -- so an ingress policy without this drops them, the pod
        # goes NotReady, liveness then kills it, and the API
        # crash-loops. (Postgres needs no equivalent: its probes are
        # exec.) Narrow networkPolicy.nodeCIDRs to your real node subnet
        # if you want this tighter.
        {{- range .Values.networkPolicy.nodeCIDRs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        # Fixed in templates/monitor-api/service.yaml, not a value.
        - protocol: TCP
          port: 8080
  egress:
    # DNS, and then every in-cluster peer, named by SELECTOR rather than
    # left to the catch-all CIDR below.
    #
    # A CIDR alone is not enough, and how it fails depends on the CNI.
    # Under flannel/kube-router (k3d) an ipBlock of 0.0.0.0/0 genuinely
    # means everything, pod and Service traffic included, so this policy
    # looked complete for as long as that was the only cluster it ran
    # on. Cilium resolves in-cluster destinations to security identities
    # instead, and a CIDR only ever matches the "world" identity -- so
    # the very same rule permits the public internet and silently drops
    # CoreDNS.
    #
    # Measured on Cilium, from a pod carrying this policy's own label:
    #
    #   1.1.1.1:53      open
    #   10.96.0.10:53   connection timed out    <- CoreDNS, ClusterIP
    #
    # None of which surfaces as a network error anywhere useful:
    # monitor-api blocks in connectStoreWithRetry unable to resolve
    # Postgres, never binds its listener, and the liveness probe kills
    # it -- so it presents as a CrashLoopBackOff with nothing in its own
    # logs, while Postgres logs no connection attempt at all, because
    # none ever arrives.
    #
    # scan-worker-egress.yaml has always named its peers this way. This
    # policy was the one that did not.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.dnsNamespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.dnsSelector | nindent 14 }}
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    # Postgres, the registry, clamav and docker-auth all live in this
    # namespace, and each is already constrained from the other side --
    # postgres.yaml admits only named clients. Enumerating them again
    # here would be a second list to keep in step with the first.
    - to:
        - podSelector: {}
    # The Kubernetes API, which monitor-api needs in order to create
    # scan-worker Jobs. Same identity problem as DNS -- the API server
    # is not part of the "world" a CIDR rule covers -- and there is no
    # portable selector for it in a NetworkPolicy, so it is named by
    # CIDR: the Service range it is reachable through, and the node
    # network it actually runs on.
    {{- range .Values.networkPolicy.apiServerCIDRs }}
    - to:
        - ipBlock:
            cidr: {{ . | quote }}
    {{- end }}
    # Everything genuinely external -- ghcr.io, upstream registries, the
    # vulnerability-database feeds, notification webhooks -- except the
    # instance-metadata range. Expressed as one allow with an `except`
    # rather than a deny, because NetworkPolicy has no deny primitive;
    # see the scan-worker policy's own comment. No `ports:` restriction,
    # since it has to cover every port those reach.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- range .Values.networkPolicy.metadataCIDRs }}
              - {{ . | quote }}
              {{- end }}
{{- end }}
