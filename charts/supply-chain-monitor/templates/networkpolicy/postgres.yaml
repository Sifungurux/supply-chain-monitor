{{- if .Values.networkPolicy.enabled }}
# Postgres holds every artifact, finding and stage-history row in this
# deployment, and nothing else in the namespace has any business
# connecting to it. Ingress-only: what postgres itself may reach is not
# interesting (it initiates nothing), but who may reach postgres is.
#
# Deliberately NOT allowing kubelet ingress the way monitor-api's policy
# has to: postgres's probes are `exec` (pg_isready inside the
# container), so they generate no network traffic and are unaffected by
# this. Checked, not assumed -- an httpGet/tcpSocket probe here would
# have been dropped and crash-looped the database.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: scm-postgres-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.monitorApi.postgres.service }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Values.monitorApi.postgres.service }}
  policyTypes: [Ingress]
  ingress:
    - from:
        # The application itself.
        - podSelector:
            matchLabels:
              app: monitor-api
        # The backup CronJob (pg_dump | gzip into the backups PVC) and
        # any one-off backup Job created from the same template -- both
        # carry this label.
        - podSelector:
            matchLabels:
              app: scm-postgres-backup
        # Restores, which do NOT share the backup label -- they are a
        # separate Job template (cluster/postgres-restore-job.template.yaml).
        # This comment previously claimed they came through the backup
        # entry above; they did not, and that template carried no labels
        # at all, so every restore was denied from the day these policies
        # were created until it was finally exercised.
        - podSelector:
            matchLabels:
              app: scm-postgres-restore
        # The retention CronJob (`monitor-api prune`), which connects
        # straight to Postgres rather than through the API.
        #
        # It was missing here from the day it was added. Nobody noticed
        # because retention.enabled defaults to false, so it has never
        # run -- which is the same shape as the restore entry above:
        # denied since the policies were created, invisible until
        # somebody finally exercised it. See the check in
        # cluster/check-helm-manifests.sh that now makes this class of
        # omission fail the build instead of waiting for an outage.
        - podSelector:
            matchLabels:
              app: scm-prune
        # The KEV/EPSS refresh CronJob (`monitor-api enrich-refresh`),
        # which writes bulk reference data straight to Postgres.
        - podSelector:
            matchLabels:
              app: scm-enrich-refresh
      ports:
        - protocol: TCP
          port: {{ .Values.monitorApi.postgres.port | int }}
{{- end }}
