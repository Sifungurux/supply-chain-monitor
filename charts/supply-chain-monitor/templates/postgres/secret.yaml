apiVersion: v1
kind: Secret
metadata:
  # Hard-coded name -- monitor-api's own templates
  # (templates/monitor-api/deployment.yaml) read this exact Secret name
  # via secretKeyRef, so it can't be templated with the release name
  # without also updating that reference.
  name: scm-postgres-credentials
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgres.credentials.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.credentials.password | quote }}
  POSTGRES_DB: {{ .Values.postgres.credentials.db | quote }}
