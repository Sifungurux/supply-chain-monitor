apiVersion: apps/v1
kind: Deployment
metadata:
  name: scm-registry
  namespace: {{ .Release.Namespace }}
  labels:
    app: scm-registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scm-registry
  template:
    metadata:
      labels:
        app: scm-registry
    spec:
      # Non-root: the registry writes only to its PVC, and this PVC is
      # empty on a fresh install (verified: 0 bytes on the live cluster),
      # so there is no root-owned data to migrate. fsGroup makes the
      # volume group-writable for 65534 at mount time, which is what lets
      # a non-root registry create its own directory tree under
      # /var/lib/registry.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      containers:
        - name: registry
          image: "{{ .Values.registry.image.repository }}:{{ .Values.registry.image.tag }}"
          imagePullPolicy: {{ .Values.registry.image.pullPolicy }}
          ports:
            - containerPort: 5000
            - name: debug
              containerPort: 5001
          env:
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: {{ .Values.registry.deleteEnabled | quote }}
            # Distribution's separate debug listener, unauthenticated
            # regardless of REGISTRY_AUTH_TOKEN_* below -- switched to
            # ahead of registry-auth landing, since GET /v2/ on the main
            # listener correctly starts 401ing unauthenticated requests
            # once that's wired up (in fact that's the standard way to
            # verify auth is actually working), which would otherwise
            # take the readiness/liveness probes down with it.
            - name: REGISTRY_HTTP_DEBUG_ADDR
              value: ":5001"
            # Enables Docker Registry Token Authentication -- once these
            # four are set, every /v2/ request needs a valid Bearer token
            # from scm-docker-auth (templates/docker-auth/), which issues
            # read/read-write/admin-scoped tokens per account (see
            # docs/architecture.md's registry-auth section). REALM points
            # at docker_auth's own /auth endpoint over plain HTTP -- the
            # token spec doesn't require this leg to be TLS, matching
            # every other registry-facing tool in this project.
            - name: REGISTRY_AUTH_TOKEN_REALM
              value: {{ printf "%s://scm-docker-auth.%s.svc.cluster.local:%v/auth" (ternary "https" "http" .Values.registry.tls.enabled) .Release.Namespace .Values.dockerAuth.service.port | quote }}
            - name: REGISTRY_AUTH_TOKEN_SERVICE
              value: "scm-registry"
            # Must match dockerAuth.tokenIssuer exactly -- docker_auth
            # rejects any token whose "iss" claim doesn't match its own
            # token.issuer, and the registry rejects any token whose
            # "iss" doesn't match this.
            - name: REGISTRY_AUTH_TOKEN_ISSUER
              value: {{ .Values.dockerAuth.tokenIssuer | quote }}
{{- if .Values.registry.tls.enabled }}
            # Serves HTTPS on the SAME port (5000): distribution switches
            # the existing listener to TLS rather than opening a second
            # one, so Service, NodePort and REGISTRY_ADDR are unchanged --
            # only the scheme differs. The debug listener (5001) stays
            # plain HTTP and is what the probes below use, so enabling
            # this cannot break readiness.
            - name: REGISTRY_HTTP_TLS_CERTIFICATE
              value: /tls/tls.crt
            - name: REGISTRY_HTTP_TLS_KEY
              value: /tls/tls.key
{{- end }}
            - name: REGISTRY_AUTH_TOKEN_ROOTCERTBUNDLE
              value: "/auth-certs/tls.crt"
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
            # Only the public cert (see the volume's `items:` below) --
            # the registry only ever needs to verify token signatures,
            # never sign anything itself, so it has no reason to see
            # scm-docker-auth-signing's private key file at all.
            - name: auth-certs
              mountPath: /auth-certs
{{- if .Values.registry.tls.enabled }}
            - name: tls
              mountPath: /tls
              readOnly: true
{{- end }}
              readOnly: true
          readinessProbe:
            httpGet:
              path: /debug/health
              port: 5001
            initialDelaySeconds: 3
          livenessProbe:
            httpGet:
              path: /debug/health
              port: 5001
            initialDelaySeconds: 5
          resources:
            {{- toYaml .Values.registry.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: scm-registry-data
{{- if .Values.registry.tls.enabled }}
        - name: tls
          secret:
            secretName: scm-registry-tls
{{- end }}
        - name: auth-certs
          secret:
            secretName: scm-docker-auth-signing
            items:
              - key: tls.crt
                path: tls.crt
