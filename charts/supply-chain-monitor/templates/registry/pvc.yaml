apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  # Hard-coded name (not templated with the Helm release name) on
  # purpose: this project's other tooling (Makefile, docs, scripts)
  # already refers to scm-registry-data by this exact name, and there's
  # only ever one release of this chart in the cluster.
  name: scm-registry-data
  namespace: {{ .Release.Namespace }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.registry.persistence.size }}
