# Default values for the whole supply-chain-monitor application -- one
# flattened chart, replacing the previous 5 separate per-service charts
# (registry/clamav/postgres/monitor-api/dashboard). See
# docs/architecture.md, "A single chart for the whole application", for
# why. Every key below is namespaced by service (registry.*, clamav.*,
# postgres.*, monitorApi.*, dashboard.*, gateway.*) purely to avoid
# collisions now that they all live in one values file -- nothing here
# changes what actually gets deployed versus the old per-chart defaults.
# Flux's HelmRelease (k8s/releases/supply-chain-monitor-helmrelease.yaml)
# can override any of these via its own spec.values; a plain `helm
# install -f my-values.yaml` works the same way outside Flux.

registry:
  image:
    repository: registry
    # 3.x is the CNCF distribution/distribution successor to Docker's
    # own registry:2, same project, same env-var-driven config
    # convention this deployment already relies on
    # (REGISTRY_STORAGE_DELETE_ENABLED below) -- verified breaking
    # changes between 2 and 3 (default config path, S3-driver path-style
    # default, explicit token-signing-algorithm declaration) are all
    # irrelevant here: no mounted config file, filesystem storage
    # driver, not S3. See docs/architecture.md's registry-auth section
    # for the token-auth wiring this version enables.
    tag: "3"
    pullPolicy: IfNotPresent
  # REGISTRY_STORAGE_DELETE_ENABLED=true is needed for anything that ever
  # deletes a tag/manifest (not exercised by this project's own tooling
  # today, but cheap to leave on for a throwaway dev registry).
  deleteEnabled: true
  persistence:
    size: 5Gi
  service:
    # NodePort so the registry is reachable from outside the cluster too
    # (oras/docker pushing test images from your own machine, not just
    # from inside a pod) -- matches how this project has always run it.
    type: NodePort
    port: 5000
    nodePort: 30500
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# dockerAuth runs cesanta/docker_auth, a token-authentication server for
# the Docker Registry Token Authentication spec -- reused rather than
# hand-rolled (a small, actively maintained, purpose-built project for
# exactly this) to get real read/read-write/admin role separation for
# scm-registry, which htpasswd-style basic auth can't express (it only
# authenticates identity, with no notion of pull vs push vs delete). See
# docs/architecture.md's registry-auth section for the full design.
dockerAuth:
  image:
    repository: cesanta/docker_auth
    # v1.14.0+ is required for registry:3 compatibility -- it added
    # disableLegacyKeyId/JWK-thumbprint support for registry v3's
    # changed JWT `kid` handling (see cesanta/docker_auth#386).
    tag: "1.14.0"
    pullPolicy: IfNotPresent
  service:
    port: 5001
  # Must match registry.deployment's REGISTRY_AUTH_TOKEN_ISSUER exactly
  # -- the registry rejects any token whose "iss" claim doesn't match.
  tokenIssuer: scm-docker-auth
  tokenExpirationSeconds: 900
  # true because this deployment runs registry:3 (JWK-thumbprint key
  # IDs) -- flip to false only if registry.image.tag is ever rolled
  # back to a 2.x. See cesanta/docker_auth#386.
  disableLegacyKeyId: true
  # Three static accounts, one flat ACL rule each matching every
  # repository (docker_auth's match.name defaults to "any" when
  # omitted) -- this is a single shared registry with no multi-tenant
  # repo namespacing today, so per-repo scoping would be pure
  # unused flexibility. Add a `name:` pattern per account later if that
  # ever changes. Passwords are dev-only cleartext placeholders, same
  # convention as postgres.credentials.password above -- change before
  # this points at anything shared. Hashed into docker_auth's config via
  # Sprig's `bcrypt` template function at render time; the rendered
  # Secret only ever holds the bcrypt hash, never the cleartext value
  # below.
  accounts:
    reader:
      username: scm-reader
      password: changeme-reader
    writer:
      username: scm-writer
      password: changeme-writer
    admin:
      username: scm-admin
      password: changeme-admin
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

clamav:
  image:
    repository: clamav/clamav
    tag: 1.5-debian13-slim
    pullPolicy: IfNotPresent
  # Each replica independently freshclams its own virus DB (no shared
  # storage between pods -- see deployment.yaml's comment), so this is
  # safe to raise under concurrent scan load without any other change:
  # scm-clamav's Service already load-balances clamd connections across
  # however many pods are running. Raise this if malware scans start
  # queuing up behind clamd (each scan holds one clamd connection for
  # its duration) faster than a single instance can keep up.
  replicas: 6
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi
  # First boot downloads the virus DB (freshclam) and can take a few
  # minutes -- these generous probe settings are why.
  readiness:
    initialDelaySeconds: 60
    periodSeconds: 15
    failureThreshold: 20
  liveness:
    initialDelaySeconds: 90
    periodSeconds: 30

postgres:
  image:
    repository: percona/percona-distribution-postgresql
    tag: "17.10"
    pullPolicy: IfNotPresent
  credentials:
    user: monitor_api
    db: monitor_api
    # Dev-only placeholder -- change this (and switch to a real
    # secret-management flow, e.g. sealed-secrets or an
    # external-secrets operator) before this points at anything shared.
    # Override via this HelmRelease's spec.values, never commit a real
    # password here.
    password: changeme123
  persistence:
    size: 5Gi
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 768Mi
  backup:
    enabled: true
    schedule: "0 2 * * *" # daily at 02:00 UTC
    keepBackups: 7
    persistence:
      size: 5Gi
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi

monitorApi:
  image:
    repository: monitor-api
    tag: dev
    pullPolicy: IfNotPresent
  listenAddr: ":8080"
  pipelineStages: "source,build,test,scan,sign,publish,deploy"
  # Service name + port only -- templates/monitor-api/configmap.yaml
  # builds the full in-cluster FQDN using .Release.Namespace, so these
  # stay correct regardless of which namespace this chart is installed
  # into.
  clamav:
    service: scm-clamav
    port: "3310"
  registry:
    service: scm-registry
    port: "5000"
  # password deliberately isn't set here -- it comes from
  # scm-postgres-credentials (templates/postgres/secret.yaml) via
  # templates/monitor-api/deployment.yaml's secretKeyRef, never a
  # plaintext value in the ConfigMap.
  postgres:
    service: scm-postgres
    port: "5432"
    user: "monitor_api"
    db: "monitor_api"
    sslmode: "disable"
    # pgxpool connection pool sizing (see main.go's buildPostgresDSN and
    # docs/architecture.md's Postgres pool tuning fix). Left unset (0,
    # meaning "don't override") by default when running the binary
    # outside this chart -- but the chart itself sets deliberate values
    # here rather than leaving pgxpool's own CPU-derived default
    # (max(4, NumCPU*4)) in place, since that number has no relationship
    # to Postgres's own max_connections or to how many other things
    # (other monitor-api replicas, if this ever scales beyond one) share
    # it. 10/2 is comfortable headroom for a single monitor-api replica
    # against Percona's default max_connections without leaving the
    # connection count to chance -- raise maxConns if this chart is ever
    # scaled to more than one monitor-api replica.
    pool:
      maxConns: 10
      minConns: 2
  # Dev-only API key for monitor-api's shared-key auth (see
  # internal/api/router.go's withAuth). Generate a real random value
  # (e.g. `openssl rand -hex 32`) and override it via this HelmRelease's
  # spec.values before this points at anything shared -- same caveat as
  # postgres.credentials.password.
  apiKey: qwe4r56789009876543223456789
  # unpacker (github.com/Sifungurux/unpacker) pull settings, forwarded
  # into the env of each per-scan Kubernetes Job monitor-api creates.
  # Defaults assume a local, unauthenticated, plain-HTTP dev registry
  # (scm-registry) -- tighten before pointing this at anything else.
  unpacker:
    insecure: "true"
    public: "true"
    maxFileMB: "100"
  # Almost always the same image monitor-api itself runs from, since
  # `monitor-api scan-worker` is the same binary in a different mode.
  # Left unset here so the template defaults it to
  # monitorApi.image.repository:monitorApi.image.tag -- override only
  # if the scan-worker really needs to run a different image/tag.
  scanWorkerImage: ""
  # Kept off by default: most of the time the only thing worth watching
  # is a scan's pass/fail result, not trivy's or unpacker's own
  # step-by-step progress. Set verboseLogs: true to make every
  # scan-worker Job's pod logs (kubectl logs on the Job's pod, or
  # `kubectl logs -l job-name=<name>`) also show trivy's own progress
  # output (drops --quiet for --debug) and unpacker's own oras/crane
  # pull messages as they happen, on top of the final findings/error --
  # useful for diagnosing a scan that's slow, silently stuck, or failing
  # in a way the final error alone doesn't explain. See
  # docs/architecture.md ("Verbose scan-worker logging") and main.go's
  # runScanWorker/scanner.VerboseScanLogs.
  scanWorker:
    verboseLogs: false
    # How long Kubernetes lets a scan-worker Job's pod run (both the
    # unpacker and trivy Job shapes) before killing it outright. 600s
    # (10m) is generous headroom for alpine/busybox-sized images but can
    # be too tight for a heavier one (more OS packages for trivy to
    # walk/query -- e.g. mysql/postgres-sized images) once real-world
    # scheduling delay and CPU contention from concurrent scans are added
    # on top of the scan itself -- symptom: "timed out waiting for
    # [trivy/unpacker] scan job to complete: context deadline exceeded"
    # for specific (usually larger) images under load, even though
    # nothing is actually stuck. Raise this if that shows up in your own
    # `make load-test-clamav` runs. Must stay below
    # monitorApi.scanTimeoutSeconds below -- main.go's runAPIServer
    # refuses to start otherwise (see that value's own comment).
    activeDeadlineSeconds: 600
    # Lets an "image"-mode trivy scan-worker Job upload a generated
    # SBOM/SARIF document back to this Service once it's done scanning
    # (see internal/scanner/isolated_trivy.go's IsolatedTrivyConfig.APIBaseURL
    # and documents.go) -- "monitor-api" is this chart's own Service name/
    # port (templates/monitor-api/service.yaml), reachable from any pod in
    # the same namespace via cluster DNS. Empty disables document capture
    # entirely (findings are unaffected either way) -- e.g. for a
    # deployment where a NetworkPolicy blocks the scan-worker Job from
    # reaching the API server pod.
    apiBaseURL: "http://monitor-api:8080"
  # The API handler's own overall per-scan budget (every scanner
  # registered for one artifact type shares this -- see
  # internal/api/handlers.go's scanArtifact) -- kept comfortably above
  # scanWorker.activeDeadlineSeconds above (60s of margin by default) so
  # this handler doesn't give up and report a scan as timed out before
  # Kubernetes' own activeDeadlineSeconds would even have killed a
  # genuinely stuck Job. Raise both together, keeping this one larger, if
  # you raise scanWorker.activeDeadlineSeconds.
  scanTimeoutSeconds: 660
  # false here (the real in-cluster deployment, which has the
  # ServiceAccount token isolation needs). true is only ever meant for
  # running the monitor-api binary standalone outside Kubernetes -- see
  # README, "Running monitor-api outside a Kubernetes pod". Never set
  # this true here without also accepting image malware scanning moving
  # back in-process for real.
  disableScanIsolation: false
  # oras pull settings for file/sbom/sarif artifacts registered by OCI
  # reference. true matches unpacker.insecure/unpacker.public's same
  # plain-HTTP assumption.
  fetchPlainHTTP: "true"
  # A real policy change, not a quiet default: false preserves today's
  # behavior exactly (expected_digest on POST /api/v1/artifacts is
  # optional, checked only if provided, and a mismatch refuses the whole
  # registration with 409). true makes expected_digest a required field
  # on every registration -- and, unlike the 409 above, a mismatch (or an
  # unresolvable ref) no longer refuses registration outright; it
  # registers the artifact with unsafe: true instead, so a deployment can
  # turn this on without an existing pipeline's registrations suddenly
  # starting to fail outright. See docs/architecture.md ("Requiring a
  # verified digest at registration").
  requireDigest: false
  # Uncomment (and set enabled: true) for air-gapped operation -- see
  # cluster/seed-trivy-db.sh and README's "Air-gapped operation".
  trivyDB:
    enabled: false
    repository: ""
    javaRepository: ""
    skipUpdate: "true"
    skipJavaUpdate: "true"
  # Selects which CVE scanner(s) actually run for `image`/`sbom`
  # artifacts: "trivy" (default -- identical behavior to every
  # deployment before this key existed), "grype", or "both" (findings
  # from a CVE both tools agree on merge into one, with a joined
  # Source -- see internal/artifact/merge.go's CoalesceSameIDSources).
  # "grype"/"both" also turn on grype-db-cache-primer-job.yaml/
  # grype-db-refresh-cronjob.yaml below, since grype then actually
  # needs a warm DB to read.
  cveScanner: "trivy"
  # Operator-configured pluggable scanners -- plug in a different CVE
  # scanner (Grype, OSV-Scanner, ...) or SBOM tool alongside (never
  # instead of -- registration is additive) the built-in trivy/ClamAV
  # scanners, with no Go code change here. monitor-api runs this
  # command itself, in-cluster -- for recording results a scan already
  # produced somewhere else entirely (a CI pipeline, a different
  # system), see POST /api/v1/artifacts/{id}/findings instead (README,
  # "Submitting findings from an external scanner"). Each entry's
  # `command` must already be present in the monitor-api image (build a
  # derived image FROM this one that adds it -- this project's own
  # Dockerfile can't bake in every possible third-party scanner) and,
  # when run with `args` (each occurrence of the literal string
  # "{{ref}}" is replaced with the actual artifact ref/local path being
  # scanned), must print a JSON array of findings on stdout:
  #   [{"id":"CVE-2024-1234","severity":"high","title":"...","source":"grype","category":"cve"}, ...]
  # "source" and "category" are both optional per finding -- they fall
  # back to this entry's own `name`/`category` when a finding's own
  # JSON omits them. See docs/architecture.md ("Pluggable scanners")
  # and README for the full contract plus a worked example (wiring
  # Grype in via a small shim script).
  #
  # pluggableScanners:
  #   - name: grype
  #     artifactTypes: ["image"]
  #     command: grype-to-findings.sh   # a shim script, not grype itself -- see README
  #     args: ["{{ref}}"]
  #     category: cve
  #     timeoutSeconds: 300
  pluggableScanners: []
  # Per-API-key request throttling (see internal/api/ratelimit.go and
  # router.go's withRateLimit) -- protects the scan pipeline/database
  # from one caller (buggy client, compromised key, runaway retry loop)
  # overwhelming them with requests. requestsPerSecond <= 0 disables
  # rate limiting entirely -- the default, since not every deployment
  # needs it (e.g. a small cluster with one trusted CI caller). burst
  # is how many requests can land back-to-back before the sustained
  # rate kicks in; it should comfortably cover a normal dashboard
  # refresh or a small CI batch, not just a single request.
  rateLimit:
    requestsPerSecond: 0
    burst: 20
  # The shared PersistentVolumeClaim IsolatedTrivyScanner mounts
  # read-only into every trivy scan-worker Job, kept warm by
  # trivy-db-cache-primer-job.yaml (install/upgrade time) and
  # trivy-db-refresh-cronjob.yaml (on refreshSchedule thereafter) --
  # see docs/architecture.md, "Isolating Trivy scanning". Independent
  # of trivyDB above (that config is about which upstream/mirror
  # repository to pull *from*; this is about the shared on-disk cache
  # every isolated scan-worker Job actually reads).
  trivyCache:
    pvcName: scm-trivy-db-cache
    mountPath: /trivy-cache
    persistence:
      # trivy's vulnerability DB + Java DB together are typically a few
      # hundred MB -- 2Gi is generous headroom on top of that, cheap on
      # a local-path StorageClass.
      size: 2Gi
    # Offset from postgres.backup.schedule's 02:00 so the two don't
    # contend for disk/CPU on a single-node dev cluster at the same
    # moment.
    refreshSchedule: "0 3 * * *" # daily at 03:00 UTC
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 768Mi
  # The shared PersistentVolumeClaim IsolatedGrypeScanner mounts
  # read-only into every grype scan-worker Job -- grype's own
  # counterpart to trivyCache above, kept warm by
  # grype-db-cache-primer-job.yaml/grype-db-refresh-cronjob.yaml, both
  # of which are inert (never scheduled) unless cveScanner is "grype"
  # or "both".
  grypeCache:
    pvcName: scm-grype-db-cache
    mountPath: /grype-cache
    persistence:
      # grype's vulnerability DB alone (no separate Java DB the way
      # trivy has) is typically a few hundred MB -- same 2Gi headroom
      # as trivyCache for consistency.
      size: 2Gi
    # Offset from both postgres.backup.schedule (02:00) and
    # trivyCache.refreshSchedule (03:00) so none of the three contend
    # for disk/CPU on a single-node dev cluster at the same moment.
    refreshSchedule: "0 4 * * *" # daily at 04:00 UTC
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 768Mi
  # Periodically scans artifacts still sitting at status "registered"
  # (registered but never scanned) -- see templates/monitor-api/
  # sweep-registered-cronjob.yaml and main.go's runSweepRegistered.
  # batchSize is deliberately capped, not "scan everything registered":
  # a burst of bulk-registered artifacts (see the bulk endpoint) could
  # otherwise turn one CronJob run into hundreds of concurrent-ish scans
  # competing with real usage -- oldest-registered-first, so a backlog
  # bigger than one batch works through fairly across successive runs
  # instead of the same few artifacts winning every time. Every swept
  # scan also opportunistically backfills a missing digest (the same
  # best-effort resolution registration itself attempts, retried here in
  # case a rate-limited/unreachable registry blocked it the first time --
  # see resolveDigest's own comment in internal/api/handlers.go).
  sweep:
    enabled: true
    schedule: "*/15 * * * *" # every 15 minutes
    batchSize: 5
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi
  resources:
    # ephemeral-storage right-sized down: unpacking a container image no
    # longer happens in this pod -- it runs in its own per-scan
    # Kubernetes Job, with its own separate ephemeral-storage limit.
    # Memory stays bumped: trivy's first-run DB download+decompression
    # is memory-hungry enough that a "trivy scan failed ...: signal:
    # killed" error can be an OOM-kill.
    requests:
      cpu: "200m"
      memory: "384Mi"
      ephemeral-storage: "256Mi"
    limits:
      cpu: "1"
      memory: "1Gi"
      ephemeral-storage: "2048Mi"

dashboard:
  image:
    repository: nginx
    tag: 1.27-alpine
    pullPolicy: IfNotPresent
  # Left empty by default: the dashboard already self-derives the right
  # API address from window.location (same host it was loaded from, port
  # 30300), so it works unmodified on both the colima and podman
  # runtimes -- see docs/architecture.md, "A shipped bug, and what it
  # changed." Set this only if that self-detection is wrong for your
  # setup (e.g. a fixed ingress hostname that differs from the
  # dashboard's own).
  apiBase: ""
  # Gates the dashboard's "+ Register an artifact" link -- false by
  # default (fail-closed, the same posture digest pinning/maintainer
  # validation already take elsewhere in this codebase): a real
  # pipeline registers artifacts via the API directly as they're
  # built, so ad-hoc manual registration through the dashboard is an
  # extra, bypassable path a deployment may not want exposed at all.
  # Set to true to show the link (opens a small modal with the
  # existing register form) -- false hides it completely, not just
  # disables it, so there's no dead-end UI for a deployment that
  # never wants this.
  allowManualRegistration: false
  # Shows the API base/key fields, the Refresh button, and the connection
  # status text in the header -- true by default (a display preference,
  # not a security gate like allowManualRegistration above, so it stays
  # visible unless a deployment opts out). Hiding it doesn't disable
  # anything: the dashboard still auto-refreshes every 10s and still
  # picks up the API base/key from env.js, it just removes the manual
  # override escape hatch (see docs/architecture.md, "Configuring the
  # dashboard via ConfigMap/Secret instead of by hand") from the UI for
  # deployments that never want a person changing it from the browser.
  showConnectionSettings: true
  service:
    nodePort: 30301
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 64Mi

# Gateway API "skeleton": GatewayClass + Gateway + HTTPRoute routing to
# the dashboard, all owned by this chart. Traefik itself -- the ingress
# controller these attach to -- is deliberately separate (see
# k8s/releases/traefik-helmrelease.yaml); this chart only owns the
# routing objects, matching this project's general preference for
# explicit, hand-written resources over relying on a controller chart's
# own default-object convenience behavior (Traefik's chart could create
# a default GatewayClass itself, but that's turned off in favor of this).
gateway:
  # Name of the GatewayClass this chart creates, and the name the
  # Gateway below references via gatewayClassName.
  gatewayClassName: traefik
  # Must match Traefik's actual controller identity -- see
  # k8s/releases/traefik-helmrelease.yaml and
  # https://doc.traefik.io/traefik/routing/providers/kubernetes-gateway/
  controllerName: traefik.io/gateway-controller
  # 8000, not 80 -- must match one of Traefik's actual EntryPoint ports,
  # not the externally-exposed NodePort (30080). See
  # templates/gateway/gateway.yaml's own comment for the full story
  # (this exact mismatch caused a real "404 page not found" on first
  # deploy).
  listenerPort: 8000
