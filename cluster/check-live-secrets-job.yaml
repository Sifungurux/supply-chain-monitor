# Proves the credentials that leaked in git history are DEAD on a live
# cluster -- run by cluster/check-live-secrets.sh (`make
# check-live-secrets`), not part of `kubectl apply -k k8s/`.
#
# THE CONTRACT IS INVERTED, and everything here depends on reading it
# the right way round: a Job that COMPLETES means the old credential
# was REFUSED. A Job that fails means it still works.
#
# Why this needs to exist at all. Rotation was done and documented, but
# nothing ever confirmed it took, and Postgres has a failure mode that
# makes "documented" insufficient: it reads POSTGRES_PASSWORD only on
# initdb against an empty volume. Rotate the Secret without the
# ALTER ROLE step (cluster/chart-secrets.sh spells it out) and the OLD
# password stays valid indefinitely, while the Secret, the dashboard,
# every log line and every Flux reconcile look completely healthy.
#
# THREE OUTCOMES, NEVER TWO. "Could not reach it" must never be
# reported as "it is safe" -- that conflation is how this project got a
# backup that exited 0 on empty files for three days. So:
#
#   exit 0  the credential was actively REFUSED -- this is the pass
#   exit 1  the credential was ACCEPTED -- it is still live
#   exit 2  INCONCLUSIVE -- unreachable, timed out, wrong context
#
# which is why the checks below match on the specific refusal (a
# "password authentication failed" message, a literal 401) rather than
# treating any non-success as proof of anything.
apiVersion: batch/v1
kind: Job
metadata:
  name: scm-check-leaked-postgres
  namespace: supply-chain-monitor
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 60
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: check
          # The same image the backup-listing Job already uses, so this
          # check pulls nothing new onto the cluster.
          image: percona/percona-distribution-postgresql:17.10
          env:
            - name: PGPASSWORD
              value: "PLACEHOLDER_PG_PASSWORD"
            - name: PGCONNECT_TIMEOUT
              value: "10"
          command:
            - sh
            - -c
            - |
              out=$(psql -h scm-postgres -p 5432 -U monitor_api -d monitor_api \
                      -tAc 'select 1' 2>&1) && rc=0 || rc=$?

              if [ "$rc" -eq 0 ]; then
                echo "FAIL: the leaked Postgres password STILL AUTHENTICATES."
                echo "      Rotating the Secret is not enough -- Postgres only reads"
                echo "      POSTGRES_PASSWORD on initdb against an empty volume. Run the"
                echo "      ALTER ROLE step printed by cluster/chart-secrets.sh, then"
                echo "      restart monitor-api."
                exit 1
              fi

              # The ONLY output that proves the credential is dead. Any
              # other failure means the check never got to ask.
              if echo "$out" | grep -qi "password authentication failed"; then
                echo "ok: the leaked Postgres password is refused."
                exit 0
              fi

              echo "INCONCLUSIVE: could not determine whether the leaked password works."
              echo "      psql exited ${rc} without an authentication verdict, so this is"
              echo "      NOT a pass. Raw output:"
              echo "$out"
              exit 2
---
apiVersion: batch/v1
kind: Job
metadata:
  name: scm-check-leaked-apikey
  namespace: supply-chain-monitor
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 60
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: check
          image: curlimages/curl:8.11.1
          env:
            - name: LEAKED_KEY
              value: "PLACEHOLDER_API_KEY"
          command:
            - sh
            - -c
            - |
              # In-cluster rather than through a port-forward: this is the
              # path the app's own clients take, and it needs no tunnel to
              # be flaky. Deliberately NOT the monitor-api image, whose
              # BusyBox wget silently ignores flags it does not know.
              #
              # -k because monitorApi.tls serves a PRIVATE CA and the
              # question here is "is this key refused", not "is this
              # certificate trusted". Scheme is probed rather than
              # assumed, since monitorApi.tls.enabled moves it.
              for base in "https://monitor-api:8080" "http://monitor-api:8080"; do
                code=$(curl -k -s -o /dev/null -m 10 -w '%{http_code}' \
                  -H "Authorization: Bearer ${LEAKED_KEY}" \
                  "${base}/api/v1/artifacts") || continue
                [ "$code" = "000" ] && continue

                if [ "$code" = "401" ]; then
                  echo "ok: the leaked API key is refused (401) at ${base}."
                  exit 0
                fi
                echo "FAIL: the leaked API key returned HTTP ${code} at ${base}, not 401."
                echo "      Anything other than 401 means that credential still resolves"
                echo "      to a client. Rotate it with cluster/chart-secrets.sh."
                exit 1
              done

              echo "INCONCLUSIVE: monitor-api could not be reached over http or https."
              echo "      This is NOT a pass -- the key was never actually presented."
              exit 2
