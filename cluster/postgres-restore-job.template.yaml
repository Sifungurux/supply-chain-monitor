# Template for cluster/postgres-restore.sh (`make db-restore
# BACKUP=...`) -- __BACKUP_FILE__ is substituted with the real
# filename via `sed` before this is applied. Not part of `kubectl
# apply -k k8s/` (not in k8s/kustomization.yaml): this is a one-off,
# destructive, on-demand operation, never something a normal deploy
# should run.
apiVersion: batch/v1
kind: Job
metadata:
  name: scm-postgres-restore
  namespace: supply-chain-monitor
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      # REQUIRED, not decorative: scm-postgres-ingress admits only
      # labelled pods, so without this the restore is denied at the
      # network layer and fails with "Connection refused" -- which reads
      # like a dead database rather than a policy decision.
      #
      # The policy's own comment used to claim restores were already
      # covered by the backup label. They were not: this template set no
      # labels at all, so every restore since the policies were created
      # would have failed. See templates/networkpolicy/postgres.yaml.
      labels:
        app: scm-postgres-restore
    spec:
      restartPolicy: Never
      containers:
        - name: restore
          image: percona/percona-distribution-postgresql:17.10
          command: ["sh", "-c"]
          args:
            - |
              # pipefail matters here for the same reason it did in the
              # backup job: without it "gunzip | psql" reports PSQL's
              # exit status, so a truncated or corrupt archive can feed
              # psql a partial stream and still finish "successfully".
              # A restore that silently half-applies is worse than one
              # that fails, because it is discovered later.
              set -euo pipefail
              export PGPASSWORD="$POSTGRES_PASSWORD"
              BACKUP_FILE="__BACKUP_FILE__"
              SRC="/backups/${BACKUP_FILE}"
              PASS_ARGS=""
              echo "restoring ${BACKUP_FILE} into ${POSTGRES_DB}@${POSTGRES_HOST} -- this overwrites existing data"

              # The .gpg suffix is the whole protocol. The backup job
              # names encrypted output .sql.gz.gpg, so nothing has to
              # be remembered or passed in about how a given file was
              # written -- the filename says it.
              case "$BACKUP_FILE" in
                *.gpg)
                  if [ ! -f /etc/scm-backup-decryption/privatekey.asc ]; then
                    echo "ERROR: ${BACKUP_FILE} is encrypted, but no private key was supplied." >&2
                    echo "ERROR: re-run with GPG_PRIVATE_KEY_FILE=/path/to/privatekey.asc --" >&2
                    echo "ERROR:   make db-restore BACKUP=${BACKUP_FILE} GPG_PRIVATE_KEY_FILE=..." >&2
                    echo "ERROR: nothing was written to ${POSTGRES_DB}." >&2
                    exit 1
                  fi
                  export GNUPGHOME=/tmp/gnupg
                  mkdir -p "$GNUPGHOME" && chmod 700 "$GNUPGHOME"
                  if [ -s /etc/scm-backup-decryption/passphrase ]; then
                    PASS_ARGS="--pinentry-mode loopback --passphrase-file /etc/scm-backup-decryption/passphrase"
                  fi
                  gpg --batch --quiet --no-options $PASS_ARGS \
                      --import /etc/scm-backup-decryption/privatekey.asc
                  echo "private key imported (this pod, this run -- see cluster/postgres-restore.sh)"
                  ;;
              esac

              # decrypt() is the identity function for a plaintext
              # backup, so every line below is written once.
              decrypt() {
                case "$BACKUP_FILE" in
                  *.gpg) gpg --batch --quiet --no-options $PASS_ARGS --decrypt "$SRC" ;;
                  *)     cat "$SRC" ;;
                esac
              }

              # Refuse an archive that is not a readable dump BEFORE
              # touching the database. gzip -t alone is not enough: an
              # empty gzip is perfectly valid, and that is exactly what
              # the backup job produced for three days while reporting
              # success.
              #
              # gpg's stderr is captured rather than discarded so a
              # WRONG KEY can be reported as a wrong key. Folding it
              # into "not a readable PostgreSQL dump" would send an
              # operator looking for a corrupt backup during an
              # outage, when the backup is fine and the key is not.
              #
              # It is only ever read when the check has already
              # failed, so the harmless SIGPIPE noise gpg emits when
              # `head` closes the pipe early on a SUCCESSFUL read is
              # never mistaken for an error.
              head_bytes="$(decrypt 2>/tmp/decrypt.err | gunzip -c 2>/dev/null | head -c 512 || true)"
              case "$head_bytes" in
                *"PostgreSQL database dump"*) ;;
                *)
                  if [ -s /tmp/decrypt.err ]; then
                    echo "ERROR: could not DECRYPT ${SRC} -- this is a key problem, not a corrupt backup." >&2
                    echo "ERROR: gpg said:" >&2
                    sed 's/^/ERROR:   /' /tmp/decrypt.err >&2
                  else
                    echo "ERROR: ${SRC} is not a readable PostgreSQL dump." >&2
                  fi
                  echo "ERROR: nothing was written to ${POSTGRES_DB}." >&2
                  exit 1
                  ;;
              esac

              # If a sidecar exists, the file must match it. Catches
              # bit-rot on the PVC before it is fed to psql rather
              # than halfway through.
              if [ -f "${SRC}.sha256" ]; then
                if ( cd /backups && sha256sum -c --status "${BACKUP_FILE}.sha256" ); then
                  echo "checksum sidecar verified"
                else
                  echo "ERROR: ${SRC} does not match its .sha256 sidecar -- it changed since it was written." >&2
                  echo "ERROR: nothing was written to ${POSTGRES_DB}." >&2
                  exit 1
                fi
              fi

              # WAIT FOR THE NETWORK, not just for Postgres. A new pod's
              # IP is not yet in the CNI's NetworkPolicy allow-set when
              # its container starts, and kube-router REJECTs until it
              # is -- which arrives as "Connection refused" and reads
              # like a dead server.
              #
              # This job connects within a second of starting and has
              # backoffLimit 0, so it lost that race every time: the
              # restore path was broken from the night the policies were
              # created, and nobody would have found out until they
              # needed it.
              echo "waiting for ${POSTGRES_HOST}:5432 to accept connections..."
              ready=""
              for i in $(seq 1 45); do
                if pg_isready -h "$POSTGRES_HOST" -U "$POSTGRES_USER" >/dev/null 2>&1; then
                  ready="yes"
                  echo "reachable after ${i} attempt(s)"
                  break
                fi
                sleep 2
              done
              if [ -z "$ready" ]; then
                echo "ERROR: ${POSTGRES_HOST}:5432 unreachable after 90s -- nothing restored." >&2
                exit 1
              fi

              decrypt | gunzip -c | psql -v ON_ERROR_STOP=1 -h "$POSTGRES_HOST" -U "$POSTGRES_USER" -d "$POSTGRES_DB"
              echo "restore finished."
          env:
            - name: POSTGRES_HOST
              value: scm-postgres.supply-chain-monitor.svc.cluster.local
            # Substituted by cluster/postgres-restore.sh, same as
            # __BACKUP_FILE__ above. Explicit rather than left to
            # libpq's "prefer" default, which quietly falls back to
            # cleartext against a server that has stopped offering
            # TLS -- a restore streams the entire database, so that is
            # the single largest cleartext transfer this system ever
            # makes. Set PGSSLMODE=prefer when restoring into a
            # deployment with postgres.tls.enabled=false.
            - name: PGSSLMODE
              value: "__PGSSLMODE__"
          envFrom:
            - secretRef:
                name: scm-postgres-credentials
          volumeMounts:
            - name: backups
              mountPath: /backups
              readOnly: true
            - name: decryption-key
              mountPath: /etc/scm-backup-decryption
              readOnly: true
      volumes:
        - name: backups
          persistentVolumeClaim:
            claimName: scm-postgres-backups
        # optional: true, because a plaintext restore must still work
        # on a cluster that has never had an encryption key. The
        # script above turns a missing key into a clear error only
        # when the backup actually needs one.
        #
        # This Secret is NOT part of the deployment. It is created by
        # cluster/postgres-restore.sh immediately before this Job and
        # deleted immediately after -- the private key lives on the
        # operator's machine, and the cluster holds it only for the
        # seconds a restore is running. A permanently-mounted private
        # key would give the cluster the ability to read every backup
        # it has ever written, which is the exact property encrypting
        # them was meant to remove.
        - name: decryption-key
          secret:
            secretName: scm-backup-decryption
            optional: true
