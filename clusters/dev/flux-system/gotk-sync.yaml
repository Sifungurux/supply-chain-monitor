# This is the file `flux bootstrap` would normally generate and commit for
# you -- written by hand here instead, because this project installs the
# Flux controllers via the fluxcd-community/flux2 Helm chart (see
# README.md in this directory), and that chart only installs
# controllers/CRDs, not this. Naming it `gotk-sync.yaml` matches what
# bootstrap itself would have called it, so this directory still looks
# like a normal Flux repo to anyone who's used `flux bootstrap` before.
#
# Apply once, right after the Helm install (see README.md for the exact
# sequence): `kubectl apply -k clusters/dev/flux-system/`. This is what
# makes Flux start watching clusters/dev at all -- without the
# Kustomization below, clusters/dev/monitor-api.yaml (and anything else
# added under clusters/dev/ later) just sits in Git, unreconciled, same
# as any other un-watched path.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 1m
  # TODO: replace with the real remote once this project is pushed
  # somewhere Flux's cluster can reach (see docs/architecture.md,
  # "Migrating monitor-api to Flux GitOps" -- this project isn't a Git
  # repository yet).
  url: https://github.com/<your-org-or-user>/supply-chain-monitor.git
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 10m
  path: ./clusters/dev
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 3m
