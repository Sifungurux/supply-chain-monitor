# Flux Kustomization for monitor-api.
#
# This is what actually makes Flux deploy monitor-api -- without this CR,
# k8s/monitor-api/ (and its own kustomization.yaml, see that directory)
# would just sit in Git, unreconciled, exactly like any other manifest
# Flux was never told to watch. See docs/architecture.md, "Migrating
# monitor-api to Flux GitOps", for the full picture including what still
# has to exist before this can go Ready.
#
# Only monitor-api has moved to Flux so far (see k8s/kustomization.yaml's
# top-of-file note) -- everything else in k8s/ (namespace, postgres,
# registry, clamav, dashboard) is still applied the old way, via
# `make deploy` (kubectl apply -k k8s/). That's a real, temporary
# assumption baked into this file: the supply-chain-monitor namespace and
# monitor-api's Postgres/registry/ClamAV dependencies are expected to
# already exist in the cluster by the time this Kustomization reconciles,
# since they aren't (yet) modeled as a Flux dependency this CR can
# dependsOn. If those services also move to Flux later, add a Kustomization
# for them and reference it here via dependsOn instead of relying on
# `make deploy` having already run.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitor-api
  namespace: flux-system
spec:
  interval: 5m
  path: ./k8s/monitor-api
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: supply-chain-monitor
  wait: true
  timeout: 3m
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: monitor-api
      namespace: supply-chain-monitor
