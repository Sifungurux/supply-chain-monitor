apiVersion: apps/v1
kind: Deployment
metadata:
  name: scm-clamav
  namespace: supply-chain-monitor
  labels:
    app: scm-clamav
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scm-clamav
  template:
    metadata:
      labels:
        app: scm-clamav
    spec:
      containers:
        - name: clamav
          image: clamav/clamav:1.5-debian13-slim
          ports:
            - containerPort: 3310
          resources:
            requests:
              cpu: "250m"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
          # first boot downloads the virus DB (freshclam) and can take a few minutes
          readinessProbe:
            tcpSocket:
              port: 3310
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 20
          livenessProbe:
            tcpSocket:
              port: 3310
            initialDelaySeconds: 90
            periodSeconds: 30
