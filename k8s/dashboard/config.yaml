# Optional override for the dashboard's own API address (see
# dashboard/index.html's DEFAULT_API_BASE / window.SCM_CONFIG.apiBase).
# Left empty by default: the dashboard already self-derives the right
# address from window.location (same host it was loaded from, port
# 30300) so it works unmodified on both the colima and podman runtimes
# -- see docs/architecture.md, "A shipped bug, and what it changed."
# Set this only if that self-detection is wrong for your setup (e.g. a
# fixed ingress hostname that differs from the dashboard's own).
apiVersion: v1
kind: ConfigMap
metadata:
  name: scm-dashboard-config
  namespace: supply-chain-monitor
data:
  DASHBOARD_API_BASE: ""
