apiVersion: apps/v1
kind: Deployment
metadata:
  name: scm-dashboard
  namespace: supply-chain-monitor
  labels:
    app: scm-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scm-dashboard
  template:
    metadata:
      labels:
        app: scm-dashboard
    spec:
      automountServiceAccountToken: false
      # The dashboard used to require a person to paste the API key
      # into a browser field by hand -- fine for one person on one
      # laptop, annoying (and easy to get wrong) for anyone else who
      # opens the page. This initContainer renders env.js (a plain
      # `window.SCM_CONFIG = {...}` assignment) from the *same*
      # scm-monitor-api-auth Secret monitor-api itself reads, so the
      # dashboard is pre-configured with a working key with zero manual
      # steps -- see docs/architecture.md ("Configuring the dashboard
      # via ConfigMap/Secret instead of by hand").
      initContainers:
        - name: render-config
          image: nginx:1.27-alpine
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              cp /config-src/index.html /html/index.html
              # Escape backslashes and double quotes so an odd API_KEY
              # or DASHBOARD_API_BASE value can't break out of the JS
              # string literal below -- good enough for this project's
              # scope (a local dev cluster), not a substitute for a
              # real templating engine if this ever needs to be
              # hardened further.
              ESCAPED_KEY=$(printf '%s' "$API_KEY" | sed 's/\\/\\\\/g; s/"/\\"/g')
              ESCAPED_BASE=$(printf '%s' "$DASHBOARD_API_BASE" | sed 's/\\/\\\\/g; s/"/\\"/g')
              printf 'window.SCM_CONFIG = { apiBase: "%s", apiKey: "%s" };\n' "$ESCAPED_BASE" "$ESCAPED_KEY" > /html/env.js
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: scm-monitor-api-auth
                  key: API_KEY
            - name: DASHBOARD_API_BASE
              valueFrom:
                configMapKeyRef:
                  name: scm-dashboard-config
                  key: DASHBOARD_API_BASE
          volumeMounts:
            - name: dashboard-html
              mountPath: /config-src
              readOnly: true
            - name: html
              mountPath: /html
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            # Serves the initContainer's rendered output (index.html +
            # env.js), not the ConfigMap directly -- nginx never sees
            # the Secret itself, only what render-config already
            # wrote into this emptyDir.
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: "25m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "64Mi"
      volumes:
        - name: dashboard-html
          # The ConfigMap's own name (from k8s/dashboard/configmap.yaml,
          # generated from dashboard/index.html) is scm-dashboard-html --
          # this used to say plain "dashboard-html" here, a name that
          # ConfigMap was never actually called, so the pod could never
          # mount this volume at all (a FailedMount in `kubectl describe
          # pod`, not something that shows up as an application error).
          configMap:
            name: scm-dashboard-html
        - name: html
          emptyDir: {}
