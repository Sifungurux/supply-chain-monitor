# This is the file `flux bootstrap` would normally generate and commit for
# you -- written by hand here instead, because this project installs the
# Flux controllers via the fluxcd-community/flux2 Helm chart (see
# README.md in this directory), and that chart only installs
# controllers/CRDs, not this. Naming it `gotk-sync.yaml` matches what
# bootstrap itself would have called it, so this directory still looks
# like a normal Flux repo to anyone who's used `flux bootstrap` before.
#
# path: ./k8s below is deliberate and matches this whole project's layout
# now: every service (registry, clamav, postgres, monitor-api, dashboard)
# deploys as a Helm chart (see charts/) via a HelmRelease under
# k8s/releases/, and this file -- along with everything else under k8s/,
# including itself -- is what Flux reconciles. That self-reference is
# normal and matches how `flux bootstrap` output behaves too.
#
# Applied automatically by cluster/install-flux.sh (`make flux-install`,
# or automatically at the end of `make cluster-up`) right after the Helm
# install -- see README.md in this directory for the full sequence.
#
# NO secretRef: sifungurux/supply-chain-monitor is public (since #182,
# which made it so in order to get build attestations), and an anonymous
# HTTPS clone is all source-controller needs. It used to be required --
# a private repo answers an unauthenticated clone with 404, not 403, so
# the symptom was "repository not found" rather than anything about
# auth -- and `make git-auth` created the Secret for it.
#
# Dropping it removes a GitHub token from the cluster that nothing needs
# any more, and one more piece of cluster state that has to be recreated
# by hand after every rebuild. `make git-auth` and `make git-test` still
# exist for a fork that IS private.
#
# If this repo ever goes private again, restore `secretRef: {name:
# flux-system-git-auth}` below and run `make git-auth` -- see README.md
# in this directory ("Private repo authentication"). Note that going
# private also breaks ci.yml's attestation step, which is why it is
# unlikely to happen quietly.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/sifungurux/supply-chain-monitor.git
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 10m
  path: ./k8s
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 5m
