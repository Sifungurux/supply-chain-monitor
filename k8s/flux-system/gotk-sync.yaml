# This is the file `flux bootstrap` would normally generate and commit for
# you -- written by hand here instead, because this project installs the
# Flux controllers via the fluxcd-community/flux2 Helm chart (see
# README.md in this directory), and that chart only installs
# controllers/CRDs, not this. Naming it `gotk-sync.yaml` matches what
# bootstrap itself would have called it, so this directory still looks
# like a normal Flux repo to anyone who's used `flux bootstrap` before.
#
# path: ./k8s below is deliberate and matches this whole project's layout
# now: every service (registry, clamav, postgres, monitor-api, dashboard)
# deploys as a Helm chart (see charts/) via a HelmRelease under
# k8s/releases/, and this file -- along with everything else under k8s/,
# including itself -- is what Flux reconciles. That self-reference is
# normal and matches how `flux bootstrap` output behaves too.
#
# Applied automatically by cluster/install-flux.sh (`make flux-install`,
# or automatically at the end of `make cluster-up`) right after the Helm
# install -- see README.md in this directory for the full sequence.
#
# secretRef below is required because sifungurux/supply-chain-monitor is
# a *private* GitHub repo -- without it, Flux's source-controller gets an
# anonymous HTTPS clone, which GitHub answers with a 404 (private repos
# 404 rather than 403 for unauthenticated requests, so you won't see an
# auth-specific error -- just "repository not found" in
# `flux get gitrepositories` / `kubectl describe gitrepository`). The
# Secret itself is never committed here -- create it with
# `make git-auth` (wraps cluster/git-auth-secret.sh), then verify the
# credentials actually work with `make git-test` *before* relying on
# Flux to reconcile, since Flux's own retry loop gives much slower
# feedback than a direct `git ls-remote`. See README.md in this
# directory ("Private repo authentication") for the full setup.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/sifungurux/supply-chain-monitor.git
  ref:
    branch: main
  secretRef:
    name: flux-system-git-auth
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 10m
  path: ./k8s
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 5m
