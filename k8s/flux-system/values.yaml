# Helm values for the fluxcd-community/flux2 chart -- this project installs
# the Flux controllers via this Helm chart rather than `flux bootstrap`
# (which installs its own way and also auto-generates gotk-sync.yaml). See
# README.md in this directory for the full install sequence, including why
# gotk-sync.yaml (sibling of this file) has to be applied by hand as a
# separate step -- the chart only installs controllers/CRDs, it doesn't
# create that on its own.
#
# Defaults from `helm show values fluxcd-community/flux2` are fine for a
# single local dev cluster; only image-automation is trimmed since nothing
# in this repo uses it yet (promotion is still PR-based -- no
# ImageRepository/ImagePolicy/ImageUpdateAutomation in this repo today).
# Flip both back to true the day that changes.
imageAutomationController:
  create: false
imageReflectionController:
  create: false
