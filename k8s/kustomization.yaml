# Root of what Flux reconciles (see k8s/flux-system/gotk-sync.yaml's
# Kustomization -- path: ./k8s). The whole application (registry,
# clamav, postgres, monitor-api, dashboard, plus the Gateway API
# resources routing to the dashboard) is a single Helm chart
# (charts/supply-chain-monitor) via a single HelmRelease
# (releases/supply-chain-monitor-helmrelease.yaml) -- see
# docs/architecture.md, "A single chart for the whole application".
# There are no raw Deployment/Service manifests left directly in this
# tree, only the namespaces, the Flux bootstrap self-reference, and the
# two HelmReleases below.
#
# NO INGRESS CONTROLLER IS INSTALLED FROM HERE ANY MORE. This tree used
# to add Traefik (traefik-namespace.yaml, sources/traefik-helmrepository.yaml,
# releases/traefik-helmrelease.yaml) because k3d shipped no Gateway API
# implementation of its own. The mini-rack already runs Envoy Gateway as
# cluster infrastructure, so installing a second controller would be
# redundant -- the application chart's Gateway/GatewayClass/HTTPRoute
# attach to Envoy Gateway's controller instead, set in
# releases/supply-chain-monitor-helmrelease.yaml's gateway values.
#
# Those three Traefik files are still IN the repo, just not referenced
# here: they are what a k3d cluster (cluster/create-cluster.sh) would
# need, and re-adding the three lines below is the whole of putting
# Traefik back.
#
# `make deploy` no longer runs `kubectl apply -k k8s/` directly (see
# Makefile) -- it builds the local dev image, pushes/commits, and
# triggers Flux to reconcile this same tree. This file is what Flux
# builds and applies each time.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - flux-system
  - releases/supply-chain-monitor-helmrelease.yaml
  # cert-manager issues the Gateway's TLS certificate from a self-signed
  # CA -- see releases/cert-manager-helmrelease.yaml and the application
  # chart's templates/gateway/certificates.yaml. Third-party infra, so it
  # follows the namespace + HelmRepository + release shape rather than
  # folding into the application chart. Unlike the ingress controller,
  # this one is NOT provided by the rack, so the chart still installs it.
  - cert-manager-namespace.yaml
  - sources/cert-manager-helmrepository.yaml
  - releases/cert-manager-helmrelease.yaml
