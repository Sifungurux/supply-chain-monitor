# NOTE: monitor-api is no longer applied from here -- it moved to Flux
# GitOps management (see clusters/dev/monitor-api.yaml and
# k8s/monitor-api/kustomization.yaml). `make deploy` (kubectl apply -k
# k8s/) still applies everything else on this list directly; monitor-api
# is deliberately excluded so there is exactly one path that can change
# it (a merged commit, reconciled by Flux) rather than two paths that
# could silently fight each other or apply out-of-Git local edits. See
# docs/architecture.md, "Migrating monitor-api to Flux GitOps".
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - registry/pvc.yaml
  - registry/deployment.yaml
  - registry/service.yaml
  - clamav/deployment.yaml
  - clamav/service.yaml
  - postgres/secret.yaml
  - postgres/pvc.yaml
  - postgres/deployment.yaml
  - postgres/service.yaml
  - postgres/backup-pvc.yaml
  - postgres/backup-cronjob.yaml
  - dashboard/configmap.yaml
  - dashboard/config.yaml
  - dashboard/deployment.yaml
  - dashboard/service.yaml
