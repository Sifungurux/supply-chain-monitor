apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitor-api
  namespace: supply-chain-monitor
  labels:
    app: monitor-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: monitor-api
  template:
    metadata:
      labels:
        app: monitor-api
    spec:
      serviceAccountName: monitor-api
      containers:
        - name: monitor-api
          image: monitor-api:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: monitor-api-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: scm-postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: scm-monitor-api-auth
                  key: API_KEY
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            # main.go now blocks startup on connectStoreWithRetry (up
            # to 12 attempts, 5s apart -- worst case ~60s) if Postgres
            # isn't accepting connections yet, which is routine on a
            # fresh `make deploy` where both pods start at once. The
            # process doesn't even open :8080 until that finishes, so
            # readiness probes just harmlessly fail (connection
            # refused) until it does; no need to change from a short
            # initial delay since readiness failures don't restart
            # anything.
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            # Unlike readinessProbe, a liveness failure kills the pod --
            # this needs enough total slack (initialDelay +
            # periodSeconds * failureThreshold) to outlast the ~60s
            # worst-case connectStoreWithRetry loop above, or a slow
            # Postgres bring-up would get the still-retrying
            # monitor-api pod killed and restarted right as it was
            # about to succeed.
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          resources:
            # ephemeral-storage right-sized back down: unpacking a
            # container image (pull + layer extraction) no longer
            # happens in this pod at all -- it now runs in its own
            # per-scan Kubernetes Job (see
            # internal/scanner/isolated_unpacker.go), which carries its
            # own, separate ephemeral-storage limit
            # (IsolatedUnpackerConfig's defaults, currently 512Mi/2Gi --
            # not shared with or drawn from this pod's own limits at
            # all). What's left needing real disk here is just trivy's
            # own vulnerability DB cache. Memory stays bumped (768Mi ->
            # 1Gi from the original baseline): trivy's first-run DB
            # download+decompression is memory-hungry enough that a
            # "trivy scan failed ...: signal: killed" error can be an
            # OOM-kill rather than (or in addition to) the
            # request-context bug fixed in internal/api/handlers.go.
            requests:
              cpu: "200m"
              memory: "384Mi"
              ephemeral-storage: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
              ephemeral-storage: "512Mi"
