# This is monitor-api's own kustomize base -- what makes it possible for
# Flux to `kustomize build` this directory on its own, independent of the
# rest of k8s/ (which the top-level k8s/kustomization.yaml still owns).
# See clusters/dev/monitor-api.yaml for the Flux Kustomization CR that
# points at this path, and docs/architecture.md, "Migrating monitor-api
# to Flux GitOps", for the full picture.
#
# Deliberately NOT included here: namespace.yaml, postgres/*, registry/*,
# clamav/*, dashboard/* -- those are shared cluster-wide resources or
# belong to other services, and stay managed by the top-level
# k8s/kustomization.yaml (`make deploy`) for now. This Kustomization
# assumes the supply-chain-monitor namespace and its Postgres/registry/
# ClamAV dependencies already exist in the cluster before Flux reconciles
# this path -- see the dependsOn note in clusters/dev/monitor-api.yaml.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - serviceaccount.yaml
  - scan-worker-serviceaccount.yaml
  - rbac.yaml
  - auth-secret.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
