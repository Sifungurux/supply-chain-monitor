# Used only by the per-scan Jobs internal/scanner/isolated_unpacker.go
# creates -- deliberately separate from monitor-api's own ServiceAccount
# (see serviceaccount.yaml + rbac.yaml). No Role is ever bound to this
# one: the pod that unpacks and parses untrusted image content has zero
# Kubernetes API access, not just a token-less version of monitor-api's
# own scoped-down access.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scm-scan-worker
  namespace: supply-chain-monitor
automountServiceAccountToken: false
