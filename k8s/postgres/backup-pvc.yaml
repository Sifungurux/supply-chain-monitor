# Separate from scm-postgres-data (the live database's own PVC) on
# purpose: a backup that lives on the exact same volume as the data
# it's backing up wouldn't survive the one failure mode backups exist
# for in the first place (that PVC/its underlying storage getting
# corrupted or lost). 5Gi is generous for gzip-compressed dumps of a
# local dev database retained via the CronJob's own KEEP_BACKUPS
# rotation (see backup-cronjob.yaml) -- resize if you raise that
# retention count or the database grows a lot.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: scm-postgres-backups
  namespace: supply-chain-monitor
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
