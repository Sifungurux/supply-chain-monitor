# Dev-only credentials for the in-cluster Percona Postgres instance.
# "changeme123" is a placeholder for a local, single-user test
# cluster -- change it (and switch to a real secret-management flow)
# before this points at anything shared. See docs/architecture.md and
# README's Known limitations.
apiVersion: v1
kind: Secret
metadata:
  name: scm-postgres-credentials
  namespace: supply-chain-monitor
type: Opaque
stringData:
  POSTGRES_USER: monitor_api
  POSTGRES_PASSWORD: changeme123
  POSTGRES_DB: monitor_api
