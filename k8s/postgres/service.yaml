# ClusterIP only -- unlike scm-registry/monitor-api/dashboard, nothing
# outside the cluster needs to reach Postgres directly. monitor-api
# talks to it at scm-postgres.supply-chain-monitor.svc.cluster.local:5432
# (see k8s/monitor-api/configmap.yaml's POSTGRES_HOST default).
apiVersion: v1
kind: Service
metadata:
  name: scm-postgres
  namespace: supply-chain-monitor
spec:
  selector:
    app: scm-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
  type: ClusterIP
