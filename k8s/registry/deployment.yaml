apiVersion: apps/v1
kind: Deployment
metadata:
  name: scm-registry
  namespace: supply-chain-monitor
  labels:
    app: scm-registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scm-registry
  template:
    metadata:
      labels:
        app: scm-registry
    spec:
      containers:
        - name: registry
          image: registry:2
          ports:
            - containerPort: 5000
          env:
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "true"
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
          readinessProbe:
            httpGet:
              path: /v2/
              port: 5000
            initialDelaySeconds: 3
          livenessProbe:
            httpGet:
              path: /v2/
              port: 5000
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: scm-registry-data
