apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: clamav
  namespace: flux-system
spec:
  interval: 5m
  chart:
    spec:
      chart: ./charts/clamav
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  targetNamespace: supply-chain-monitor
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  # ClamAV's first boot (freshclam DB download) can take a few minutes
  # -- give wait a correspondingly generous timeout so a fresh install
  # doesn't get marked failed while it's still just downloading.
  timeout: 5m
  values: {}
