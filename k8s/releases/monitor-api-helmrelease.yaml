# dependsOn postgres/registry/clamav: monitor-api's own
# connectStoreWithRetry already tolerates Postgres not being ready yet
# (~60s of retries), but making the dependency explicit here means Flux
# won't even attempt to reconcile this HelmRelease until those three are
# themselves Ready -- a real ordering guarantee the old flat `kubectl
# apply -k k8s/` list never had, not just a hope that retries paper over
# timing.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: monitor-api
  namespace: flux-system
spec:
  interval: 5m
  dependsOn:
    - name: postgres
    - name: registry
    - name: clamav
  chart:
    spec:
      chart: ./charts/monitor-api
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  targetNamespace: supply-chain-monitor
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  timeout: 3m
  # image.tag stays "dev" (the chart's default) for local iteration --
  # `make deploy` rebuilds monitor-api:dev and rollout-restarts the
  # Deployment directly, since Flux/Helm alone can't detect a same-tag
  # image change. apiKey/credentials overrides go here too, if this ever
  # points at more than a throwaway local cluster.
  values: {}
