apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: postgres
  namespace: flux-system
spec:
  interval: 5m
  chart:
    spec:
      chart: ./charts/postgres
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  targetNamespace: supply-chain-monitor
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  wait: true
  timeout: 3m
  # Credentials stay at charts/postgres/values.yaml's dev-only defaults
  # for this local cluster -- override credentials.password here (never
  # commit a real one) before this points at anything shared. See
  # charts/postgres/values.yaml's own comment.
  values: {}
