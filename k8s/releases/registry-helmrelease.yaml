# Chart lives in this same repo (charts/registry), sourced from the
# flux-system GitRepository Flux itself is bootstrapped from -- no
# separate HelmRepository/OCIRepository needed. See
# docs/architecture.md, "All services on Flux + Helm", for the full
# picture of why every service moved to this pattern.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: registry
  namespace: flux-system
spec:
  interval: 5m
  chart:
    spec:
      chart: ./charts/registry
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  targetNamespace: supply-chain-monitor
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  wait: true
  timeout: 3m
  # No values overrides today -- charts/registry/values.yaml's defaults
  # are exactly what this project has always run with. Override here
  # (not in the chart) if this cluster ever needs to differ, e.g. a
  # larger persistence.size.
  values: {}
