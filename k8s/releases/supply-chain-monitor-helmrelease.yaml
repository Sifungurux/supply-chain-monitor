# The whole application -- registry, clamav, postgres, monitor-api,
# dashboard, and the Gateway API resources routing to the dashboard --
# as a single HelmRelease pointing at the single flattened chart in
# charts/supply-chain-monitor. Replaces what used to be 5 separate
# HelmReleases (one per service, each with its own chart) -- see
# docs/architecture.md, "A single chart for the whole application", for
# why and what changed.
#
# No dependsOn needed between the former 5 services: they're all one
# Helm release now, so Helm's own resource-kind apply ordering
# (Secrets/ConfigMaps/PVCs before Deployments/Jobs/CronJobs, across the
# whole chart) replaces what dependsOn used to guarantee between
# separate HelmReleases -- e.g. the dashboard's render-config
# initContainer reading monitor-api's scm-monitor-api-auth Secret still
# works correctly, since that Secret is created in the same
# apply-ordering wave as every other Secret, before any Deployment.
# monitor-api's own connectStoreWithRetry (main.go) remains the
# belt-and-suspenders layer for Postgres specifically not yet accepting
# connections when monitor-api's own pod starts.
#
# Traefik itself is NOT part of this HelmRelease/chart -- see
# k8s/releases/traefik-helmrelease.yaml -- it's third-party
# infrastructure, not this application.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: supply-chain-monitor
  namespace: flux-system
spec:
  # The application chart renders cert-manager CRs (Issuer/Certificate)
  # when gateway.tls.enabled is on, so it must not install before
  # cert-manager's CRDs exist. Flux would eventually converge by
  # retrying, but a dependency states the ordering rather than relying
  # on a failure loop to discover it.
  dependsOn:
    - name: cert-manager
      namespace: flux-system
  interval: 5m
  chart:
    spec:
      chart: ./charts/supply-chain-monitor
      # Confirmed the hard way: reconcileStrategy defaults to
      # "ChartVersion", which -- per Flux's own docs -- only builds a
      # new chart artifact when Chart.yaml's `version:` field changes.
      # For a GitRepository-sourced chart (ours), that's almost never
      # what you want: Chart.yaml's version stayed frozen at 0.1.0
      # through many real template changes (including this whole
      # isolated-Trivy-scanning feature), so Flux never rebuilt the
      # chart or upgraded the release at all -- `flux get helmreleases`
      # kept showing "Helm install succeeded ... .v1" forever, even
      # though `kubectl get gitrepository ... -o jsonpath='{.status.artifact.revision}'`
      # matched HEAD exactly the whole time. "Revision" makes Flux
      # rebuild the chart (and therefore actually reconcile the
      # release) whenever the GitRepository's resolved commit changes,
      # which is the behavior this project's "every push deploys"
      # workflow (see Makefile's `deploy` target) always assumed was
      # already happening. See docs/architecture.md ("GitRepository
      # revision matching HEAD is not enough").
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  targetNamespace: supply-chain-monitor
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  # ClamAV's first boot (freshclam DB download) can take a few minutes --
  # give wait a correspondingly generous timeout so a fresh install
  # doesn't get marked failed while it's still just downloading (same
  # reasoning the old, separate clamav-helmrelease.yaml had).
  timeout: 15m
  # postgres.credentials.password and monitorApi.apiKey are empty in
  # the chart's own values.yaml on purpose -- a real value there would
  # sit in plaintext in this file, in git. valuesFrom below sources
  # them (plus the three registry account passwords) from the
  # scm-chart-secrets Secret instead (create/update it
  # with `make chart-secrets`, see cluster/chart-secrets.sh and
  # README's "Bringing your own secrets") -- that Secret is cluster
  # state, never a committed file. spec.values (below) takes precedence
  # over valuesFrom per Flux's own merge order, so as long as
  # dashboard.*/etc. below never sets these two keys, this stays safe.
  valuesFrom:
    - kind: Secret
      name: scm-chart-secrets
      valuesKey: postgres-password
      targetPath: postgres.credentials.password
    - kind: Secret
      name: scm-chart-secrets
      valuesKey: api-key
      targetPath: monitorApi.apiKey
    # Named per-client keys, as the flat "name:key,name:key" string the
    # chart and binary both parse. optional, because a cluster whose
    # scm-chart-secrets predates this feature has no api-keys entry and
    # must keep reconciling rather than fail closed on a missing key --
    # the shared apiKey above still authenticates in that case.
    - kind: Secret
      name: scm-chart-secrets
      valuesKey: api-keys
      targetPath: monitorApi.apiKeys
      optional: true
    # The three docker_auth registry accounts. Same reasoning as the two
    # above -- values.yaml ships them empty, and an account with no
    # password is omitted from docker_auth's config entirely rather than
    # rendered as a hash of "" (which would accept an empty password).
    # So without these, the registry refuses everyone, including
    # monitor-api's own pulls.
    - kind: Secret
      name: scm-chart-secrets
      valuesKey: registry-reader-password
      targetPath: dockerAuth.accounts.reader.password
    - kind: Secret
      name: scm-chart-secrets
      valuesKey: registry-writer-password
      targetPath: dockerAuth.accounts.writer.password
    - kind: Secret
      name: scm-chart-secrets
      valuesKey: registry-admin-password
      targetPath: dockerAuth.accounts.admin.password
  # image.tag stays "dev" (the chart's default) for local iteration --
  # `make deploy` rebuilds monitor-api:dev and rollout-restarts the
  # Deployment directly, since Flux/Helm alone can't detect a same-tag
  # image change.
  values:
    dashboard:
      # Chart default is false (fail-closed) -- this local dev cluster
      # is the one deployment that actually wants the manual-registration
      # link, so it's opted back in here rather than by flipping the
      # chart's own default.
      allowManualRegistration: true
      # User asked to hide the API base/key fields and Refresh button
      # from this cluster's dashboard -- chart default stays true so no
      # other deployment silently loses them.
      showConnectionSettings: false
    monitorApi:
      # Report grype findings by CVE id rather than by the advisory id
      # that matched (grype --by-cve). Chart default is false, set true
      # here because the cost was measured ON THIS CLUSTER and is
      # already paid for.
      #
      # What it buys here, measured: a full scan of mysql:8.4 went from
      # 155 open findings to 88 with no loss of coverage -- 21 findings
      # that were counted twice (once as CVE- from trivy, once as ELSA-
      # from grype) became one attributed to both, and grype's own
      # duplicate advisories for a single CVE collapsed. Per-finding
      # EPSS coverage on that artifact went 0% to 99%.
      #
      # What it costs here, also measured: 2,945 of 11,539 open grype
      # findings get renamed, each leaving a wrong "fixed" record and a
      # reset first_seen_at. Acceptable on THIS cluster specifically
      # because nothing keys off those ids -- no notifiers configured
      # (so nothing pages), no VEX documents, no risk acceptances. A
      # deployment with any of those should leave the chart default.
      #
      # Not every image benefits: of nine surveyed, four (nginx,
      # rabbitmq, haproxy, echoserver) already emitted only CVE ids and
      # are completely unaffected. The gain is concentrated in consul
      # (0 -> 166), mysql (0 -> 76) and mongo (39 -> 109), and does not
      # track base distro, so it can only be measured, never predicted.
      grypeDB:
        byCVE: true
      # Daily CVE re-evaluation from each image's stored SBOM. Chart
      # default is disabled; enabled here now that the mode runs trivy
      # rather than grype (PR #162) and therefore produces ids that
      # merge with, enrich, and dedupe against what the image scan
      # already recorded.
      #
      # WHAT THIS BUYS on this cluster: a CVE published today shows up
      # against the whole fleet the next morning instead of waiting for
      # each artifact to age past scanFreshness.rescanAfterDays and be
      # re-pulled. The full sweep still does everything else -- malware,
      # secrets, digests, mirroring -- and remains the only thing that
      # can mark a CVE fixed.
      #
      # SIZING, for the 92 eligible artifacts here: batchSize 0 means
      # the whole eligible fleet in one run, and the sweep processes
      # artifacts SEQUENTIALLY (it waits for each scan to finish so it
      # can report the outcome). At the ~20s a measured sbom-doc scan
      # takes, that is ~31 minutes against the 55-minute budget. If the
      # fleet grows enough to exhaust that budget the run stops
      # cleanly and logs what it did not reach -- but the next run is
      # 24h later, so raise timeoutMinutes rather than letting it clip.
      sweepSbom:
        enabled: true
      # Copy every registered artifact into scm-registry and scan the
      # copy instead of pulling from docker.io/ghcr.io on every scan.
      # Chart default is false, set true here for the same reason as
      # maxArtifacts below: this is a decision about THIS cluster, and no
      # other deployment of the chart should silently start consuming
      # registry disk.
      #
      # Why here specifically: this cluster's scans pull 40 image
      # artifacts from public registries on every sweep. Anonymous Docker
      # Hub pull limits are the most common single cause of a failed scan
      # here, and re-downloading the same layers every fifteen minutes is
      # the bulk of the egress this cluster does.
      #
      # Costs, both already provisioned: registry disk (registry.
      # persistence.size is 50Gi -- and on this cluster's local-path
      # StorageClass that figure enforces nothing, so node disk is the
      # real ceiling) and a push-capable registry account for monitor-api
      # (MIRROR_REGISTRY_*, rendered from dockerAuth.accounts.writer,
      # which valuesFrom above already supplies).
      #
      # The 40 artifacts registered before this was enabled are
      # back-filled by the sweep CronJob, paced by its batch size -- they
      # are neither "registered" nor "failed", so a dedicated pass picks
      # them up. Expect the fleet to drain over several sweep cycles, not
      # in one.
      mirrorArtifacts:
        enabled: true
      # Highest rung that completed clean in the 2026-08-24 ramp: 13%
      # faster than 8, where 16 broke the registry for a further 3%. See
      # docs/scan-concurrency-2026-08-24.md. Raise the registry's memory
      # limit before raising this again -- at cap 16 the failure was
      # scm-registry being OOMKilled, not anything about scanning.
      scanConcurrency: 12
      # Cap how many artifacts may exist at once. Set here rather than in
      # the chart, same reasoning as the two dashboard values above: the
      # chart default stays 0 (unlimited), which is what every other
      # deployment of this chart had before the cap existed, so nobody
      # silently gains a quota they didn't ask for.
      #
      # 500 is sized off what this cluster actually does. It holds 94
      # artifacts today, and the load test re-registers a ~95-image
      # corpus on every run -- which is a no-op at the cap, since
      # duplicates are refused before they consume quota, but the
      # headroom needs to cover a genuinely new batch on top of what is
      # already there. 500 is also exactly what one maximum-size bulk
      # request can carry (maxBulkArtifacts), so a single such request
      # against an empty store fits precisely.
      #
      # Over the cap is a 403, not a 429: retrying cannot help, only
      # deleting artifacts can. Raise this value or delete artifacts if
      # the dashboard starts reporting refused registrations.
      maxArtifacts: 500
      # Cap concurrent image extraction. Set here rather than in the
      # chart for the same reason as maxArtifacts: the chart default
      # stays 0 (bounded only by the global scanConcurrency), so no
      # other deployment silently gains a limit it did not ask for.
      #
      # Why this exists at all: until unpacker 0.7.1, 47 of the 95 image
      # references in this cluster were OCI indexes, and every one of
      # them unpacked to an EMPTY directory. Half the fleet extracted
      # nothing, so every disk measurement taken here described a
      # scanner doing no work for half its inputs. Within ten minutes of
      # deploying the fix, scm-clamav, scm-postgres and a scan Job were
      # all evicted for ephemeral-storage.
      #
      # 2, not 3: three concurrent scans is what produced those
      # evictions.
      #
      # This bounds whole IMAGE scans, not just the malware leg, and
      # that is the point rather than a side effect. Scan slots are
      # acquired all-or-nothing across scanner kinds (see
      # tryAcquireScanSlots), so a scan that cannot get an unpacker slot
      # is refused entirely -- and trivy's image-mode Jobs extract the
      # whole image too, so bounding image scans bounds both extractors.
      # file/sbom/sarif artifacts never take an unpacker slot and are
      # unaffected; they still use the global scanConcurrency.
      #
      # A refused scan is a 429 with Retry-After, never a queue. The
      # sweep CronJob treats that as routine and retries on its next
      # run; a CI caller has to retry, which is why
      # examples/tekton/scm-tasks.yaml does.
      #
      # This is the cheap half of the fix. The real one is moving scan
      # scratch off node disk with monitorApi.scanScratch.storageClass
      # -- all four k3d "nodes" share one 42.3GB filesystem, so the node
      # count does not multiply the disk and this cap is the only thing
      # actually limiting simultaneous extraction on it.
      scanConcurrencyPerKind:
        # 2 -> 12. The 2 was derived on a 42.3GB VM where three concurrent
        # image scans caused ephemeral-storage evictions. That VM is gone;
        # the cluster is 300GB and the 2026-08-24 ramp put peak disk in a
        # 92-96GB band with DiskPressure never true. 12 is the highest rung
        # that completed clean -- 16 OOMKilled the registry.
        #
        # Kept equal to scanConcurrency above on purpose: image scans take
        # an unpacker slot, so a lower value here silently caps the global
        # number and makes it a lie.
        unpacker: 12
