# Traefik as the cluster's ingress controller, configured for the
# Kubernetes Gateway API specifically (not classic Ingress, and not
# Traefik's own IngressRoute CRDs) -- see
# charts/supply-chain-monitor/templates/gateway/ for the
# GatewayClass/Gateway/HTTPRoute that actually route to the dashboard
# (owned by the application chart itself, not this chart -- see
# gatewayClass.enabled below), and docs/architecture.md ("Ingress:
# Traefik + Gateway API") for the full picture, including why the
# version pins below matter and how this interacts with k3s's own
# bundled Traefik.
#
# version 41.0.2 / appVersion v3.7.6 was the latest published chart as
# of this writing (see https://traefik.github.io/charts/index.yaml) --
# pinned rather than left floating, same reproducibility reasoning as
# every other version pin in this project.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: flux-system
spec:
  interval: 10m
  chart:
    spec:
      chart: traefik
      version: "41.0.2"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
  targetNamespace: traefik
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  timeout: 5m
  values:
    # This is the whole point: enables Traefik's Gateway API provider,
    # so it actually watches GatewayClass/Gateway/HTTPRoute objects.
    # Requires the Gateway API CRDs to already exist in the cluster
    # (cluster/install-gateway-api.sh, run automatically by
    # create-cluster.sh -- NOT something this chart installs itself).
    providers:
      kubernetesGateway:
        enabled: true
      # Not used by this project -- everything routes through the
      # Gateway API instead. Disabling both keeps Traefik's watch/RBAC
      # surface limited to what's actually in use; flip either back on
      # if you introduce a classic Ingress or a Traefik-native
      # IngressRoute later.
      kubernetesIngress:
        enabled: false
      kubernetesCRD:
        enabled: false

    # Both disabled: the application chart
    # (charts/supply-chain-monitor/templates/gateway/) owns the
    # GatewayClass, Gateway, and HTTPRoute itself now (a "skeleton" of
    # all three, hand-written there rather than relying on this chart's
    # own default-object convenience behavior). Leaving these enabled
    # here too would create a second, competing GatewayClass/Gateway --
    # Helm would refuse to install one of the two once it noticed
    # another release already owns an object with the same name.
    gatewayClass:
      enabled: false
    gateway:
      enabled: false

    # NodePort with a fixed port, matching every other Service in this
    # project (registry 30500, monitor-api 30300, dashboard 30301) --
    # deliberately not the chart's default (LoadBalancer), so exposure
    # works identically on both the colima and podman/k3d runtimes
    # without depending on k3s's Klipper LB vs. k3d's own loadbalancer
    # container behaving the same way. See cluster/k3d-config.yaml's
    # 30080:30080 mapping and colima's --network-address (cluster/
    # runtimes/colima.sh) for how each runtime makes this reachable from
    # the host.
    service:
      type: NodePort
    ports:
      web:
        nodePort: 30080
      # TLS now terminates at the Gateway, with a cert-manager-issued
      # certificate (charts/supply-chain-monitor/templates/gateway/
      # certificates.yaml), so this port can complete a real handshake
      # and is exposed rather than disabled.
      #
      # The Gateway's https listener must name Traefik's INTERNAL
      # EntryPoint port (8443), not this NodePort -- the same distinction
      # that silently programmed no route at all when the http listener
      # first used 80 instead of 8000. See gateway.yaml's comment.
      #
      # Reaching https://localhost:30443 from the HOST additionally
      # requires cluster/k3d-config.yaml to map that port, which it does
      # not by default -- k3d fixes host port mappings at cluster-create
      # time, so adding one means editing or recreating the cluster.
      # Until then this is reachable in-cluster and via port-forward.
      websecure:
        nodePort: 30443
        expose:
          default: true
