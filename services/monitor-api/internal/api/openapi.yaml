openapi: 3.0.3
info:
  title: Supply Chain Monitor API
  description: >-
    Tracks artifacts (container images, files, SBOMs, SARIF reports) as they
    move through a software supply chain: registration, scanning, pipeline
    stage history, and CVE/malware/misconfiguration/secret/other findings.
    Everything the dashboard shows is available here -- this is the same API
    it calls, so anything read on the dashboard can be read or written
    directly through this spec.
  version: "1.0"
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: artifacts
    description: Register, list, inspect, scan, and delete artifacts.
  - name: findings
    description: Submit or query CVE/malware/misconfiguration/secret/other findings.
  - name: documents
    description: Upload/download generated SBOM and SARIF documents.
  - name: pipeline
    description: Pipeline stage configuration and per-artifact stage history.
  - name: meta
    description: Service health and fleet-wide counts.

paths:
  /healthz:
    get:
      tags: [meta]
      summary: Liveness probe — the process only, never its dependencies
      description: >-
        Answers 200 as long as this process is serving HTTP. It
        deliberately does not check the database: a liveness failure
        makes the kubelet kill the container, so checking a dependency
        here would turn a Postgres outage into every pod restarting on a
        loop for its whole duration. Use `/readyz` for "can this pod
        actually serve a request".
      security: []
      responses:
        "200":
          description: The process is up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }

  /readyz:
    get:
      tags: [meta]
      summary: Readiness probe — is the backing store reachable
      description: >-
        Unlike `/healthz`, this one actually checks the database. It
        backs the Kubernetes readiness probe: a pod failing it is
        removed from the Service and stops receiving traffic, then
        rejoins on its own once the check passes again.


        Deliberately NOT what the liveness probe uses. A liveness
        failure kills the container, so checking a dependency there
        would turn a Postgres outage into every pod restarting on a loop
        for as long as it lasted.


        Unauthenticated, like `/healthz` — a kubelet probe can't present
        an API key, and the response carries no fleet data.
      security: []
      responses:
        "200":
          description: The store is reachable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ready }
        "503":
          description: >-
            The store could not be reached within the probe's own short
            timeout. `error` carries the reason for whoever is reading
            `kubectl describe pod`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: unavailable }
                  error: { type: string }

  /metrics:
    get:
      tags: [meta]
      summary: Prometheus metrics (text exposition format)
      description: >-
        Process and scan counters for scraping: requests by status
        class, scans started/succeeded/failed, goroutines, heap,
        uptime.


        Unauthenticated, like the probes, because it exposes PROCESS
        state only and never fleet security posture — nothing here says
        which artifacts carry malware. `/api/v1/stats` is where fleet
        counts live, and it requires the API key. A fleet gauge added
        here would have to come with authentication.


        Nothing in this response touches the database, deliberately: a
        scrape endpoint that queried Postgres would fail exactly when
        the database is down, which is when the scrape data matters
        most.
      security: []
      responses:
        "200":
          description: Metrics in the Prometheus text exposition format.
          content:
            text/plain:
              schema: { type: string }

  /api/v1/pipeline/stages:
    get:
      tags: [pipeline]
      summary: List the configured pipeline stage names, in order
      responses:
        "200":
          description: Configured stages.
          content:
            application/json:
              schema:
                type: object
                properties:
                  stages:
                    type: array
                    items: { type: string }
                    example: [source, build, test, scan, sign, publish, deploy]

  /api/v1/stats:
    get:
      tags: [meta]
      summary: Fleet-wide artifact and finding counts
      description: >-
        Aggregate counts across every artifact in the store, in one
        call. This is what the dashboard's summary cards and pipeline
        strip read: /api/v1/artifacts is paginated, so counting a page
        of it answers "of these 50", not "of all 812".


        Every number counts ARTIFACTS, never findings --
        `with_findings.cve: 3` means three artifacts each have at least
        one active CVE, not that three CVEs exist. "Active" means
        neither fixed nor VEX-suppressed, the same population
        /api/v1/findings and /api/v1/findings/{findingID}/artifacts
        report.


        Takes no filters deliberately: it is the one number set for the
        whole store. A filtered view's own size already comes back as
        `total` on /api/v1/artifacts.
      responses:
        "200":
          description: Fleet-wide counts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Stats" }

  /api/v1/artifacts:
    get:
      tags: [artifacts]
      summary: List artifacts, newest first (paginated)
      description: >-
        Returns one page of artifacts. `total` (and the `X-Total-Count`
        header) is how many artifacts match the filters, not how many are
        in this page. Follow the `Link` header's `next`/`prev` relations
        to page through the rest.
      parameters:
        - name: limit
          in: query
          description: Page size. Anything above 200 is a 400, not a silent clamp.
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          description: How many artifacts to skip.
          schema: { type: integer, minimum: 0, default: 0 }
        - name: status
          in: query
          description: >-
            Only artifacts with this exact status. An unrecognized value
            matches nothing (an empty page), it isn't an error.
          schema: { type: string, example: scanned }
        - name: type
          in: query
          description: Only artifacts of this exact type.
          schema: { type: string, enum: [image, file, sbom, sarif] }
        - name: q
          in: query
          description: >-
            Case-insensitive SUBSTRING search across ref, digest,
            maintainer team, maintainer email and current stage — the
            fields somebody actually remembers an artifact by.


            Combined with `status`/`type` rather than replacing them:
            all three are ANDed. An unmatched search is an empty page,
            not an error, and `%`/`_` match themselves rather than
            acting as wildcards.


            `X-Total-Count` and the `Link` URLs all describe the SEARCH
            result, and `q` is carried into next/prev — paging through a
            search keeps searching.
          schema: { type: string, example: nginx }
      responses:
        "200":
          description: One page of artifacts.
          headers:
            X-Total-Count:
              description: >-
                Artifacts matching the filters AND the search, across
                all pages.
              schema: { type: integer }
            Link:
              description: >-
                RFC 5988 next/prev links (relative references), present
                only when there is a page in that direction. Carries
                every filter in force, `q` included.
              schema: { type: string }
              example: '</api/v1/artifacts?limit=50&offset=50>; rel="next"'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArtifactPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      tags: [artifacts]
      summary: Register one artifact
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateArtifactRequest" }
      responses:
        "201":
          description: Registered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Artifact" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ArtifactLimitReached" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "409":
          description: >-
            expected_digest didn't match the resolved digest, or an artifact
            with this digest is already registered.
          content:
            application/json:
              schema: { type: object }

  /api/v1/artifacts/bulk:
    post:
      tags: [artifacts]
      summary: Register up to 500 artifacts in one request
      description: >-
        Best-effort, not all-or-nothing: one bad entry doesn't block the
        rest. Each entry gets its own result (created, duplicate, or
        failed) in the response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [artifacts]
              properties:
                artifacts:
                  type: array
                  maxItems: 500
                  items: { $ref: "#/components/schemas/CreateArtifactRequest" }
      responses:
        "201":
          description: At least one artifact was created or matched an existing one.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkCreateArtifactsResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }

  /api/v1/artifacts/{id}:
    parameters:
      - $ref: "#/components/parameters/ArtifactID"
    get:
      tags: [artifacts]
      summary: Get one artifact by id
      responses:
        "200":
          description: The artifact.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Artifact" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [artifacts]
      summary: Permanently delete an artifact
      description: >-
        Removes the artifact along with its stage history and findings.
        There is no undo.
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: deleted }
                  id: { type: string }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/artifacts/{id}/scan:
    parameters:
      - $ref: "#/components/parameters/ArtifactID"
    post:
      tags: [artifacts]
      summary: Start a scan (asynchronous)
      description: >-
        Starts a scan and returns 202 immediately -- it does not wait for
        the scan to finish. Every scanner registered for the artifact's
        type then runs concurrently in the background, results are merged
        into the five finding buckets, and findings that stopped being
        reported are marked fixed.


        Poll GET /api/v1/artifacts/{id} (the Location header points
        there) until status leaves "scanning": it settles on "scanned",
        or "failed" if every scanner failed. The 202 body is the artifact
        as the scan started, so its findings are the previous scan's.


        Scanning is capped server-side (SCAN_CONCURRENCY /
        monitorApi.scanConcurrency, off by default). A request arriving
        with every slot busy is rejected immediately with 429 +
        Retry-After -- there is no queue, since no caller is waiting on
        the response -- and the artifact is left untouched, not marked
        scanning.
      responses:
        "202":
          description: >-
            Scan started. Body is the artifact at status "scanning";
            Location points at the resource to poll.
          headers:
            Location:
              description: The artifact to poll for the result.
              schema: { type: string }
              example: /api/v1/artifacts/8f14e45fceea167a
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Artifact" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429":
          description: >-
            The scan concurrency cap is saturated. Retry after the
            interval in the Retry-After header. (Per-key rate limiting
            can also answer 429 -- the error message distinguishes them.)
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "501":
          description: No scanner is registered for this artifact's type.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/artifacts/{id}/stage:
    parameters:
      - $ref: "#/components/parameters/ArtifactID"
    post:
      tags: [pipeline]
      summary: Record this artifact at a pipeline stage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stage]
              properties:
                stage: { type: string, example: build }
                note: { type: string }
      responses:
        "200":
          description: Updated artifact, with the new stage event appended to stage_history.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Artifact" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/artifacts/{id}/maintainer:
    parameters:
      - $ref: "#/components/parameters/ArtifactID"
    post:
      tags: [artifacts]
      summary: Set (or replace) this artifact's maintainer team/email
      description: Both fields are required -- there is no partial update.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [team, email]
              properties:
                team: { type: string, example: platform-security }
                email: { type: string, format: email, example: platform-security@example.com }
      responses:
        "200":
          description: Updated artifact.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Artifact" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/artifacts/{id}/findings:
    parameters:
      - $ref: "#/components/parameters/ArtifactID"
    post:
      tags: [findings]
      summary: Submit findings computed elsewhere, for one bucket
      description: >-
        For results a system other than this API's own registered scanners
        already computed (an external pipeline scanner, a SAST tool run in
        CI). Only the named bucket is touched -- the other four are left
        alone. Findings are merged, not replaced: a finding not present in
        this call is marked fixed, exactly as scanArtifact does.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bucket, findings]
              properties:
                bucket:
                  type: string
                  enum: [cve, malware, misconfiguration, secret, other]
                findings:
                  type: array
                  items: { $ref: "#/components/schemas/Finding" }
      responses:
        "200":
          description: Updated artifact.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Artifact" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/findings:
    get:
      tags: [findings]
      summary: Search finding ids by substring
      description: >-
        The discovery step in front of
        /api/v1/findings/{findingID}/artifacts, mirroring
        /api/v1/components?q=: you know "log4j", not "CVE-2021-44228".
        Returns the DISTINCT finding ids whose id or title contains the
        substring (case-insensitive), each with its worst-seen severity,
        a title, and how many artifacts are affected -- most widespread
        first, capped at 200 with the true total reported alongside.


        Counts only findings that are neither fixed nor VEX-suppressed,
        which is the same population the artifact lookup returns, so the
        number here and the list you get by clicking through agree.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
          example: log4j
      responses:
        "200":
          description: Matching finding ids (empty list if none).
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                    description: Finding ids matching before the 200-id cap.
                    example: 3
                  findings:
                    type: array
                    items: { $ref: "#/components/schemas/FindingMatch" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/findings/{findingID}/artifacts:
    get:
      tags: [findings]
      summary: Find every artifact currently affected by one finding id
      parameters:
        - name: findingID
          in: path
          required: true
          schema: { type: string }
          example: CVE-2024-1234
      responses:
        "200":
          description: >-
            Artifacts where this finding is still active -- neither
            fixed nor VEX-suppressed (empty array if none).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Artifact" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/components:
    get:
      tags: [findings]
      summary: Search the component inventory, or list every artifact containing one component
      description: >-
        Queries the component inventory parsed out of each artifact's
        ingested SBOM (see POST /api/v1/artifacts/{id}/documents/sbom).
        Two modes, which are the two steps of one task:


        `?q=openssl` searches: it returns the DISTINCT packages whose
        name or purl contains that substring (case-insensitive), each
        with the number of artifacts containing it, most widespread
        first. This exists because nobody knows they want
        `pkg:apk/alpine/openssl@3.1.4-r5?arch=x86_64` -- they know
        "openssl". Capped at 200 packages, with the true total always
        reported alongside.


        `?purl=…` answers: it returns every artifact containing exactly
        that purl, qualifiers included. Matching stays exact here on
        purpose -- "any version of this package" is a different
        question, and softening this one would quietly include packages
        you didn't ask about.


        Supply one or the other; `purl` wins if both are given, being
        the more specific request. Query parameters rather than path
        segments because a purl contains slashes, "@" and often a query
        string of its own.
      parameters:
        - name: purl
          in: query
          required: false
          description: Exact purl. Returns artifacts.
          schema: { type: string }
          example: pkg:apk/alpine/openssl@3.1.4-r5
        - name: license
          in: query
          required: false
          description: >-
            EXACT SPDX identifier. Returns artifacts containing a
            component carrying it. Matched per identifier and
            case-insensitively, never as a substring — `GPL-3.0-only`
            does not match `LGPL-3.0-only`, and does not match inside
            the expression `MIT OR AGPL-3.0-only` where the `OR` is the
            permissive escape. Same rule LICENSE_DENYLIST applies.
          schema: { type: string }
          example: AGPL-3.0-only
        - name: q
          in: query
          required: false
          description: Substring of a package name or purl. Returns matching packages.
          schema: { type: string }
          example: openssl
      responses:
        "200":
          description: >-
            With `purl`: the artifacts containing that component (empty
            array if none). With `q`: the matching packages plus how
            many matched in total.
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items: { $ref: "#/components/schemas/Artifact" }
                  - type: object
                    properties:
                      total:
                        type: integer
                        description: Packages matching before the 200-package cap.
                        example: 3
                      packages:
                        type: array
                        items: { $ref: "#/components/schemas/ComponentMatch" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/artifacts/{id}/components/diff:
    get:
      tags: [artifacts]
      summary: What changed in this artifact's SBOM between two scans
      description: >-
        Compares two component snapshots and reports what was added,
        removed, and upgraded. Every scan that indexes an SBOM writes a
        snapshot; the last 10 per artifact are kept.


        With no parameters this compares the two most recent snapshots.
        `from` and `to` select a specific pair and must be given
        together — timestamps as returned in this endpoint's own
        `from`/`to` fields.


        `version_changed` exists because a purl embeds its version, so
        an upgrade changes the purl: a diff keyed on purl alone reports
        every upgrade as an unrelated removal plus addition, which is
        the one thing anyone comparing two SBOMs is actually looking
        for. Packages are matched on exact purl first, then by package
        identity with the version stripped.


        Fewer than two snapshots is a 200 with null `from`/`to` and
        three empty lists, not a 404 — an artifact indexed only once has
        genuinely had nothing change yet.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: from
          in: query
          description: The older snapshot. Requires `to`.
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: The newer snapshot. Requires `from`.
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: The difference between the two snapshots.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComponentDiff" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/artifacts/{id}/policy:
    get:
      tags: [artifacts]
      summary: Would this artifact pass the configured policy gate
      description: >-
        Evaluates the deployment's policy (`POLICY_JSON` /
        `monitorApi.policy`) against one artifact and reports pass/fail
        with a reason per violation.


        **Always 200 when the artifact exists — a failing policy is not
        an HTTP error.** A CI step running `curl --fail` cannot tell a
        non-2xx meaning "this artifact violates the policy" from one
        meaning "the API is down, the id is wrong, or my key is
        invalid" — and the first must block a release while the others
        must be investigated, not silently treated as a failed gate.
        Read `pass` from the body. See README, "Gating a pipeline on
        policy".


        Only ACTIVE findings are considered: anything fixed or
        VEX-suppressed is excluded, so a critical a human has already
        assessed as not_affected does not keep failing builds.


        With no policy configured every artifact passes with an empty
        `violations` list and `configured: false` — which is how a
        caller tells that apart from clearing a real gate.
      parameters:
        - $ref: "#/components/parameters/ArtifactID"
      responses:
        "200":
          description: >-
            The evaluation. Note this is returned for a FAILING policy
            too.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyResult" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/artifacts/{id}/documents/{kind}:
    parameters:
      - $ref: "#/components/parameters/ArtifactID"
      - $ref: "#/components/parameters/DocumentKind"
    get:
      tags: [documents]
      summary: Download a generated SBOM or SARIF document
      responses:
        "200":
          description: Raw document bytes.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404":
          description: No document of this kind has been captured for this artifact yet.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      tags: [documents]
      summary: Upload a generated SBOM or SARIF document
      description: >-
        Internal write path used by scan workers to store a document too
        large to return through the normal findings channel. Body is the
        raw document bytes (max 64MiB).
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: saved }
                  id: { type: string }
                  kind: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/artifacts/{id}/vex:
    parameters:
      - $ref: "#/components/parameters/ArtifactID"
    post:
      tags: [findings]
      summary: Upload a VEX document and suppress the findings it clears
      description: >-
        Accepts an OpenVEX or CycloneDX-VEX document (raw bytes, max
        4MiB) asserting what this artifact is and isn't affected by.
        Statements with status `not_affected` or `fixed` are applied to
        the artifact's existing findings immediately -- the matching
        finding's status becomes `not_affected`/`fixed` with the
        statement's justification attached, which drops it out of every
        count while keeping it visible on the artifact. `affected` and
        `under_investigation` change nothing. Suppression persists
        across later scans: a scanner reporting the vulnerability again
        does not reopen it. The document is also stored (document kind
        `vex`) and re-read on every scan, so a finding discovered later
        is suppressed the moment it appears.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Applied.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: applied }
                  statements:
                    type: integer
                    description: How many statements were understood.
                    example: 3
                  artifact: { $ref: "#/components/schemas/Artifact" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        Every endpoint except /healthz requires
        `Authorization: Bearer <API key>`.


        Keys can carry SCOPES (`monitorApi.apiKeyScopes`): `read`,
        `register`, `scan`, `documents:write`, `admin`. A key without
        the scope a route requires gets **403**, not 401 — the
        credential is valid and identified, it simply may not do this.


        Scope enforcement is opt-in. With none configured every key is
        full-privilege, which is how this API behaved before scopes
        existed; a key with no entry stays unrestricted even once
        others have scopes, so scoping one consumer cannot break the
        rest.

  parameters:
    ArtifactID:
      name: id
      in: path
      required: true
      schema: { type: string }
    DocumentKind:
      name: kind
      in: path
      required: true
      schema: { type: string, enum: [sbom, sarif] }

  responses:
    Forbidden:
      description: >-
        The API key is valid but lacks the scope this route requires.
        See the bearerAuth description and monitorApi.apiKeyScopes.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ArtifactLimitReached:
      description: >-
        The deployment's artifact limit (MAX_ARTIFACTS /
        monitorApi.maxArtifacts) has been reached. Delete artifacts to
        free capacity, or raise the limit. 403 rather than 429 because a
        quota is not a rate limit -- retrying does not help.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PayloadTooLarge:
      description: >-
        Request body exceeded this endpoint's size limit (64KiB for small
        JSON writes, 4MiB for bulk registration, 16MiB for findings
        submission, 64MiB for a document upload).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadRequest:
      description: Invalid request body or parameters.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No artifact with this id.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      properties:
        error: { type: string }

    PolicyViolation:
      type: object
      required: [rule, detail]
      properties:
        rule:
          type: string
          description: >-
            Which policy rule failed. One of maxSeverity,
            disallowUnsafe, requireSBOM, requireScanWithinDays,
            licenseDenylist.
          example: maxSeverity
        detail:
          type: string
          description: Why it failed, in a form worth putting in a build log.
          example: 'cve: critical finding "OpenSSL buffer overflow" exceeds the "high" this policy allows'
        finding_id:
          type: string
          description: >-
            The specific finding that caused this violation, when one
            did. Absent for artifact-level rules like requireSBOM,
            which no single finding is responsible for.
          example: CVE-2024-2511

    PolicyResult:
      type: object
      required: [pass, violations, configured]
      properties:
        configured:
          type: boolean
          description: >-
            Whether any policy rule was actually in force. Without this
            a caller cannot tell "cleared the gate" from "there is no
            gate" — both are `pass: true` with no violations, and the
            chart ships an empty policy by default.
          example: true
        pass:
          type: boolean
          description: >-
            True when nothing violated the policy. Also true when no
            policy is configured at all.
          example: false
        violations:
          type: array
          description: >-
            Every rule that failed, in a stable order so a CI job
            diffing this response between runs sees a change only when
            something changed. Empty, never null, on a pass.
          items: { $ref: "#/components/schemas/PolicyViolation" }

    Stats:
      type: object
      required: [total, by_status, by_type, with_findings, by_stage]
      properties:
        total:
          type: integer
          description: Artifacts in the store.
          example: 812
        by_status:
          type: object
          additionalProperties: { type: integer }
          description: >-
            Artifacts per status. Only statuses something is actually in
            appear -- read a missing key as 0.
          example: { registered: 12, scanning: 3, scanned: 780, failed: 17 }
        by_type:
          type: object
          additionalProperties: { type: integer }
          description: >-
            Artifacts per type. Only types something is actually of
            appear -- read a missing key as 0.
          example: { image: 640, file: 120, sbom: 40, sarif: 12 }
        with_findings:
          type: object
          additionalProperties: { type: integer }
          description: >-
            Artifacts with at least one ACTIVE finding in each bucket --
            neither fixed nor VEX-suppressed. One artifact with nine
            open CVEs counts once, not nine times. Unlike the other
            three maps, all five buckets are always present, zero
            included: "no artifact has malware" is a statement worth
            making rather than leaving a caller to infer from a missing
            key.
          example: { cve: 214, malware: 2, misconfiguration: 61, secret: 4, other: 33 }
        stale_after_days:
          type: integer
          description: >-
            Days since an artifact's last scan before it counts as
            stale. 0 means the freshness warning is switched off
            entirely — clients should render no warning rather than
            treating everything as stale.
          example: 7
        stale:
          type: integer
          description: >-
            Artifacts last scanned longer ago than that. NEVER-scanned
            artifacts are excluded: they sit at status `registered` and
            the sweep CronJob already collects them, so counting them
            here would double-report them. Keyed on when a scan last
            COMPLETED, which includes a failed one — an artifact failing
            every scan therefore stays "fresh" here and is never counted
            stale. Failures are handled separately rather than through
            this count: `last_scan_failure_reason` reports the cause,
            `by_status.failed` the fleet total, and the sweep CronJob
            retries every failed artifact on each run regardless of age.
          example: 12
        by_stage:
          type: object
          additionalProperties: { type: integer }
          description: >-
            Artifacts per current pipeline stage. Artifacts that have
            not been staged yet are counted under the EMPTY-STRING key,
            not a placeholder name -- the stage list is deployment
            configuration (PIPELINE_STAGES), so any name invented here
            could collide with a real configured stage, and "" cannot.
            Stages nothing has reached are absent -- read as 0.
          example: { build: 300, scan: 402, deploy: 40, "": 70 }

    Component:
      type: object
      required: [purl]
      properties:
        purl:
          type: string
          description: >-
            The Package URL — the identity that makes "which artifacts
            contain this exact package" answerable across ecosystems.
          example: pkg:apk/alpine/openssl@3.1.4-r5
        name: { type: string, example: openssl }
        version: { type: string, example: 3.1.4-r5 }
        licenses:
          type: string
          description: >-
            Comma-joined license identifiers — SPDX ids where the
            document gave one, otherwise a free-text name or an SPDX
            expression stored verbatim. Empty means the SBOM said
            nothing usable (NOASSERTION/NONE are dropped), not that the
            package is unlicensed.
          example: MIT,Apache-2.0

    ComponentDiff:
      type: object
      required: [from, to, added, removed, version_changed]
      properties:
        from:
          type: string
          format: date-time
          nullable: true
          description: >-
            The older snapshot compared, or null when there were fewer
            than two to compare.
        to:
          type: string
          format: date-time
          nullable: true
          description: The newer snapshot compared, or null.
        added:
          type: array
          description: Packages present in `to` and not in `from`.
          items: { $ref: "#/components/schemas/Component" }
        removed:
          type: array
          description: Packages present in `from` and not in `to`.
          items: { $ref: "#/components/schemas/Component" }
        version_changed:
          type: array
          description: >-
            The same package at a different version. Reported separately
            from added/removed because an upgrade is one event, not a
            removal plus an unrelated addition.
          items:
            type: object
            required: [purl, from, to]
            properties:
              purl:
                type: string
                description: The NEW purl — what the artifact contains now.
                example: pkg:apk/alpine/openssl@3.1.4-r6
              from: { type: string, example: 3.1.4-r5 }
              to: { type: string, example: 3.1.4-r6 }

    ArtifactPage:
      type: object
      required: [total, artifacts]
      properties:
        total:
          type: integer
          description: >-
            Artifacts matching the filters across all pages -- not the
            length of `artifacts`. Mirrors the X-Total-Count header, for
            callers that can't read response headers.
          example: 812
        artifacts:
          type: array
          items: { $ref: "#/components/schemas/Artifact" }

    CreateArtifactRequest:
      type: object
      required: [ref, type]
      properties:
        ref:
          type: string
          description: >-
            An OCI registry reference. Validated before anything is
            fetched with it: a URL scheme, a *.svc.cluster.local host,
            or a host resolving to a loopback/link-local/private address
            is refused with a 400 (REF_HOST_ALLOWLIST exempts named
            hosts). A local filesystem path (leading /, ., or ~) is also
            refused unless the deployment set
            ALLOW_LOCAL_ARTIFACT_PATHS with LOCAL_ARTIFACT_ROOT, and
            then only inside that root.
          example: "ghcr.io/acme/checkout-service:2.4.1"
        type:
          type: string
          enum: [image, file, sbom, sarif]
        expected_digest:
          type: string
          description: >-
            Required if this deployment has REQUIRE_DIGEST enabled
            (monitorApi.requireDigest); optional otherwise. Normally,
            registration is refused (409) unless the ref's resolved
            digest matches this exactly (pins against a mutable tag).
            Under REQUIRE_DIGEST, a mismatch (or an unresolvable ref)
            does NOT refuse registration -- the artifact is still
            created, with `unsafe: true` instead.
          example: "sha256:3f2a9c1b..."
        maintainer_team:
          type: string
        maintainer_email:
          type: string
          format: email

    BulkCreateArtifactsResponse:
      type: object
      properties:
        created: { type: integer }
        failed: { type: integer }
        duplicates: { type: integer }
        results:
          type: array
          items:
            type: object
            properties:
              ref: { type: string }
              type: { type: string }
              artifact: { $ref: "#/components/schemas/Artifact" }
              error: { type: string }
              duplicate: { type: boolean }

    Finding:
      type: object
      properties:
        id:
          type: string
          example: CVE-2024-1234
        severity:
          type: string
          example: high
        title: { type: string }
        source:
          type: string
          example: trivy
        status:
          type: string
          enum: [open, fixed, not_affected]
          description: >-
            `not_affected` means a VEX document uploaded for this
            artifact asserts the vulnerability does not apply here (see
            POST /api/v1/artifacts/{id}/vex). Like `fixed`, it is
            excluded from every count but kept on the artifact.
          readOnly: true
        first_seen_at:
          type: string
          format: date-time
          readOnly: true
        resolved_at:
          type: string
          format: date-time
          readOnly: true
        justification:
          type: string
          description: Why a VEX statement suppressed this finding. Empty otherwise.
          example: vulnerable_code_not_in_execute_path
          readOnly: true

    FindingMatch:
      type: object
      description: >-
        One distinct finding id found by a `?q=` search, with how many
        artifacts it is active in. Not a finding -- this is an aggregate
        across artifacts.
      properties:
        id:
          type: string
          example: CVE-2021-44228
        title:
          type: string
          example: "log4j: Remote code execution via JNDI lookup"
        severity:
          type: string
          description: The worst severity recorded for this id across artifacts.
          example: critical
        artifacts:
          type: integer
          description: Number of distinct artifacts where it is active.
          example: 12

    ComponentMatch:
      type: object
      description: >-
        One distinct package found by a `?q=` search, with how many
        artifacts contain it. Not a component row -- this is an
        aggregate across artifacts.
      properties:
        purl:
          type: string
          example: pkg:apk/alpine/openssl@3.1.4-r5
        name:
          type: string
          example: openssl
        version:
          type: string
          example: 3.1.4-r5
        licenses:
          type: string
          description: Comma-joined license identifiers for this package.
          example: MIT,Apache-2.0
        artifacts:
          type: integer
          description: Number of distinct artifacts containing this purl.
          example: 41

    StageEvent:
      type: object
      properties:
        stage: { type: string }
        timestamp: { type: string, format: date-time }
        note: { type: string }

    Artifact:
      type: object
      properties:
        id: { type: string }
        ref: { type: string }
        digest:
          type: string
          description: Resolved OCI content digest, if available.
        provenance:
          type: string
          enum: ["", verified, unsigned, unverified]
          description: >-
            What cosign signature verification concluded (report H2).


            A FIELD rather than the absence of a finding, because a
            verified image produces no finding — one per signed image
            would bury the unsigned ones. Without this, "signed" would
            be indistinguishable from "cosign is switched off" and from
            "never scanned since it was switched on".


            `""` is not-checked and is NOT a pass. `unverified` means
            the check could not be completed (registry unreachable,
            trust root unusable) and is deliberately distinct from
            `unsigned` — an outage must not read as an accusation.
          example: verified
        provenance_checked_at:
          type: string
          format: date-time
          description: >-
            When that conclusion was reached, so a "verified" from
            before an image was retagged is visible as stale rather
            than current.
        provenance_trust_root:
          type: string
          description: >-
            WHICH Sigstore judged it — the public instance, or a named
            private deployment. "Verified" means different things
            against each, so a badge that showed one for both would
            assert more than it can support.
          example: private Sigstore, trusted root /etc/sigstore/trusted_root.json
        unsafe:
          type: boolean
          description: >-
            Set at registration time when REQUIRE_DIGEST was enabled and
            the provided expected_digest didn't match what actually
            resolved (or nothing resolved at all). Never set any other
            way -- a scan backfilling a missing digest never touches
            this.
        maintainer_team: { type: string }
        maintainer_email: { type: string }
        type:
          type: string
          enum: [image, file, sbom, sarif]
        status:
          type: string
          enum: [registered, scanning, scanned, failed]
        current_stage: { type: string }
        stage_history:
          type: array
          items: { $ref: "#/components/schemas/StageEvent" }
        cve_findings:
          type: array
          items: { $ref: "#/components/schemas/Finding" }
        malware_findings:
          type: array
          items: { $ref: "#/components/schemas/Finding" }
        misconfiguration_findings:
          type: array
          items: { $ref: "#/components/schemas/Finding" }
        secret_findings:
          type: array
          items: { $ref: "#/components/schemas/Finding" }
        other_findings:
          type: array
          items: { $ref: "#/components/schemas/Finding" }
        last_scan_errors:
          type: array
          description: >-
            Classified messages from the most recent FAILED scan. Retained
            after a later successful scan, so its presence does not mean the
            artifact is failing now -- compare last_scan_error_at against
            last_scan_at to tell the two apart.
          items: { type: string }
        last_scan_error_at:
          type: string
          format: date-time
          description: >-
            When the messages in last_scan_errors were recorded. Absent if the
            artifact has never failed a scan. Earlier than last_scan_at means
            the artifact has since recovered.
        last_scan_at: { type: string, format: date-time }
        has_sbom: { type: boolean }
        has_sarif: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
